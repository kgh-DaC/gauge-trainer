<!doctype html>
<html lang="ko">

<title>정밀측정 눈금읽기 연습</title>
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#0969da; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#4493f8; } }
  html, body { height:100%; height:100dvh; margin:0; }
  body { display:flex; flex-direction:column; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, "Malgun Gothic", sans-serif; }
  nav { display:flex; flex-wrap:wrap; gap:4px; padding:8px 12px 0; border-bottom:1px solid var(--line); flex:none; }
  nav button { font:inherit; padding:6px 10px; border:1px solid transparent; border-bottom:none; border-radius:8px 8px 0 0; background:transparent; color:var(--muted); cursor:pointer; white-space:nowrap; }
  nav button[aria-selected="true"] { color:var(--fg); border-color:var(--line); background:var(--bg); font-weight:600; box-shadow:0 2px 0 var(--bg); position:relative; top:1px; }
  main { flex:1; min-height:0; }
  iframe { width:100%; height:100%; border:0; display:none; }
  iframe.on { display:block; }
</style>

<script>
(function () {
  var WIDGETS = {"vernier":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>버니어캘리퍼스 눈금읽기\u003c/title>\n\u003cstyle>\n  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#0969da; --ok:#1a7f37;\n          --tick:#111; --hl:#d1242f; --win:#0969da; --edge:#5f6a75;\n          --m1:#fbfcfd; --m2:#dfe4e9; --m3:#c4ccd4; --m4:#8f9aa5;\n          --s1:#eef1f4; --s2:#cbd2d9; --s3:#adb7c1; --s4:#7b8792;\n          --p1:#f7f9fb; --p2:#e3e8ed; --p3:#cfd6dd;\n          --k1:#6b7580; --k2:#3e464f; --k3:#262c33;\n          --b1:#eceff2; --b2:#dde2e7; --b3:#cfd5db;\n          --f1:#9aa4ae; --f2:#c9d0d7; --brush:.9;\n          --egink:#34465a; --eghi:#ffffff; --eghio:.9; --egsh:#0b1520; --egsho:.55;\n          --red:#e3001b; --halo:#ffffff; --rd:#0550ae; }\n  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#4493f8; --ok:#3fb950;\n          --tick:#f0f3f6; --hl:#ff7b72; --win:#4493f8; --edge:#151a20;\n          --m1:#6a7581; --m2:#4b5560; --m3:#3c4550; --m4:#262d35;\n          --s1:#76818d; --s2:#56616c; --s3:#46505a; --s4:#2c333b;\n          --p1:#5d6874; --p2:#4a545f; --p3:#3b444e;\n          --k1:#4b5560; --k2:#2a3139; --k3:#14181d;\n          --b1:#56616c; --b2:#4b5560; --b3:#424b55;\n          --f1:#2a3139; --f2:#4b5560; --brush:.35;\n          --egink:#161d26; --eghi:#c9d3dd; --eghio:.45; --egsh:#000000; --egsho:.75;\n          --red:#ff2a2a; --halo:#0d1117; --rd:#58a6ff; } }\n  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, \"Malgun Gothic\", sans-serif; }\n  .gw-wrap { max-width:1000px; margin:0 auto; }\n  .gw-wrap h2 { margin:0 0 4px; font-size:1.3em; }\n  .gw-hint { color:var(--muted); font-size:.9em; margin:0 0 8px; }\n  .gw-svg { width:100%; height:auto; touch-action:none; user-select:none; -webkit-user-select:none; display:block; }\n  .gw-svg:focus { outline:2px solid var(--accent); outline-offset:2px; }\n  .gw-zoombox { border:1px solid var(--line); border-radius:8px; padding:8px; margin-top:8px; }\n  .gw-zoomhead { display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:.9em; color:var(--muted); margin-bottom:6px; }\n  .gw-bar { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; align-items:center; }\n  .gw-seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }\n  .gw-seg button { border:0; border-radius:0; padding:6px 12px; }\n  .gw-seg button + button { border-left:1px solid var(--line); }\n  .gw-seg button.on { background:var(--accent); color:#fff; }\n  button { font:inherit; padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); cursor:pointer; }\n  button:disabled { opacity:.35; cursor:not-allowed; }\n  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }\n  .gw-answer { display:none; padding:12px; border:1px solid var(--ok); border-radius:8px; }\n  .gw-answer.open { display:block; }\n  .gw-value { font-size:1.6em; font-weight:700; color:var(--ok); }\n  .gw-sub { color:var(--muted); }\n  .gw-brush { opacity:var(--brush); }\n  .gw-eg-ink { flood-color:var(--egink); }\n  .gw-eg-hi { flood-color:var(--eghi); flood-opacity:var(--eghio); }\n  .gw-eg-sh { flood-color:var(--egsh); flood-opacity:var(--egsho); }\n  .gw-logo-t { fill:#000; font-family:system-ui, \"Malgun Gothic\", sans-serif; text-anchor:middle; font-weight:600; letter-spacing:-.2px; }\n  .gw-grab { cursor:grab; }\n  .gw-grab:active { cursor:grabbing; }\n  .gw-zsvg { cursor:ew-resize; }\n  .gw-tick { stroke:var(--tick); }\n  .gw-num { fill:var(--tick); font-family:system-ui, \"Malgun Gothic\", sans-serif; text-anchor:middle; }\n  .gw-hln { fill:var(--red); font-weight:700; }\n  .gw-match { stroke:var(--red); stroke-linecap:butt; }\n  .gw-halo { stroke:var(--halo); stroke-opacity:.85; }\n  .gw-read { stroke:var(--rd); }\n  .gw-tagr { fill:var(--red); font-family:system-ui, \"Malgun Gothic\", sans-serif; text-anchor:middle; font-weight:700; }\n  .gw-tagb { fill:var(--rd); font-family:system-ui, \"Malgun Gothic\", sans-serif; text-anchor:middle; font-weight:700; }\n  .gw-winr { fill:none; stroke:var(--win); stroke-width:1.5; stroke-dasharray:5 3; }\n  .gw-edge { stroke:var(--edge); stroke-width:1; stroke-linejoin:round; }\n  .gw-knurl { stroke:var(--k3); stroke-width:1; opacity:.55; }\n  .gw-lbl { fill:var(--muted); font-family:system-ui, \"Malgun Gothic\", sans-serif; }\n  .gw-stage { display:flex; flex-direction:column; }\n  /* 좁은 화면(JS가 .gw-narrow 부여): 확대 창 → 버튼 → 정답 → 슬라이더 주변 그림 순서 */\n  .gw-narrow .gw-zoombox { order:1; margin-top:0; padding:6px; }\n  .gw-narrow .gw-ctl { order:2; display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }\n  .gw-narrow .gw-ctl button { padding:10px 6px; white-space:nowrap; }\n  .gw-narrow .gw-answer { order:3; margin-bottom:10px; }\n  .gw-narrow .gw-main { order:4; }\n  .gw-narrow .gw-hint { font-size:.82em; }\n  .gw-narrow .gw-seg button { padding:6px 9px; }\n  .gw-narrow .gw-zoomhead { gap:6px; }\n  .gw-narrow .gw-value { font-size:1.4em; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"gw-root\">\u003c/div>\n\u003cscript>\n(function () {\n  'use strict';\n  const ID = 'vernier';\n  const TITLE = '버니어캘리퍼스';\n  const NS = 'vernier-';\n\n  // ---- 화면/기구 상수 (정수 단위 1/100 mm) ----\n  const MAIN_MAX_MM = 150;      // 본척 눈금은 0~150mm만 그림 (15cm)\n  const BEAM_END = 15500;       // 본척 몸체 끝(눈금 없음) = 155mm\n  const TAIL = 400;             // 부척 0번 선 ~ 슬라이더 오른쪽 끝 = SPAN + 4mm\n  const PLATE = 200;            // 부척 마지막 선 ~ 부척판 끝 = 2mm\n  const MARGIN = 200;           // 슬라이더 끝 ~ 150mm 선 여유 2mm (숫자 15가 가려지지 않게)\n\n  // ---- 옵션 (명세 1절). MAX = 150mm − SPAN − TAIL − MARGIN : 슬라이더가 148mm를 넘지 않도록 ----\n  const OPTS = {\n    // 1/20형: 본척 39mm를 20등분 (부척 1칸 1.95mm = 2mm − 0.05mm), 1/50형: 본척 49mm를 50등분 (0.98mm = 1mm − 0.02mm)\n    '20': { key: '20', label: '1/20 (0.05mm)', STEP: 5, DIV: 20, SPAN: 3900, RES: '0.05', NUM_EVERY: 2, MAX: 10500 },\n    '50': { key: '50', label: '1/50 (0.02mm)', STEP: 2, DIV: 50, SPAN: 4900, RES: '0.02', NUM_EVERY: 5, MAX: 9500 }\n  };\n  let opt = OPTS['20'];                  // 기본: 1/20형\n  const STATE_MIN = 0;\n\n  // ---- 상태: x (슬라이드 위치, 1/100 mm 정수, x % STEP == 0, 0 ≤ x ≤ opt.MAX) ----\n  let state = 0, last = -1, revealed = false;\n\n  // ---- 명세 함수 ----\n  function pitch() { return opt.SPAN / opt.DIV; }        // 195 또는 98 (정수)\n  // 부척 n번째 선과 일치하는 본척 선(mm) = 본척 읽기 M + n × (P + STEP)/100  (1/20형: M+2n, 1/50형: M+n)\n  function matchMain(o) { o = o || opt; return (o.SPAN / o.DIV + o.STEP) / 100; }\n  function fmt(u) { return Math.floor(u / 100) + '.' + String(u % 100).padStart(2, '0'); }\n  function gwa(k) { return [0, 1, 3, 6, 7, 8].indexOf(k % 10) >= 0 ? '과' : '와'; }   // 받침 유무에 따른 조사\n  function answer(s, o) {\n    o = o || opt;\n    const M = Math.floor(s / 100);\n    const r = s % 100;\n    const n = Math.round(r / o.STEP);\n    const value = M * 100 + n * o.STEP;\n    let sub;\n    if (o.NUM_EVERY === 2) {\n      sub = (n % 2 === 0) ? '(부척 숫자 ' + (n / 2) + ' 위치)'\n                          : '(부척 숫자 ' + ((n - 1) / 2) + gwa((n - 1) / 2) + ' ' + ((n + 1) / 2) + ' 사이)';\n    } else {\n      sub = (n % 5 === 0) ? '(부척 숫자 ' + (n / 5) + ' 위치)'\n                          : '(부척 숫자 ' + Math.floor(n / 5) + '에서 ' + (n % 5) + '칸 오른쪽)';\n    }\n    return { M: M, n: n, value: value, valueText: fmt(value) + ' mm',\n             text: '본척 ' + M + 'mm + 부척 ' + n + '번째 선 × ' + o.RES + 'mm = ' + fmt(value) + 'mm', sub: sub };\n  }\n  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }\n  function randomState() {\n    const MX = opt.MAX / 100;            // 105 또는 95 (mm)\n    let s;\n    do {\n      const r = Math.random();\n      if (r \u003c 0.70) s = randInt(0, opt.MAX / opt.STEP) * opt.STEP;               // 균등\n      else if (r \u003c 0.85) s = randInt(0, MX) * 100;                                // n = 0\n      else s = randInt(0, MX - 1) * 100 + (opt.DIV - 1) * opt.STEP;               // n = 최대\n    } while (s === last);\n    last = s;\n    return s;\n  }\n\n  // ---- 화면 좌표 (전체 보기): 5.6 px/mm → 1/100mm 당 0.056 ----\n  // 고정 조 머리(본척 0 왼쪽)를 넓혀 학교 로고·문구 자리를 만든다 → 전체 viewBox 폭 VBW\n  const X0 = 150, PXU = 0.056, VBW = 1080, VBH = 340;\n  function sx(u) { return X0 + u * PXU; }\n  const BEAM_L = X0 - 132;               // 본척 몸체 왼쪽 끝(고정 조 머리)\n  const BEAM_R = sx(BEAM_END);           // 본척 몸체 오른쪽 끝\n  const Y_BT = 80, Y_SC = 160;           // 본척 윗면, 본척 눈금 기준선(=부척 윗변)\n\n  // 확대 창: 배율 ×1 고정. 폭 ZW viewBox(데스크톱 1000, 좁은 화면 500), 창 폭 W(1/100mm)\n  let winLeft = 0;\n  // 좁은 화면(폭 \u003c 640px) 모드: 확대 창을 맨 위·크게, 전체 그림은 슬라이더 주변(VW 폭)만 보여 줌\n  const NARROW_PX = 640;\n  let narrow = false, ZW = 1000, VW = VBW, mvx = 0;\n  function winW() { return opt.SPAN + 1000; }\n  function zk() { return ZW / winW(); }\n  function zx(u) { return (u - winLeft) * zk(); }\n  function trackInterval() { return [state - 200, state + opt.SPAN + 200]; }\n  function followWindow() {\n    const t = trackInterval(), W = winW();\n    if (t[0] \u003c winLeft) winLeft = t[0];\n    if (t[1] > winLeft + W) winLeft = t[1] - W;\n  }\n  function recenter() {\n    const t = trackInterval();\n    winLeft = (t[0] + t[1]) / 2 - winW() / 2;\n  }\n\n  let root, svg, zsvg, gDyn, gZoom, ans, btnMinus, btnPlus, hintEl;\n  function mount(el) {\n    root = el;\n    el.innerHTML =\n      '\u003cdiv class=\"gw-wrap\">' +\n      '\u003ch2>' + TITLE + ' 눈금읽기\u003c/h2>' +\n      '\u003cp class=\"gw-hint\" id=\"' + NS + 'hint\">\u003c/p>' +\n      '\u003cdiv class=\"gw-bar\">\u003cspan>부척\u003c/span>\u003cdiv class=\"gw-seg\" id=\"' + NS + 'opt\">' +\n        '\u003cbutton data-o=\"20\">' + OPTS['20'].label + '\u003c/button>\u003cbutton data-o=\"50\">' + OPTS['50'].label + '\u003c/button>\u003c/div>\u003c/div>' +\n      '\u003cdiv class=\"gw-stage\">' +\n      '\u003csvg class=\"gw-svg gw-main\" id=\"' + NS + 'svg\" viewBox=\"0 0 ' + VBW + ' ' + VBH + '\" tabindex=\"0\" role=\"img\" aria-label=\"버니어캘리퍼스 전체 모습. 화살표 키로 슬라이더 미세 이동\">\u003c/svg>' +\n      '\u003cdiv class=\"gw-zoombox\">' +\n        '\u003cdiv class=\"gw-zoomhead\">\u003cspan id=\"' + NS + 'ztitle\">\u003c/span>\u003c/div>' +\n        '\u003csvg class=\"gw-svg gw-zsvg\" id=\"' + NS + 'zsvg\" viewBox=\"0 0 1000 200\">\u003c/svg>' +\n      '\u003c/div>' +\n      '\u003cdiv class=\"gw-bar gw-ctl\">' +\n        '\u003cbutton id=\"' + NS + 'minus\">◀ −\u003c/button>\u003cbutton id=\"' + NS + 'plus\">+ ▶\u003c/button>' +\n        '\u003cbutton class=\"primary\" id=\"' + NS + 'reveal\">정답확인\u003c/button>' +\n        '\u003cbutton id=\"' + NS + 'new\">새 문제\u003c/button>\u003c/div>' +\n      '\u003cdiv class=\"gw-answer\" id=\"' + NS + 'ans\">\u003c/div>' +\n      '\u003c/div>\u003c/div>';\n    svg = el.querySelector('#' + NS + 'svg');\n    zsvg = el.querySelector('#' + NS + 'zsvg');\n    ans = el.querySelector('#' + NS + 'ans');\n    hintEl = el.querySelector('#' + NS + 'hint');\n    btnMinus = el.querySelector('#' + NS + 'minus');\n    btnPlus = el.querySelector('#' + NS + 'plus');\n    el.querySelector('#' + NS + 'reveal').onclick = reveal;\n    el.querySelector('#' + NS + 'new').onclick = newProblem;\n    btnMinus.onclick = function () { setState(state - opt.STEP); };\n    btnPlus.onclick = function () { setState(state + opt.STEP); };\n    el.querySelectorAll('#' + NS + 'opt button').forEach(function (b) {\n      b.onclick = function () { setOption(b.getAttribute('data-o')); };\n    });\n    svg.addEventListener('keydown', function (e) {\n      let d = 0;\n      if (e.key === 'ArrowLeft') d = -1; else if (e.key === 'ArrowRight') d = 1; else return;\n      e.preventDefault();\n      setState(state + d * (e.shiftKey ? 100 : opt.STEP));\n    });\n    buildStatic();\n    bindDrag();\n    layout(true);\n    setOption('20', true);\n    // 폭이 바뀌면(회전, 탭 전환으로 처음 보이게 될 때 등) 배치를 다시 정한다\n    if (window.ResizeObserver) new ResizeObserver(function () { layout(false); }).observe(el);\n    else window.addEventListener('resize', function () { layout(false); });\n  }\n\n  // ---- 화면 폭에 따른 배치 ----\n  function layout(initial) {\n    const w = root.getBoundingClientRect().width;\n    if (!w) return;                                         // 숨겨진 탭 안: 보일 때 다시 호출됨\n    const n = w \u003c NARROW_PX;\n    if (!initial && n === narrow) return;\n    narrow = n;\n    ZW = n ? 500 : 1000;\n    VW = n ? 440 : VBW;\n    root.querySelector('.gw-wrap').classList.toggle('gw-narrow', n);\n    zsvg.setAttribute('viewBox', '0 0 ' + ZW + ' 200');\n    root.querySelector('#' + NS + 'ztitle').textContent = n\n      ? '확대 창 (×1) — 끌면 슬라이더가 움직입니다'\n      : '확대 창 (×1, 점선 영역) — 여기서 끌어도 슬라이더가 움직입니다';\n    if (initial) return;                                    // 첫 배치는 setOption이 이어서 그림\n    recenter();\n    mainFollow(true);\n    draw();\n  }\n  // 좁은 화면에서 전체 그림의 보이는 구간(mvx ~ mvx+VW)이 슬라이더를 따라가게 한다\n  function mainFollow(reset) {\n    if (!narrow) { mvx = 0; }\n    else {\n      const lo = sx(state) - 45, hi = sx(state + opt.SPAN + TAIL) + 12;\n      if (reset) mvx = (lo + hi) / 2 - VW / 2;\n      else { if (lo \u003c mvx) mvx = lo; if (hi > mvx + VW) mvx = hi - VW; }\n      mvx = Math.max(0, Math.min(VBW - VW, mvx));\n    }\n    svg.setAttribute('viewBox', r1(mvx) + ' 0 ' + VW + ' ' + VBH);\n  }\n\n  function setOption(k, silent) {\n    opt = OPTS[k];\n    last = -1;\n    root.querySelectorAll('#' + NS + 'opt button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-o') === k); });\n    btnMinus.textContent = '◀ −' + opt.RES + 'mm';\n    btnPlus.textContent = '+' + opt.RES + 'mm ▶';\n    hintEl.textContent = '슬라이더(아들자·이동 조)를 끌어 원하는 위치에 놓고 값을 읽어 보세요. 어미자(본척) 숫자는 cm 단위입니다(1 = 10mm). ' +\n      '측정 범위: 0 ~ ' + fmt(opt.MAX) + 'mm (본척 0~150mm 안에 아들자가 모두 들어오는 범위).';\n    newProblem();\n  }\n\n  // ---- 드래그 (Po -size:15px; }\n    .gw-wrap h2 { font-size:1.08em; }\n    .gw-help { font-size:.82em; }\n    .gw-mode { padding:6px 8px; gap:6px; }\n    .gw-mode-lab { width:100%; }\n    .gw-seg { width:100%; }\n    .gw-seg button { flex:1 1 50%; padding:8px 6px; font-size:.92em; }\n    .gw-mode-note { display:none; }\n    .gw-zoombox { padding:6px; gap:6px; }\n    .gw-zsvg { flex:1 1 100%; max-width:340px; margin:0 auto; }\n    .gw-zcap { font-size:.82em; }\n    .gw-bar button { flex:1 1 40%; }\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"gw-root\">\u003c/div>\n\u003cscript>\n(function () {\n  const ID = 'outside-mic';\n  const TITLE = '외측마이크로미터';\n\n  // \u003ccalc> ---- 정수 연산만 사용 ----\n  // 상태 q = 심블 앞단 위치, 단위 1/1000 mm(정수), 0~25000.\n  // 일반 모드(0.01mm)에서는 q가 항상 10의 배수, 버니어 모드(0.001mm)에서는 1 단위.\n  const Q_MIN = 0, Q_MAX = 25000;\n  const MODE_INFO = {\n    normal:  { step: 10, res: '0.01mm',  label: '일반 0.01mm' },\n    vernier: { step: 1,  res: '0.001mm', label: '버니어 0.001mm' }\n  };\n  let mode = 'normal';                      // 기본: 일반 모드\n\n  function stepOf(m) { return m === 'vernier' ? 1 : 10; }\n  function snapQ(v, m) {\n    const s = stepOf(m || mode);\n    const c = Math.max(Q_MIN, Math.min(Q_MAX, Math.round(v)));\n    return Math.round(c / s) * s;           // Q_MAX(25000)는 10의 배수라 범위를 넘지 않음\n  }\n\n  function readParts(q) {\n    const sleeveMm = Math.floor(q / 1000);            // 노출된 마지막 1mm 눈금\n    const half = Math.floor(q / 500) % 2;             // 0.5mm 눈금 노출 여부\n    const thimble = Math.floor((q % 500) / 10);       // 기선을 지난 심블 눈금(0~49)\n    const vernier = q % 10;                           // 일치하는 부척 선 번호(0~9, 0은 10과 동시 일치)\n    return { q: q, sleeveMm: sleeveMm, half: half, thimble: thimble, vernier: vernier,\n             check: (sleeveMm * 1000 + half * 500 + thimble * 10 + vernier) === q };\n  }\n\n  function formatQ(q, m) {                  // 문자열 변환만 사용 (부동소수점 나눗셈 없음)\n    const ip = Math.floor(q / 1000), fp = q % 1000;\n    if (m === 'vernier') return ip + '.' + String(fp).padStart(3, '0');\n    return ip + '.' + String(Math.floor(fp / 10)).padStart(2, '0');\n  }\n\n  function answer(q, m) {\n    m = (m === 'vernier' || m === 'normal') ? m : mode;\n    if (m === 'normal' && q % 10 !== 0) q = snapQ(q, 'normal');\n    const r = readParts(q);\n    const value = formatQ(q, m);\n    const H = r.half ? '0.5' : '0';\n    let text = '슬리브 ' + r.sleeveMm + 'mm + ' + H + 'mm + 심블 ' + r.thimble + '×0.01mm';\n    if (m === 'vernier') text += ' + 버니어 ' + r.vernier + '×0.001mm';\n    text += ' = ' + value + 'mm';\n    return {\n      q: q, mode: m, um: q, parts: r, value: value, display: value + ' mm', text: text,\n      A: r.sleeveMm, half: r.half, n: r.thimble, k: r.vernier,\n      nearHalf: (r.thimble >= 45 || r.thimble \u003c= 5),\n      vernierZero: (m === 'vernier' && r.vernier === 0),\n      check: r.check\n    };\n  }\n\n  const BOUNDARY_POOLS = (function () {\n    const normal = [], vernier = [];\n    const nSet = { 0: 1, 1: 1, 2: 1, 47: 1, 48: 1, 49: 1 };                 // 심블 눈금(0.01mm) 기준\n    const vSet = { 0: 1, 1: 1, 2: 1, 9: 1, 10: 1, 490: 1, 491: 1, 495: 1, 498: 1, 499: 1 }; // q mod 500 기준\n    for (let q = Q_MIN; q \u003c= Q_MAX; q++) {\n      if (q % 10 === 0 && nSet[(q / 10) % 50]) normal.push(q);\n      if (vSet[q % 500]) vernier.push(q);\n    }\n    return { normal: normal, vernier: vernier };\n  })();\n\n  function randomQ(prev, m, rnd) {\n    rnd = rnd || Math.random;\n    m = m || mode;\n    const s = stepOf(m), pool = BOUNDARY_POOLS[m];\n    let q;\n    do {\n      if (rnd() \u003c 0.4) q = pool[Math.floor(rnd() * pool.length)];\n      else q = Q_MIN + s * Math.floor(rnd() * ((Q_MAX - Q_MIN) / s + 1));\n    } while (q === prev);\n    return q;\n  }\n  // \u003c/calc>\n\n  // ---- 메인 그림 기하 (viewBox 단위) ----\n  const NS = 'http://www.w3.org/2000/svg';\n  const VB_W = 1200;\n  const BY = 190;            // 슬리브 기선 y\n  const X0 = 404;            // 슬리브 0mm 눈금 x\n  const S = 24;              // 1mm 당 길이\n  const SL_H = 62;           // 슬리브 반높이\n  const TH_H = 76;           // 심블 반높이\n  const R = 66;              // 눈금 투영 반지름 (심블 눈금선과 부척 선이 같은 투영을 쓴다)\n  const BEV = 10, TH_W = 170, TH_PLAIN = 82;   // 심블 전체 길이, 눈금(매끈한) 부분 길이(그 뒤는 널링)\n  const ANVIL_X = 140, GAP_S = 6;   // 앤빌 측정면 x, 측정 간격 표시 배율(1mm = 6, 축소 표시)\n  const BOSS_R = 300, SLV_X = 372;\n  const U10 = 0.72 * Math.PI / 180;  // 심블 1/10 눈금(= 버니어 1칸 차이)의 각도\n  const FULL_VB = [36, 92, 1204, 376];\n  // 슬리브 어미자 눈금\n  //  - 일반 모드(0.01mm): 기선 위쪽 = 1mm 눈금과 숫자, 기선 아래쪽 = 0.5mm 눈금 (실물 표준)\n  //  - 버니어 모드(0.001mm): 기선 위쪽은 부척이 차지하므로 모두 기선 아래쪽(5mm 배수 > 1mm > 0.5mm)\n  const SL_TK = { five: 20, mm: 15, half: 8, num: 35 };          // 버니어 모드(기선 아래)\n  const SL_TK_N = { five: 18, mm: 13, half: 13, num: 23 };       // 일반 모드(위: 1mm, 아래: 0.5mm)\n  // 학교 로고(data URI, 빌드 스크립트로 주입). 312x312 jpg 중 위쪽 엠블럼만 잘라 쓴다.\n  const LOGO_URI = 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBxIQEhUQEBITFRUVFRUVFRgXEhgVFxUWFRYXFxUXFRUYHSggGBolHRUXITEhJSsrLi4uFyEzODMvNygtLisBCgoKDg0OGxAQGy4mICYvLy0vLS8vOC0tLS8tLy0vLS0tLy0vLS0tLS0tLS0tLy0tLS0tLS0tLS0tLS0tLS0tLf/AABEIATgBOAMBEQACEQEDEQH/xAAcAAEAAgMBAQEAAAAAAAAAAAAABQYBBAcCAwj/xABYEAABBAECBAIEBQsPCwIHAAABAAIDEQQSIQUGEzEiQQcUUWEyUnGBkRUWI0JUkqGzwdLTFyQ0U2JkdIOTlKOk0ePwJTM1Q0RlsbLCw+F1hVVjcnOClaL/xAAbAQEAAwEBAQEAAAAAAAAAAAAAAwQFAgEGB//EADwRAAIBAgMDCgQFAwQDAQAAAAABAgMRBBIhMUFRBRNhcYGRobHB8BQi0eEVMjNSYjRC8SNygpIGJFND/9oADAMBAAIRAxEAPwDuKAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgMWlwZQC0Bi0BlAEAQBAEAQBAEAQBAEAQBAEAQBAEAQBAEAQBAEAQBAEAQBAEAQBAEAtAauFxKCe+jNFJprVoka+rur0k12P0LqUJQ/MrHEakZ/laZtLk7IDjOfIzOwoWuqOX1nqDSDq0RBzN6sUfZV2p6cIulOT2q1u1larNqrCK2O9+xE8FAWSF5xyJ4sOaXGNSMaHA+E01rml5p+x8Ad+TdS0FB1Ep7GQ4hzVNuG0xyrxGfKxxkTxtj6jnOjaNViL7 ;\n    revealed = false;\n    if (ans) { ans.classList.remove('open'); ans.innerHTML = ''; }\n    return was;\n  }\n\n  function setState(v) {\n    const next = snapQ(v, mode);\n    if (next === q && drawn) return;\n    q = next;\n    closeAnswer();\n    draw();\n    drawn = true;\n  }\n\n  function reveal() {\n    if (ans.classList.contains('open')) { closeAnswer(); drawZoom(); return; }\n    const a = answer(q, mode);\n    let hint = '';\n    if (a.nearHalf) hint += '\u003cdiv class=\"gw-hint\">0.5mm 눈금이 심블 앞단 밖으로 보이는지 먼저 확인하세요.\u003c/div>';\n    if (a.vernierZero) hint += '\u003cdiv class=\"gw-hint\">부척 0번과 10번 선이 함께 일치하면 0.001mm 자리는 0입니다.\u003c/div>';\n    ans.innerHTML = '\u003cdiv class=\"gw-value\">' + a.display + '\u003c/div>\u003cdiv>' + a.text + '\u003c/div>' + hint;\n    ans.classList.add('open');\n    revealed = true;\n    drawZoom();                              // 버니어 모드면 확대 창에 일치선 강조\n    try {\n      const r = ans.getBoundingClientRect();\n      const vh = window.innerHeight || document.documentElement.clientHeight;\n      if (r.top \u003c 0 || r.bottom > vh) ans.scrollIntoView({ block: 'nearest', behavior: 'smooth' });\n    } catch (err) {}\n  }\n\n  function newProblem() {\n    q = randomQ(drawn ? q : -1, mode);\n    closeAnswer();\n    draw();\n    drawn = true;\n  }\n\n  window.GaugeWidget = {\n    id: ID, title: TITLE, mount: mount, newProblem: newProblem, reveal: reveal,\n    // answer(q[, mode]) / readParts(q): q는 1/1000mm 정수(0~25000). mode 생략 시 현재 모드.\n    answer: answer, readParts: readParts,\n    get boundaryPool() { return BOUNDARY_POOLS[mode]; },\n    boundaryPools: BOUNDARY_POOLS,\n    unit: 0.001,\n    setMode: setMode, getMode: function () { return mode; },\n    getState: function () { return q; }, setState: function (v) { setState(v); },\n    _answer: answer, _getState: function () { return q; }, _setState: function (v) { setState(v); },\n    _randomQ: randomQ, _formatQ: formatQ\n  };\n  document.addEventListener('DOMContentLoaded', function () {\n    const r = document.getElementById('gw-root');\n    if (r) mount(r);\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","inside-mic":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>내측마이크로미터 눈금읽기\u003c/title>\n\u003cstyle>\n  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#0969da; --ok:#1a7f37; --badge:#cf222e;\n          --mHi:#ffffff; --mMid:#d3d8de; --mLo:#8e97a1; --mEdge:#4b535c;\n          --grip:#9aa2ab; --gripHi:#e9ecef; --knurl:#59616b;\n          --work:#c4b296; --workEdge:#8a7558; --tick:#1f2328;\n          --engr:#30455b; --engrSh:#0e151c; --engrHi:#ffffff; }\n  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#4493f8; --ok:#3fb950; --badge:#f85149;\n          --mHi:#9aa3ad; --mMid:#59616b; --mLo:#2a3038; --mEdge:#11151a;\n          --grip:#3a424c; --gripHi:#7d8691; --knurl:#1b1f24;\n          --work:#5c4d3a; --workEdge:#8a7558; --tick:#f0f3f6;\n          --engr:#c3cfdb; --engrSh:#05080b; --engrHi:#aab4bf; } }\n  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, \"Malgun Gothic\", sans-serif; }\n  .gw-svg { width:100%; height:auto; max-width:1200px; max-height:max(320px, calc(100vh - 200px)); margin:0 auto;\n            touch-action:none; user-select:none; -webkit-user-select:none; display:block; }\n  .gw-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }\n  .gw-head h2 { margin:0; font-size:1.25em; }\n  .gw-badge { display:inline-block; padding:2px 10px; border-radius:999px; background:var(--badge); color:#fff; font-weight:700; font-size:.9em; }\n  .gw-sub { color:var(--muted); font-size:.9em; margin:4px 0 8px; }\n  .gw-bar { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; align-items:center; }\n  button { font:inherit; padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); cursor:pointer; }\n  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }\n  /* 확대 창: 외측마이크로미터와 같은 구성(눈금만 펼친 그림 + 오른쪽 설명) */\n  .gw-zoombox { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-start; margin-top:8px; padding:8px; border:1px solid var(--line); border-radius:10px; }\n  .gw-zsvg { flex:0 1 420px; width:420px; max-width:100%; height:auto; display:block; border-radius:6px;\n             touch-action:none; user-select:none; -webkit-user-select:none; }\n  .gw-zcap { flex:1 1 220px; font-size:.9em; color:var(--muted); }\n  .gw-zcap p { margin:0 0 6px; }\n  .gw-zcap b { color:var(--fg); }\n  @media (max-width: 600px) {\n    body { padding:10px; }\n    .gw-head h2 { font-size:1.1em; }\n    .gw-sub { font-size:.85em; }\n    .gw-zoombox { padding:6px; gap:6px; }\n    .gw-zsvg { flex-basis:100%; width:100%; }\n    .gw-zcap { font-size:.82em; }\n    .gw-bar button { flex:1 1 0; }\n  }\n  .gw-answer { display:none; padding:12px; border:1px solid var(--ok); border-radius:8px; }\n  .gw-answer.open { display:block; }\n  .gw-value { font-size:1.6em; font-weight:700; color:var(--ok); }\n  .gw-hint { color:var(--muted); font-size:.85em; margin-top:6px; }\n  /* SVG 색 */\n  .s-edge { stroke:var(--mEdge); stroke-width:1.2; }\n  .s-work { fill:var(--work); stroke:var(--workEdge); stroke-width:1.2; }\n  .s-tick { stroke:var(--tick); stroke-width:1.4; }\n  .s-thin { stroke:var(--tick); stroke-width:1.1; }\n  .s-txt { fill:var(--tick); font:700 12px system-ui, \"Malgun Gothic\", sans-serif; }\n  .s-txt-s { fill:var(--tick); font:700 10.5px system-ui, \"Malgun Gothic\", sans-serif; }\n  .s-muted { fill:var(--muted); font:12px system-ui, \"Malgun Gothic\", sans-serif; }\n  .s-engr { fill:var(--mEdge); font:600 10px system-ui, sans-serif; }\n  .s-dim { stroke:var(--accent); stroke-width:1.2; fill:none; }\n  .s-dimtxt { fill:var(--accent); font:600 12px system-ui, \"Malgun Gothic\", sans-serif; }\n  .s-knurl { stroke:var(--knurl); stroke-width:1; }\n  .s-grab { cursor:ns-resize; }\n  .s-grabx { cursor:ew-resize; }\n  .s-ef { flood-color:var(--engr); }\n  .s-es { flood-color:var(--engrSh); }\n  .s-eh { flood-color:var(--engrHi); }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"gw-root\">\u003c/div>\n\u003cscript>\n(function () {\n  const ID = 'inside-mic';\n  const TITLE = '내측마이크로미터';\n\n  // ---- 명세 상수 ----\n  const O_UM = 5000;                 // 측정 범위 시작값 5mm (슬리브 숫자에 포함되어 새겨짐)\n  const STATE_MIN = 0, STATE_MAX = 2500, STEP = 1;   // p: 1 = 0.01mm, V = 5 + p/100\n  const BOUNDARY_RATE = 0.25;        // 명세 4절: 출제의 약 25%는 경계값 풀\n\n  // ---- 상태: 정수 하나 (p) + 드래그 중 부드러운 표시용 실수 ----\n  let p = 0, pView = 0, lastP = -1;\n\n  // ---- 명세 함수: p → 읽기 값 / 정답 (정수 연산) ----\n  // 반전 눈금 읽기: 심블이 오른쪽부터 눈금을 덮어 간다. 눈금 m 은 V >= m 이면 가려짐.\n  //  B = 심블 앞단 바로 왼쪽에 보이는 1mm 눈금 = floor(V) + 1\n  //  기본 mm = B - 1, 0.5mm 눈금(B - 0.5)이 가려져 있으면 +0.5, 심블 눈금 × 0.01\n  //  예외: V = 30.00 이면 마지막 눈금 30까지 가려져 왼쪽에 보이는 1mm 눈금이 없다(30 왼쪽엔 눈금 없음).\n  function readParts(s) {\n    const sleeveMm = Math.floor(s / 100);           // zero-based (내부용)\n    const sleeveNum = sleeveMm + O_UM / 1000;       // = B - 1\n    const visibleB = sleeveNum + 1;                 // 보이는 가장 가까운 1mm 눈금 숫자 (V=30.00 이면 31: 실제로는 없음)\n    const half = Math.floor(s / 50) % 2;            // 1 이면 B-0.5 눈금이 가려짐\n    const thimble = s % 50;\n    const headUm = sleeveMm * 1000 + half * 500 + thimble * 10;   // == s*10\n    return { sleeveMm: sleeveMm, sleeveNum: sleeveNum, visibleB: visibleB, half: half, thimble: thimble, headUm: headUm,\n             atEnd: s === STATE_MAX };\n  }\n  function answer(s) {\n    const r = readParts(s);\n    const answerUm = O_UM + r.headUm;\n    const ansStr = (answerUm / 1000).toFixed(2);\n    const halfStr = r.half ? '0.5' : '0';\n    let text;\n    if (r.atEnd) {\n      text = '심블 앞단 왼쪽에 보이는 1mm 눈금이 없음 [앞단이 마지막 눈금 30에 닿음, 30 왼쪽에는 눈금 없음] → 슬리브 30mm + 0mm' +\n        ' + 심블 ' + r.thimble + '×0.01mm = ' + ansStr + 'mm';\n    } else {\n      text = '슬리브 ' + r.sleeveNum + 'mm [보이는 눈금 ' + r.visibleB + '에서 1을 뺌] + ' + halfStr +\n        'mm' + (r.half ? ' [' + (r.visibleB - 0.5) + ' 눈금이 가려짐]' : ' [' + (r.visibleB - 0.5) + ' 눈금이 보임]') +\n        ' + 심블 ' + r.thimble + '×0.01mm = ' + ansStr + 'mm';\n    }\n    return { answerUm: answerUm, valueMm: answerUm / 1000, valueStr: ansStr, text: text, parts: r };\n  }\n\n  // ---- 무작위 출제 ----\n  const BOUNDARY_POOL = (function () {\n    const set = new Set([0, 1, 49, 50, 51, 99, 100, 101, 149, 150, 151, 2449, 2450, 2451, 2499, 2500]);\n    for (let k = 1; k \u003c= 50; k++) [k * 50 - 1, k * 50, k * 50 + 1].forEach(function (v) {\n      if (v >= STATE_MIN && v \u003c= STATE_MAX) set.add(v);\n    });\n    return Array.from(set).sort(function (a, b) { return a - b; });\n  })();\n  function randomState() {\n    let s;\n    do {\n      if (Math.random() \u003c BOUNDARY_RATE) s = BOUNDARY_POOL[Math.floor(Math.random() * BOUNDARY_POOL.length)];\n      else s = STATE_MIN + STEP * Math.floor(Math.random() * ((STATE_MAX - STATE_MIN) / STEP + 1));\n    } while (s === lastP);\n    return s;\n  }\n\n  // ---- 그림 상수 (SVG 좌표) ----\n  // 사진(미쓰토요 5-30mm) 기준 배치:\n  //  [이동 조 블록(핀) + 로드] ← 심블과 함께 왼쪽으로 이동\n  //  [고정 조 블록(핀, 학교 각인)][칼라][슬리브: 30 25 20 15 10 5 (화면 고정)][심블][래칫] ← 심블+래칫 왼쪽으로 이동\n  // 심블 앞단 x = xOf(V) + EDGE_GAP. 눈금 m 은 V >= m 이면 가려짐(그리지 않음), V \u003c m 이면 보임.\n  // 슬리브 눈금은 5~30mm 뿐(30이 가장 왼쪽 = 마지막 눈금). 30 왼쪽은 무늬 없는 슬리브 → 칼라 → 고정 조.\n  // 비율: 슬리브 지름 56 : 심블 지름 108 (약 1.9배), 심블 길이 210 ≥ 슬리브 최대 노출 길이(약 211)에 근접.\n  const PX_MM = 7.5;                  // 1mm 당 px (슬리브·조 공통 → 로드로 연결된 움직임이 일치)\n  const AXIS_Y = 230;                 // 슬리브 기선\n  const R0 = 318;                     // 고정 조 핀 바깥 측정면(오른쪽 면) x\n  const PIN_W = 7, PIN_TOP = 96, EAR_Y = 150, BLK_TOP = 190, BLK_BOT = 296;\n  const SL_X0 = R0 + 90;              // 슬리브 시작(고정 블록 오른쪽 끝) — 블록이 넓어 학교 각인 자리\n  const X30 = SL_X0 + 3ctext x=\"' + cx + '\" y=\"' + (BLK_TOP + 61) + '\" text-anchor=\"middle\" fill=\"#000\" style=\"' + font + '\">한국폴리텍대학\u003c/text>' +\n      '\u003ctext x=\"' + cx + '\" y=\"' + (BLK_TOP + 75) + '\" text-anchor=\"middle\" fill=\"#000\" style=\"' + font + '\">광주캠퍼스\u003c/text>' +\n      '\u003ctext x=\"' + cx + '\" y=\"' + (BLK_TOP + 89) + '\" text-anchor=\"middle\" fill=\"#000\" style=\"' + font + '\">기계시스템과\u003c/text>' +\n      '\u003c/g>';\n  }\n\n  function mount(container) {\n    root = container;\n    container.innerHTML =\n      '\u003cdiv class=\"gw-head\">\u003ch2>' + TITLE + ' (캘리퍼형)\u003c/h2>\u003cspan class=\"gw-badge\">내측\u003c/span>\u003c/div>' +\n      '\u003cdiv class=\"gw-sub\">측정 범위 5.00 ~ 30.00 mm · 최소 눈금 0.01 mm · 슬리브 숫자는 심블 쪽(오른쪽) 5부터 왼쪽으로 커지며 30이 마지막 눈금입니다. ' +\n        '값이 커질수록 심블이 왼쪽으로 가며 눈금을 덮습니다. 심블을 위아래로(미세) 또는 좌우로(빠르게) 끌거나 왼쪽 조를 끄세요. 마우스 휠도 됩니다.\u003c/div>' +\n      '\u003csvg class=\"gw-svg\" id=\"' + ID + '-svg\" viewBox=\"' + VB_X + ' ' + VB_Y + ' ' + VB_W + ' ' + VB_H + '\" role=\"img\" aria-label=\"내측마이크로미터 전체 모습\">' +\n        defs() + '\u003cg id=\"' + ID + '-dyn\">\u003c/g>\u003c/svg>' +\n      '\u003cdiv class=\"gw-zoombox\">' +\n        '\u003csvg class=\"gw-zsvg\" id=\"' + ID + '-z\" viewBox=\"0 0 ' + ZW + ' ' + ZH + '\" role=\"img\" aria-label=\"확대 창: 슬리브 눈금과 심블 눈금\">\u003c/svg>' +\n        '\u003cdiv class=\"gw-zcap\">\u003cp>\u003cb>확대 창\u003c/b> (전체 그림의 점선 영역을 펼쳐서 크게 그림) — 여기서 위/아래로 끌어도 심블이 움직입니다.\u003c/p>' +\n          '\u003cp>① 심블 앞단 바로 왼쪽에 보이는 1mm 눈금(기선 위) 숫자에서 1을 뺀다 → ② 그 오른쪽 0.5mm 눈금(기선 아래)이 가려졌으면 +0.5 → ③ 기선에 맞는 심블 눈금 × 0.01mm\u003c/p>' +\n          '\u003cp>슬리브 눈금은 30이 마지막입니다. 왼쪽에 보이는 눈금이 없으면 앞단이 30에 닿은 것입니다.\u003c/p>\u003c/div>' +\n      '\u003c/div>' +\n      '\u003cdiv class=\"gw-bar\">\u003cbutton class=\"primary\" id=\"' + ID + '-reveal\">정답확인\u003c/button>' +\n      '\u003cbutton id=\"' + ID + '-new\">새 문제\u003c/button>\u003c/div>' +\n      '\u003cdiv class=\"gw-answer\" id=\"' + ID + '-ans\">\u003c/div>';\n    svg = el('svg'); ans = el('ans'); gDyn = el('dyn'); zSvg = el('z');\n    // 각인은 움직이지 않으므로 한 번만 넣는다(고정 조 블록 위에 오도록 draw()에서 순서 맞춤)\n    el('reveal').onclick = reveal;\n    el('new').onclick = newProblem;\n    bindDrag(svg, PX_PER_DIV, PX_MM);\n    bindDrag(zSvg, ZDIV, ZS);\n    newProblem();\n  }\n\n  // ---- 입력 ----\n  function bindDrag(target, perDiv, perMm) {\n    let drag = null;\n    target.addEventListener('pointerdown', function (e) {\n      const kind = e.target.closest && e.target.closest('[data-grab]');\n      if (!kind) return;\n      e.preventDefault();\n      const ctm = target.getScreenCTM();\n      drag = { id: e.pointerId, kind: kind.getAttribute('data-grab'), x: e.clientX, y: e.clientY,\n               p0: pView, scale: ctm ? ctm.a : 1 };\n      try { target.setPointerCapture(e.pointerId); } catch (_) {}\n    });\n    target.addEventListener('pointermove', function (e) {\n      if (!drag || e.pointerId !== drag.id) return;\n      const dx = (e.clientX - drag.x) / drag.scale;\n      const dy = (e.clientY - drag.y) / drag.scale;\n      let dp;\n      if (drag.kind === 'jaw') dp = -dx / perMm * 100;                    // 왼쪽으로 끌면 값 증가\n      else dp = -dy / perDiv - dx / perMm * 100;                          // 위로/왼쪽으로 끌면 값 증가\n      setView(drag.p0 + dp);\n    });\n    function end(e) {\n      if (!drag || e.pointerId !== drag.id) return;\n      drag = null;\n      setState(pView);\n    }\n    target.addEventListener('pointerup', end);\n    target.addEventListener('pointercancel', end);\n    target.addEventListener('wheel', function (e) {\n      e.preventDefault();\n      const n = (e.deltaY > 0 ? 1 : -1) * (e.shiftKey ? 10 : 1);\n      setState(p + n);\n    }, { passive: false });\n  }\n\n  function clamp(s) { return Math.max(STATE_MIN, Math.min(STATE_MAX, s)); }\n  function closeAnswer() { if (ans) ans.classList.remove('open'); }\n  function setView(s) {           // 드래그 중: 부드럽게 표시, 정답 변수 p도 즉시 반올림 반영\n    pView = clamp(s);\n    p = Math.round(pView / STEP) * STEP;\n    closeAnswer();\n    draw();\n  }\n  function setState(s) {          // 스냅\n    p = clamp(Math.round(s / STEP) * STEP);\n    pView = p;\n    closeAnswer();\n    draw();\n  }\n\n  // ---- 그리기: pView(표시) 하나로만 그린다 ----\n  function f(n) { return Math.round(n * 100) / 100; }\n  function U(id) { return 'url(#' + ID + '-' + id + ')'; }\n  function draw() {\n    const s = pView;\n    const V = 5 + s / 100;                     // 측정값(mm, 표시용 실수)\n    const tE = xOf(V) + EDGE_GAP;              // 심블 앞단\n    const L = R0 - V * PX_MM;                  // 이동 조 핀 바깥 측정면(왼쪽 면)\n    let h = '';\n\n    // 1) 공작물(구멍 단면) — 두 핀 끝의 바깥 면이 구멍 벽에 닿는다\n    h += '\u003crect class=\"s-work\" x=\"' + f(L - 46) + '\" y=\"' + (PIN_TOP - 4) + '\" width=\"46\" height=\"40\"/>';\n    h += '\u003crect class=\"s-work\" x=\"' + R0 + '\" y=\"' + (PIN_TOP - 4) + '\" width=\"46\" height=\"40\"/>';\n    h += '\u003ctext class=\"s-muted\" x=\"' + (R0 + 50) + '\" y=\"' + (PIN_TOP + 20) + '\">공작물(구멍 단면)\u003c/text>';\n    h += '\u003cline class=\"s-dim\" x1=\"' + f(L) + '\" y1=\"70\" x2=\"' + R0 + '\" y2=\"70\"/>';\n    h += '\u003cpath class=\"s-dim\" d=\"M' + f(L) + ' 70 l6 -4 M' + f(L) + ' 70 l6 4 M' + R0 + ' 70 l-6 -4 M' + R0 + ' 70 l-6 4\"/>';\n    h += '\u003cline class=\"s-dim\" x1=\"' + f(L) + '\" y1=\"64\" x2=\"' + f(L) + '\" y2=\"' + (PIN_TOP - 6) + '\" stroke-dasharray=\"2 2\"/>';\n    h += '\u003cline class=\"s-dim\" x1=\"' + R0 + '\" y1=\"64\" x2=\"' + R0 + '\" y2=\"' + (PIN_TOP - 6) + '\" stroke-dasharray=\"2 2\"/>';\n    h += '\u003ctext class=\"s-dimtxt\" x=\"' + f((L + R0) / 2) + '\" y=\"62\" text-anchor=\"middle\">안지름\u003c/text>';\n\n    // 2) 로드(심블과 연결, 이동 조를 민다) — 이동 조 블록과 고정 조 블록 사이에 보임\n    h += '\u003crect class=\"s-edge\" fill=\"' + U('gCyl') + '\" x=\"' + f(L + 10) + '\" y=\"' + (AXIS_Y - 9) + '\" width=\"' + f(Math.max(0, R0 - 12 - (L + 10))) + '\" height=\"18\"/>';\n\n    // 3) 이동 조 블록(드래그 가능): 둥근 보스 + 블록 + 위로 뻗은 핀 + 아래 클램프 나사\n    h += '\u003cg data-grab=\"jaw\" class=\"s-grabx\" filter=\"' + U('sh') + '\">';\n    h += '\u003crect class=\"s-edge\" fill=\"' + U('gCyl') + '\" x=\"' + f(L - 74) + '\" y=\"' + (AXIS_Y - 25) + '\" width=\"26\" height=\"50\" rx=\"4\"/>';\n    h += '\u003crect fill=\"' + U('gShade') + '\" opacity=\".5\" x=\"' + f(L - 74) + '\" y=\"' + (AXIS_Y - 25) + '\" width=\"26\" height=\"50\" rx=\"4\"/>';\n    h += '\u003crect class=\"s-edge\" fill=\"' + U('gCyl') + '\" x=\"' + f(L - 30) + '\" y=\"' + BLK_BOT + '\" width=\"10\" height=\"8\"/>';\n    h += '\u003crect class=\"s-edge\" fill=\"' + U('knurl') + '\" x=\"' + f(L - 39) + '\" y=\"' + (BLK_BOT + 8) + '\" width=\"28\" height=\"15\" rx=\"3\"/>';\n    h += '\u003crect fill=\"' + U('gShade') + '\" x=\"' + f(L - 39) + '\" y=\"' + (BLK_BOT + 8) + '\" width=\"28\" height=\"15\" rx=\"3\"/>';\n    const mvD = 'M' + f(L - 48) + ' ' + BLK_TOP + ' L' + f(L - 30) + ' ' + BLK_TOP + ' L' + f(L - 6) + ' ' + EAR_Y +\n                ' L' + f(L + 12) + ' ' + EAR_Y + ' L' + f(L + 12) + ' ' + BLK_BOT + ' L' + f(L - 48) + ' ' + BLK_BOT + ' Z';\n    h += '\u003cpath class=\"s-edge\" fill=\"' + U('gBlock') + '\" d=\"' + mvD + '\"/>';\n    h += '\u003cpath fill=\"' + U('brush') + '\" d=\"' + mvD + '\"/>';\n    h += '\u003cpath d=\"M' + f(L - 46) + ' ' + (BLK_TOP + 2) + ' L' + f(L - 29) + ' ' + (BLK_TOP + 2) + ' L' + f(L - 5) + ' ' + (EAR_Y + 2) + ' L' + f(L + 10) + ' ' + (EAR_Y + 2) +\n         '\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".6\" stroke-width=\"1.2\"/>';\n    h += '\u003cline x1=\"' + f(L + 4) + '\" y1=\"' + (EAR_Y + 4) + '\" x2=\"' + f(L + 4) + '\" y2=\"' + (BLK_BOT - 2) + '\" stroke=\"#000\" stroke-opacity=\".15\"/>';\n    h += '\u003crect class=\"s-edge\" fill=\"' + U('gPin') + '\" x=\"' + f(L) + '\" y=\"' + PIN_TOP + '\" width=\"' + PIN_W + '\" height=\"' + (EAR_Y - PIN_TOP + 1) + '\" rx=\"1.5\"/>';\n    h += '\u003ctext x=\"' + f(L - 18) + '\" y=\"' + (BLK_TOP + 66) + '\" text-anchor=\"middle\" fill=\"#000\" filter=\"' + U('engr') + '\" style=\"font:700 10px system-ui, sans-serif\">5-30mm\u003c/text>';\n    h += '\u003crect x=\"' + f(L - 78) + '\" y=\"' + (PIN_TOP - 6) + '\" width=\"98\" height=\"' + (BLK_BOT + 26 - PIN_TOP) + '\" fill=\"transparent\"/>';\n    h += '\u003c/g>';\n    h += '\u003ctext class=\"s-muted\" x=\"' + f(L - 18) + '\" y=\"' + (BLK_BOT + 40) + '\" text-anchor=\"middle\">이동 조\u003c/text>';\n\n    // 4) 고정 조 블록 + 핀 (화면 고정) + 학교 각인\n    h += '\u003cg filter=\"' + U('sh') + '\">';\n    const fxD = 'M' + (R0 - 12) + ' ' + EAR_Y + ' L' + (R0 + 6) + ' ' + EAR_Y + ' L' + (R0 + 30) + ' ' + BLK_TOP +\n                ' L' + (SL_X0 + 2) + ' ' + BLK_TOP + ' L' + (SL_X0 + 2) + ' ' + BLK_BOT + ' L' + (R0 - 12) + ' ' + BLK_BOT + ' Z';\n    h += '\u003cpath class=\"s-edge\" fill=\"' + U('gBlock') + '\" d=\"' + fxD + '\"/>';\n    h += '\u003cpath fill=\"' + U('brush') + '\" d=\"' + fxD + '\"/>';\n    h += '\u003cpath d=\"M' + (R0 - 10) + ' ' + (EAR_Y + 2) + ' L' + (R0 + 5) + ' ' + (EAR_Y + 2) + ' L' + (R0 + 29) + ' ' + (BLK_TOP + 2) + ' L' + SL_X0 + ' ' + (BLK_TOP + 2) +\n         '\" fill=\"none\" stroke=\"#fff\" stroke-opacity=\".6\" stroke-width=\"1.2\"/>';\n    h += '\u003cline x1=\"' + (R0 - 4) + '\" y1=\"' + (EAR_Y + 4) + '\" x2=\"' + (R0 - 4) + '\" y2=\"' + (BLK_BOT - 2) + '\" stroke=\"#000\" stroke-opacity=\".15\"/>';\n    h += '\u003crect class=\"s-edge\" fill=\"' + U('gPin') + '\" x=\"' + (R0 - PIN_W) + '\" y=\"' + PIN_TOP + '\" width=\"' + PIN_W + '\" height=\"' + (EAR_Y - PIN_TOP + 1) + '\" rx=\"1.5\"/>';\n    h += '\u003c/g>';\n    h += logoEngrave();\n    h += '\u003ctext class=\"s-muted\" x=\"' + (R0 + 40) + '\" y=\"' + (BLK_BOT + 18) + '\" text-anchor=\"middle\">고정 조\u003c/text>';\n\n    // 5) 슬리브(화면 고정): 왼→오 30 … 5, 1mm 눈금·숫자는 기선 위, 0.5mm 눈금은 기선 아래\n    //    30이 가장 왼쪽(마지막) 눈금. 30 왼쪽은 눈금 없는 슬리브 + 칼라.\n    //    슬리브 오른쪽 부분은 심블 속으로 들어가 있다(심블 앞단 너머로는 그리지 않음)\n    h += '\u003crect class=\"s-edge\" fill=\"' + U('gCyl') + '\" x=\"' + SL_X0 + '\" y=\"' + SL_TOP + '\" width=\"' + f(tE + 8 - SL_X0) + '\" height=\"' + (SL_BOT - SL_TOP) + '\"/>';\n    h += '\u003crect class=\"s-edge\" fill=\"' + U('gCyl') + '\" x=\"' + (SL_X0 - 2) + '\" y=\"' + (SL_TOP - 3) + '\" width=\"8\" height=\"' + (SL_BOT - SL_TOP + 6) + '\" rx=\"1.5\"/>';\n    h += '\u003cline class=\"s-thin\" x1=\"' + f(xOf(SCALE_MAX)) + '\" y1=\"' + AXIS_Y + '\" x2=\"' + f(tE) + '\" y2=\"' + AXIS_Y + '\"/>';\n    for (let m = 5; m \u003c= SCALE_MAX; m++) {\n      const x = xOf(m);\n      if (m % 5 === 0 && x - 9 \u003c tE) h += '\u003ctext class=\"s-txt\" data-n=\"' + m + '\" x=\"' + f(x) + '\" y=\"' + (AXIS_Y - 13) + '\" text-anchor=\"middle\">' + m + '\u003c/text>';\n      if ((m - 5) * 100 \u003c= s) continue;         // V >= m : 심블에 가려짐\n      const len = (m % 5 === 0) ? 11 : 8;\n      h += '\u003cline class=\"s-tick\" data-v=\"' + m + '\" x1=\"' + f(x) + '\" y1=\"' + AXIS_Y + '\" x2=\"' + f(x) + '\" y2=\"' + (AXIS_Y - len) + '\"/>';\n    }\n    for (let m = 5; m \u003c SCALE_MAX; m++) {\n      const hv = m + 0.5, x = xOf(hv);\n      if ((m - 5) * 100 + 50 \u003c= s) continue;    // V >= m+0.5 : 가려짐\n      h += '\u003cline class=\"s-tick\" data-h=\"' + hv + '\" x1=\"' + f(x) + '\" y1=\"' + AXIS_Y + '\" x2=\"' + f(x) + '\" y2=\"' + (AXIS_Y + 8) + '\"/>';\n    }\n\n    // 6) 심블 + 래칫 — 측정값이 커지면 왼쪽으로 이동하며 슬리브를 덮는다\n    h += '\u003cg data-grab=\"thimble\" class=\"s-grab\" filter=\"' + U('sh') + '\">';\n    const tB = tE + GRAD_W + BAND_W;            // 널링 시작\n    const tR = tE + TH_W;                       // 심블 끝\n    const thD = 'M' + f(tE) + ' ' + (AXIS_Y - TH_EDGE) + ' L' + f(tE + TH_BEV) + ' ' + TH_TOP + ' L' + f(tR - 8) + ' ' + TH_TOP +\n                ' L' + f(tR) + ' ' + (TH_TOP + 6) + ' L' + f(tR) + ' ' + (TH_BOT - 6) + ' L' + f(tR - 8) + ' ' + TH_BOT +\n                ' L' + f(tE + TH_BEV) + ' ' + TH_BOT + ' L' + f(tE) + ' ' + (AXIS_Y + TH_EDGE) + ' Z';\n    h += '\u003cpath class=\"s-edge\" fill=\"' + U('gCyl') + '\" d=\"' + thD + '\"/>';\n    const knW = TH_W - GRAD_W - BAND_W - 16;\n    h += '\u003crect fill=\"' + U('knurl') + '\" x=\"' + f(tB + 4) + '\" y=\"' + (TH_TOP + 1) + '\" width=\"' + knW + '\" height=\"' + (TH_BOT - TH_TOP - 2) + '\"/>';\n    h += '\u003crect fill=\"' + U('gShade') + '\" x=\"' + f(tB + 4) + '\" y=\"' + (TH_TOP + 1) + '\" width=\"' + knW + '\" height=\"' + (TH_BOT - TH_TOP - 2) + '\"/>';\n    h += '\u003cline x1=\"' + f(tE + GRAD_W) + '\" y1=\"' + (TH_TOP + 1) + '\" x2=\"' + f(tE + GRAD_W) + '\" y2=\"' + (TH_BOT - 1) + '\" stroke=\"var(--mEdge)\" stroke-opacity=\".45\"/>';\n    h += '\u003cline x1=\"' + f(tB + 2) + '\" y1=\"' + (TH_TOP + 1) + '\" x2=\"' + f(tB + 2) + '\" y2=\"' + (TH_BOT - 1) + '\" stroke=\"var(--mEdge)\" stroke-width=\"2\" stroke-opacity=\".6\"/>';\n    h += '\u003cline x1=\"' + f(tR - 10) + '\" y1=\"' + (TH_TOP + 1) + '\" x2=\"' + f(tR - 10) + '\" y2=\"' + (TH_BOT - 1) + '\" stroke=\"var(--mEdge)\" stroke-width=\"1.5\" stroke-opacity=\".6\"/>';\n    h += '\u003cline x1=\"' + f(tE + TH_BEV) + '\" y1=\"' + (TH_TOP + 1) + '\" x2=\"' + f(tE + TH_BEV) + '\" y2=\"' + (TH_BOT - 1) + '\" stroke=\"#fff\" stroke-opacity=\".35\"/>';\n    h += '\u003ctext class=\"s-engr\" transform=\"translate(' + f(tE + GRAD_W + BAND_W / 2 + 4) + ' ' + AXIS_Y + ') rotate(-90)\" text-anchor=\"middle\">0.01mm\u003c/text>';\n    const frac = s % 50;                        // 기선에 오는 심블 눈금(실수)\n    for (let k = 0; k \u003c 50; k++) {\n      let d = k - frac;\n      d = ((d % 50) + 75) % 50 - 25;\n      const th = d * 2 * Math.PI / 50;\n      if (Math.abs(th) > 1.2) continue;\n      const y = AXIS_Y + TICK_R * Math.sin(th);   // 사진처럼 위에서부터 45, 0, 5 … (아래로 갈수록 커짐)\n      const len = (k % 5 === 0) ? 16 : 10;\n      const op = Math.max(0.2, Math.cos(th)).toFixed(2);\n      h += '\u003cline class=\"s-thin\" data-k=\"' + k + '\" x1=\"' + f(tE) + '\" y1=\"' + f(y) + '\" x2=\"' + f(tE + len) + '\" y2=\"' + f(y) + '\" stroke-opacity=\"' + op + '\"/>';\n      if (k % 5 === 0) h += '\u003ctext class=\"s-txt-s\" x=\"' + f(tE + 20) + '\" y=\"' + f(y + 4) + '\" fill-opacity=\"' + op + '\">' + k + '\u003c/text>';\n    }\n    const rx0 = tR;\n    h += '\u003crect class=\"s-edge\" fill=\"' + U('gCyl') + '\" x=\"' + f(rx0) + '\" y=\"' + (AXIS_Y - 18) + '\" width=\"9\" height=\"36\"/>';\n    h += '\u003crect class=\"s-edge\" fill=\"' + U('gGrip') + '\" x=\"' + f(rx0 + 9) + '\" y=\"' + (AXIS_Y - 29) + '\" width=\"' + (RAT_W - 9) + '\" height=\"58\" rx=\"7\"/>';\n    for (let i = 0; i \u003c 8; i++) {\n      const yy = AXIS_Y - 26 + i * 7 + (frac * 1.3) % 7;\n      if (yy > AXIS_Y + 26) continue;\n      h += '\u003cline x1=\"' + f(rx0 + 13) + '\" y1=\"' + f(yy) + '\" x2=\"' + f(rx0 + RAT_W - 6) + '\" y2=\"' + f(yy) + '\" stroke=\"var(--knurl)\" stroke-width=\"1.4\"/>';\n    }\n    h += '\u003crect fill=\"' + U('gShade') + '\" opacity=\".7\" x=\"' + f(rx0 + 9) + '\" y=\"' + (AXIS_Y - 29) + '\" width=\"' + (RAT_W - 9) + '\" height=\"58\" rx=\"7\"/>';\n    h += '\u003c/g>';\n    h += '\u003ctext class=\"s-muted\" x=\"' + f(tE + TH_W / 2) + '\" y=\"' + (TH_BOT + 20) + '\" text-anchor=\"middle\">심블\u003c/text>';\n    h += '\u003ctext class=\"s-muted\" x=\"' + f(rx0 + RAT_W / 2 + 4) + '\" y=\"' + (AXIS_Y + 52) + '\" text-anchor=\"middle\">래칫\u003c/text>';\n\n    // 확대 창이 보여 주는 영역(점선)\n    const zl = (ZEX / ZS) * PX_MM, zr = ((ZW - ZEX) / ZS) * PX_MM + 8;\n    h += '\u003crect x=\"' + f(tE - zl) + '\" y=\"' + (AXIS_Y - 27) + '\" width=\"' + f(zl + zr) + '\" height=\"54\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.3\" stroke-dasharray=\"4 3\" rx=\"2\" pointer-events=\"none\"/>';\n\n    gDyn.innerHTML = h;\n    const kp = svg.querySelector('#' + ID + '-knurl');\n    if (kp) kp.setAttribute('patternTransform', 'translate(' + f(tE) + ' ' + f(-(frac * PX_PER_DIV) % 6) + ')');\n    drawZoom(s);\n  }\n\n  // ---- 확대 창: 심블 앞단 주변 눈금만 펼쳐 그림 (슬리브 1mm = 70, 심블 1눈금 ≈ 34) ----\n  function drawZoom(s) {\n    const V = 5 + s / 100;\n    const F = 'system-ui, \\'Malgun Gothic\\', sans-serif';\n    function zx(mm) { return ZEX - (mm - V) * ZS - ZGAP; }\n    let g = '\u003cdefs>' +\n      '\u003clinearGradient id=\"' + ID + '-zslv\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\u003cstop offset=\"0\" stop-color=\"#cfd6dc\"/>\u003cstop offset=\".35\" stop-color=\"#f4f6f8\"/>' +\n        '\u003cstop offset=\".7\" stop-color=\"#e6eaee\"/>\u003cstop offset=\"1\" stop-color=\"#c3cbd2\"/>\u003c/linearGradient>' +\n      '\u003clinearGradient id=\"' + ID + '-zthm\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\u003cstop offset=\"0\" stop-color=\"#9ea7b0\"/>\u003cstop offset=\".08\" stop-color=\"#eef1f4\"/>' +\n        '\u003cstop offset=\".7\" stop-color=\"#e2e7eb\"/>\u003cstop offset=\"1\" stop-color=\"#c7ced5\"/>\u003c/linearGradient>' +\n      '\u003clinearGradient id=\"' + ID + '-zblk\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\u003cstop offset=\"0\" stop-color=\"#d9dee3\"/>\u003cstop offset=\"1\" stop-color=\"#a9b2bb\"/>\u003c/linearGradient>' +\n      '\u003c/defs>';\n    g += '\u003cg data-grab=\"thimble\" class=\"s-grab\">';\n    g += '\u003crect x=\"0\" y=\"0\" width=\"' + ZW + '\" height=\"' + ZH + '\" fill=\"#e9edf0\"/>';\n    // 슬리브(눈금 30 왼쪽은 눈금 없는 슬리브 → 칼라 → 고정 조)\n    const xc = zx(30 + COLLAR_MM);              // 칼라 오른쪽 끝\n    const sx0 = Math.max(-2, xc);\n    g += '\u003crect x=\"' + f(sx0) + '\" y=\"22\" width=\"' + f(ZEX - sx0) + '\" height=\"' + (ZH - 44) + '\" fill=\"url(#' + ID + '-zslv)\"/>';\n    if (xc > -4) {\n      g += '\u003crect x=\"-2\" y=\"0\" width=\"' + f(xc - 22 + 2) + '\" height=\"' + ZH + '\" fill=\"url(#' + ID + '-zblk)\" stroke=\"#7c8791\"/>';\n      g += '\u003crect x=\"' + f(xc - 22) + '\" y=\"12\" width=\"22\" height=\"' + (ZH - 24) + '\" rx=\"3\" fill=\"#c9d0d7\" stroke=\"#7c8791\"/>';\n      if (xc > 70) g += '\u003ctext x=\"' + f((xc - 22) / 2) + '\" y=\"' + (ZY0 + 5) + '\" text-anchor=\"middle\" font-size=\"13\" fill=\"#4b5560\" font-family=\"' + F + '\">고정 조\u003c/text>';\n    }\n    // 기선: 눈금 30에서 시작\n    g += '\u003cline x1=\"' + f(Math.max(-2, zx(SCALE_MAX))) + '\" y1=\"' + ZY0 + '\" x2=\"' + ZEX + '\" y2=\"' + ZY0 + '\" stroke=\"#111418\" stroke-width=\"2\"/>';\n    // 1mm 눈금(기선 위) + 숫자\n    for (let m = 5; m \u003c= SCALE_MAX; m++) {\n      const x = zx(m);\n      if (x \u003c -40 || x - 20 > ZEX) continue;\n      const major = m % 5 === 0;\n      if ((m - 5) * 100 > s && x > -4)\n        g += '\u003cline data-v=\"' + m + '\" x1=\"' + f(x) + '\" y1=\"' + ZY0 + '\" x2=\"' + f(x) + '\" y2=\"' + (ZY0 - (major ? 46 : 32)) + '\" stroke=\"#111418\" stroke-width=\"2.4\"/>';\n      g += '\u003ctext data-n=\"' + m + '\" x=\"' + f(x) + '\" y=\"' + (major ? ZY0 - 56 : ZY0 - 40) + '\" text-anchor=\"middle\" font-size=\"' + (major ? 26 : 15) +\n           '\" font-weight=\"700\" fill=\"' + (major ? '#111418' : '#5b6570') + '\" font-family=\"' + F + '\">' + m + '\u003c/text>';\n    }\n    // 0.5mm 눈금(기선 아래)\n    for (let m = 5; m \u003c SCALE_MAX; m++) {\n      const hv = m + 0.5, x = zx(hv);\n      if ((m - 5) * 100 + 50 \u003c= s || x \u003c -4 || x > ZEX) continue;\n      g += '\u003cline data-h=\"' + hv + '\" x1=\"' + f(x) + '\" y1=\"' + ZY0 + '\" x2=\"' + f(x) + '\" y2=\"' + (ZY0 + 30) + '\" stroke=\"#111418\" stroke-width=\"2.4\"/>';\n    }\n    // 심블(오른쪽): 앞단 + 눈금 50등분(위에서부터 45, 0, 5 …)\n    g += '\u003crect x=\"' + ZEX + '\" y=\"0\" width=\"' + (ZW - ZEX + 2) + '\" height=\"' + ZH + '\" fill=\"url(#' + ID + '-zthm)\"/>';\n    g += '\u003cline x1=\"' + ZEX + '\" y1=\"0\" x2=\"' + ZEX + '\" y2=\"' + ZH + '\" stroke=\"#4b5560\" stroke-width=\"1.6\"/>';\n    const frac = s % 50;\n    for (let k = 0; k \u003c 50; k++) {\n      let d = k - frac;\n      d = ((d % 50) + 75) % 50 - 25;\n      const th = d * 2 * Math.PI / 50;\n      if (Math.abs(th) > 0.75) continue;\n      const y = ZY0 + ZR * Math.sin(th), c = Math.cos(th);\n      if (y \u003c -10 || y > ZH + 10) continue;\n      const major = k % 5 === 0;\n      const op = (0.35 + 0.65 * c).toFixed(3);\n      g += '\u003cline data-k=\"' + k + '\" x1=\"' + ZEX + '\" y1=\"' + f(y) + '\" x2=\"' + (ZEX + (major ? 28 : 16)) + '\" y2=\"' + f(y) + '\" stroke=\"#111418\" stroke-width=\"1.8\" stroke-opacity=\"' + op + '\"/>';\n      if (major) g += '\u003ctext transform=\"translate(' + (ZEX + 34) + ' ' + f(y) + ') scale(1 ' + c.toFixed(3) + ')\" y=\"8\" font-size=\"22\" font-weight=\"700\" fill=\"#111418\" fill-opacity=\"' + op + '\" font-family=\"' + F + '\">' + k + '\u003c/text>';\n    }\n    // 머리띠\n    g += '\u003crect x=\"0\" y=\"0\" width=\"' + ZW + '\" height=\"20\" fill=\"#d5dbe1\" fill-opacity=\".92\"/>';\n    g += '\u003ctext x=\"6\" y=\"14.5\" font-size=\"12\" font-weight=\"700\" fill=\"#2b333b\" font-family=\"' + F + '\">슬리브 (기선 위 1mm · 아래 0.5mm)\u003c/text>';\n    g += '\u003ctext x=\"' + (ZW - 6) + '\" y=\"14.5\" text-anchor=\"end\" font-size=\"12\" font-weight=\"700\" fill=\"#2b333b\" font-family=\"' + F + '\">심블 ×0.01mm\u003c/text>';\n    g += '\u003c/g>';\n    zSvg.innerHTML = g;\n  }\n\n  function reveal() {\n    const a = answer(p);\n    ans.innerHTML = '\u003cdiv class=\"gw-value\">' + a.valueStr + ' mm\u003c/div>\u003cdiv>' + a.text + '\u003c/div>' +\n      '\u003cdiv class=\"gw-hint\">이 내측마이크로미터는 눈금이 반대 방향입니다. 심블이 오른쪽(5)부터 눈금을 덮어 가므로, 심블 앞단 바로 왼쪽에 보이는 1mm 눈금에서 1을 빼고, ' +\n      '그 오른쪽 0.5mm 눈금(기선 아래)이 가려졌으면 0.5를 더한 뒤 심블 눈금을 더하세요. 슬리브 눈금은 30이 마지막입니다.\u003c/div>';\n    ans.classList.toggle('open');\n    if (ans.classList.contains('open') && ans.getBoundingClientRect && ans.scrollIntoView) {\n      const r = ans.getBoundingClientRect();\n      const vh = window.innerHeight || document.documentElement.clientHeight;\n      if (r.bottom > vh || r.top \u003c 0) ans.scrollIntoView({ block: 'nearest', behavior: 'smooth' });\n    }\n  }\n  function newProblem() {\n    const s = randomState();\n    setState(s);\n    lastP = p;\n  }\n\n  window.GaugeWidget = { id: ID, title: TITLE, mount: mount, newProblem: newProblem, reveal: reveal,\n                         answer: answer, readParts: readParts, boundaryPool: BOUNDARY_POOL,\n                         _set: function (s) { setState(s); } };\n  document.addEventListener('DOMContentLoaded', function () {\n    const r = document.getElementById('gw-root');\n    if (r) mount(r);\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","dial":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>다이얼게이지 눈금읽기\u003c/title>\n\u003cstyle>\n  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#0969da; --ok:#1a7f37;\n          --face:#fbfbf7; --tick:#1f2328; --needle:#c8202c; --small:#1f2328; }\n  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#4493f8; --ok:#3fb950;\n          --face:#f3f3ee; --tick:#1f2328; --needle:#c8202c; --small:#1f2328; } }\n  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, \"Malgun Gothic\", sans-serif; }\n  .dial-wrap { max-width:520px; margin:0 auto; }\n  .dial-wrap h2 { margin:0 0 4px; font-size:1.25em; }\n  .dial-help { color:var(--muted); font-size:.9em; margin:0 0 8px; }\n  .dial-note { color:var(--muted); font-size:.85em; margin:0 0 6px; padding:4px 10px; border-left:3px solid var(--accent); }\n  .dial-note summary { cursor:pointer; color:var(--fg); font-weight:600; }\n  .dial-note p { margin:4px 0 2px; }\n  /* 그림 크기는 폭(viewBox 비율)으로 정한다. 높이 상한은 '보조'로만 쓴다:\n     - svh(주소창 제외 높이) 우선, 미지원 브라우저는 vh 대체\n     - max(300px, …)로 하한을 둬서 낮은 iframe/가로 화면에서 그림이 과하게 줄지 않게 함\n     폭은 100%지만 viewBox(meet)로 그림은 가운데 정렬·비율 유지 */\n  .gw-svg { width:100%; height:auto; aspect-ratio:400/560; touch-action:none; user-select:none; -webkit-user-select:none; display:block; margin:0 auto;\n            max-height:max(300px, calc(100vh - 190px)); }\n  @supports (height:100svh) { .gw-svg { max-height:max(300px, calc(100svh - 190px)); } }\n  @media (min-width:481px) {   /* 넓은 화면: 제목·안내문이 길어지는 만큼 여유를 더 둠 */\n    .gw-svg { max-height:max(280px, calc(100vh - 250px)); }\n    @supports (height:100svh) { .gw-svg { max-height:max(280px, calc(100svh - 250px)); } }\n  }\n  @media (max-width:480px) {\n    body { padding:10px 10px 16px; }\n    .dial-wrap h2 { font-size:1.1em; }\n    .dial-help { font-size:.82em; margin-bottom:4px; line-height:1.4; }\n    .gw-bar { margin:8px 0; gap:6px; }\n    button { padding:8px 12px; }\n    .gw-opt button { padding:6px 9px; }\n  }\n  .gw-svg .dial-grab { cursor:grab; }\n  .gw-svg.dragging .dial-grab { cursor:grabbing; }\n  .gw-svg:focus { outline:2px solid var(--accent); outline-offset:2px; border-radius:8px; }\n  .gw-bar { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; align-items:center; }\n  .gw-opt { display:flex; gap:6px; align-items:center; font-size:.9em; color:var(--muted); flex-wrap:wrap; }\n  .gw-opt button { padding:6px 10px; }\n  button { font:inherit; padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); cursor:pointer; }\n  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }\n  button[aria-pressed=\"true\"] { border-color:var(--accent); color:var(--accent); font-weight:600; }\n  .gw-answer { display:none; padding:12px; border:1px solid var(--ok); border-radius:8px; }\n  .gw-answer.open { display:block; }\n  .gw-value { font-size:1.6em; font-weight:700; color:var(--ok); }\n  .dial-warn { margin-top:6px; font-size:.92em; color:var(--muted); }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"gw-root\">\u003c/div>\n\u003cscript>\n(function () {\n  const ID = 'dial';\n  const TITLE = '다이얼게이지';\n  const NS = 'http://www.w3.org/2000/svg';\n  const P = ID + '-';                       // SVG defs/DOM id 접두어(병합 시 충돌 방지)\n  const LOGO = 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBxIQEhUQEBITFRUVFRUVFRgXEhgVFxUWFRYXFxUXFRUYHSggGBolHRUXITEhJSsrLi4uFyEzODMvNygtLisBCgoKDg0OGxAQGy4mICYvLy0vLS8vOC0tLS8tLy0vLS0tLy0vLS0tLS0tLS0tLy .00과 그림이 같아지므로 범위에서 제외(QA F1)\n  const STATE_MIN = 0, STATE_MAX = 999;\n  const BOUNDARY_POOL = [0, 99, 100, 101, 199, 200];\n  let state = 0;\n  let smallContinuous = true;    // smallNeedleMotion: 기본 'continuous'(실제 계기와 같음), 'step'은 선택 옵션\n  let zoomed = false;\n\n  // ---- 기하 ----\n  const CX = 200, CY = 250;\n  const R_OUT = 186;            // 베젤 바깥(널링)\n  const R_KNURL_IN = 175;       // 널링 띠 안쪽\n  const R_BEZEL_IN = 169;       // 베젤 안쪽 경사면\n  const R_FACE = 164;           // 눈금판\n  const R_TICK = 158;           // 눈금선 바깥 끝\n  const SCX = 200, SCY = CY + 80, SR = 38;       // 작은 다이얼(회전계): 하단, 큰 바늘보다 위 레이어(QA W1)\n  const VB_W = 400, VB_H = 560, Z_W = 160, Z_H = 224;   // 확대 시야도 같은 5:7 비율(높이 고정)\n  const SPINDLE_PER_S = 0.025;  // 스핀들 들어감(그림 단위/0.01mm), 장식\n\n  // ---- 명세 함수: 상태 → 정답 (정수 연산, 표시 단계에서만 문자열) ----\n  function answer(s) {\n    const A = Math.floor(s / 100);\n    const n = s % 100;\n    const str = A + '.' + String(n).padStart(2, '0');\n    let note = '';\n    if (smallContinuous && n >= 90) {\n      const nextLbl = (A + 1) === 10 ? '0(10)' : String(A + 1);\n      const wrong = (A + 1) + '.' + String(n).padStart(2, '0');\n      note = '주의: 작은 바늘이 ' + nextLbl + '에 거의 닿아 있지만 큰 바늘이 아직 0을 지나지 않았으므로 ' +\n             A + 'mm로 읽습니다(' + wrong + 'mm로 읽으면 1mm 틀림).';\n    } else if (smallContinuous && n \u003c= 10 && A >= 1) {\n      note = '참고: 큰 바늘이 0을 막 지나 작은 바늘이 숫자 ' + A + ' 위치를 조금 넘었습니다 → ' + A + 'mm로 읽습니다.';\n    }\n    return {\n      s: s, A: A, n: n, valueText: str, note: note,\n      text: '작은 바늘 ' + A + 'mm + 큰 바늘 ' + n + '눈금 × 0.01 = ' + str + 'mm'\n    };\n  }\n  function bigAngle(s) { return (s % 100) * 3.6; }\n  function smallAngle(s) { return smallContinuous ? (s / 100) * 36 : Math.floor(s / 100) * 36; }\n\n  let lastProblem = -1;\n  function randomState() {\n    let s;\n    do {\n      if (Math.random() \u003c 0.2) s = BOUNDARY_POOL[Math.floor(Math.random() * BOUNDARY_POOL.length)];\n      else s = STATE_MIN + Math.floor(Math.random() * (STATE_  ') translate(' + (-SCX) + ' ' + (-SCY) + ')');\n    inset.setAttribute('display', 'inline');\n  }\n\n  function draw() {\n    bigNeedle.setAttribute('transform', 'rotate(' + bigAngle(state) + ' ' + CX + ' ' + CY + ')');\n    smallNeedle.setAttribute('transform', 'rotate(' + smallAngle(state) + ' ' + SCX + ' ' + SCY + ')');\n    spindle.setAttribute('transform', 'translate(0 ' + (-state * SPINDLE_PER_S) + ')');\n    if (zoomed && !drag) setViewBox();   // 드래그 중에는 시야 고정(좌표 되먹임 방지), 놓으면 바늘 끝으로 이동\n  }\n\n  // ---- 드래그: 누적 각 방식 (99↔0 래핑 처리) ----\n  let drag = null;\n  function pointerAngle(evt) {\n    const pt = svg.createSVGPoint();\n    pt.x = evt.clientX; pt.y = evt.clientY;\n    const p = pt.matrixTransform(svg.getScreenCTM().inverse());\n    let deg = Math.atan2(p.x - CX, -(p.y - CY)) * 180 / Math.PI;   // 12시 기준 시계방향\n    if (deg \u003c 0) deg += 360;\n    return deg;\n  }\n  function bindDrag(target) {\n    target.addEventListener('pointerdown', function (e) {\n      if (!e.target.classList || !e.target.classList.contains('dial-grab')) return;\n      e.preventDefault();\n      try { target.setPointerCapture(e.pointerId); } catch (_) { /* 비활성 포인터(합성 이벤트) */ }\n      drag = { id: e.pointerId, theta: pointerAngle(e), sReal: state };\n      svg.classList.add('dragging');\n      closeAnswer();\n    });\n    target.addEventListener('pointermove', function (e) {\n      if (!drag || e.pointerId !== drag.id) return;\n      const th = pointerAngle(e);\n      let d = th - drag.theta;\n      if (d > 180) d -= 360;\n      else if (d \u003c= -180) d += 360;\n      drag.theta = th;\n      drag.sReal += d / 3.6;\n      if (drag.sReal \u003c STATE_MIN) drag.sReal = STATE_MIN;\n      if (drag.sReal > STATE_MAX) drag.sReal = STATE_MAX;\n      setState(Math.round(drag.sReal));\n    });\n    function end(e) {\n      if (!drag || e.pointerId !== drag.id) return;\n      drag = null;\n      svg.classList.remove('dragging');\n      if (zoomed) setViewBox();\n    }\n    target.addEventListener('pointerup', end);\n    target.addEventListener('pointercancel', end);\n    // 키보드: ←/→ 1눈금, Shift 10눈금\n    target.addEventListener('keydown', function (e) {\n      const step = e.shiftKey ? 10 : 1;\n      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { setState(state + step); e.preventDefault(); }\n      else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { setState(state - step); e.preventDefault(); }\n    });\n  }\n\n  function setState(s) {\n    s = Math.max(STATE_MIN, Math.min(STATE_MAX, Math.round(s)));\n    if (s !== state) closeAnswer();\n    state = s;\n    draw();\n  }\n  function closeAnswer() { if (ans) ans.classList.remove('open'); }\n\n  function reveal() {\n    const a = answer(state);\n    ans.innerHTML = '\u003cdiv class=\"gw-value\">' + a.valueText + ' mm\u003c/div>\u003cdiv>' + a.text + '\u003c/div>' +\n      (a.note ? '\u003cdiv class=\"dial-warn\">' + a.note + '\u003c/div>' : '');\n    ans.classList.toggle('open');\n    if (ans.classList.contains('open') && ans.getBoundingClientRect) {\n      const r = ans.getBoundingClientRect();\n      if (r.top \u003c 0 || r.bottom > (window.innerHeight || document.documentElement.clientHeight)) {\n        ans.scrollIntoView({ block: 'nearest', behavior: 'smooth' });\n      }\n    }\n  }\n  function newProblem() {\n    closeAnswer();\n    state = randomState();\n    draw();\n  }\n\n  function setMotion(cont) {\n    smallContinuous = cont;\n    contBtn.setAttribute('aria-pressed', String(cont));\n    stepBtn.setAttribute('aria-pressed', String(!cont));\n    closeAnswer();                     // 설명문(주의 문구)이 모드에 따라 달라지므로 닫음\n    draw();\n  }\n\n  function mount(el_) {\n    root = el_;\n    root.innerHTML =\n      '\u003cdiv class=\"dial-wrap\">' +\n      '\u003ch2>' + TITLE + ' (0.01 mm)\u003c/h2>' +\n      '\u003cp class=\"dial-help\">측정 범위 0~9.99 mm · 다이얼을 잡고 돌려 큰 바늘을 움직인 뒤, 작은 바늘(mm)과 큰 바늘(0.01 mm)을 읽어 보세요.\u003c/p>' +\n      '\u003cdetails class=\"dial-note\" id=\"' + P + 'tip\">\u003csummary>읽는 요령 · 99→100 경계 주의\u003c/summary>\u003cp>작은 바늘은 큰 바늘과 함께 조금씩 움직여 숫자 사이에 걸려 있을 수 있습니다. 이때는 \u003cb>지나온(작은) 숫자\u003c/b>를 읽습니다. ' +\n      '큰 바늘이 90~99 근처면 작은 바늘이 다음 숫자에 거의 닿아 있어도 아직 넘지 않은 것이므로 1mm 더 읽지 않도록 주의하세요(예: 0.99 mm를 1.99 mm로 읽는 실수).\u003c/p>\u003c/details>' +\n      '\u003csvg class=\"gw-svg\" id=\"' + P + 'svg\" viewBox=\"0 0 ' + VB_W + ' ' + VB_H + '\" tabindex=\"0\" role=\"img\" aria-label=\"다이얼게이지 눈금\">\u003c/svg>' +\n      '\u003cdiv class=\"gw-bar\">\u003cbutton class=\"primary\" id=\"' + P + 'reveal\">정답확인\u003c/button>' +\n      '\u003cbutton id=\"' + P + 'new\">새 문제\u003c/button>' +\n      '\u003cbutton id=\"' + P + 'zoom\" aria-pressed=\"false\">확대\u003c/button>\u003c/div>' +\n      '\u003cdiv class=\"gw-bar\">\u003cspan class=\"gw-opt\" role=\"group\" aria-label=\"작은 바늘 움직임\">작은 바늘:' +\n      '\u003cbutton id=\"' + P + 'mcont\" aria-pressed=\"true\" title=\"큰 바늘이 도는 만큼 작은 바늘도 연속으로 움직입니다(실제 계기와 같음)\">연속 이동(기본)\u003c/button>' +\n      '\u003cbutton id=\"' + P + 'mstep\" aria-pressed=\"false\" title=\"큰 바늘이 0을 지날 때만 작은 바늘이 1눈금씩 넘어갑니다\">계단식\u003c/button>\u003c/span>\u003c/div>' +\n      '\u003cdiv class=\"gw-answer\" id=\"' + P + 'ans\">\u003c/div>' +\n      '\u003c/div>';\n    svg = root.querySelector('#' + P + 'svg');\n    ans = root.querySelector('#' + P + 'ans');\n    zoomBtn = root.querySelector('#' + P + 'zoom');\n    contBtn = root.querySelector('#' + P + 'mcont');\n    stepBtn = root.querySelector('#' + P + 'mstep');\n    // 읽는 요령: 넓은 화면(태블릿·데스크톱)은 펼친 상태, 휴대폰 폭에서는 접어서 첫 화면에 다이얼+버튼이 들어오게 함\n    try {\n      if (window.matchMedia && window.matchMedia('(min-width: 600px) and (min-height: 1000px)').matches) {\n        root.querySelector('#' + P + 'tip').open = true;\n      }\n    } catch (_) {}\n    root.querySelector('#' + P + 'reveal').onclick = reveal;\n    root.querySelector('#' + P + 'new').onclick = newProblem;\n    zoomBtn.onclick = function () {\n      zoomed = !zoomed;\n      zoomBtn.setAttribute('aria-pressed', String(zoomed));\n      setViewBox();\n    };\n    contBtn.onclick = function () { setMotion(true); };\n    stepBtn.onclick = function () { setMotion(false); };\n    buildSvg();\n    bindDrag(svg);\n    setMotion(smallContinuous);\n    newProblem();\n  }\n\n  window.GaugeWidget = { id: ID, title: TITLE, mount: mount, newProblem: newProblem, reveal: reveal, answer: answer };\n  document.addEventListener('DOMContentLoaded', function () {\n    const r = document.getElementById('gw-root');\n    if (r) mount(r);\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","height":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>하이트게이지 눈금읽기\u003c/title>\n\u003cstyle>\n  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#0969da; --ok:#1a7f37; --panel:#fafbfc;\n          /* 금속 그라데이션 색: sc=본척 눈금면(무광 크롬), m=슬라이더·기둥 몸체(새틴 크롬), vn=부척판, b=베이스(은회색 주물), p=정반(석정반) */\n          --sc0:#d3d9df; --sc1:#f4f6f8; --m0:#7d868f; --m1:#f6f8fa; --m2:#c9cfd5; --m3:#9ba3ab;\n          --vn0:#f1f4f7; --vn1:#d6dde5; --b0:#bcc2c8; --b1:#eceff1; --b2:#8e959c; --p0:#a3a9af; --p1:#767c82;\n          --shine:rgba(255,255,255,0.75); --shade:rgba(0,0,0,0.35); --inv:#f3f5f7;\n          /* 정답 강조: hl=어미자·아들자 일치선(빨강), rd=읽은 본척 눈금(파랑) */\n          --hl:#d1242f; --rd:#0969da;\n          /* 각인: eng=새겨진 바닥색, eng-sh=위쪽 안쪽 그림자, eng-hi=아래쪽 밝은 테두리 */\n          --eng:#4a535d; --eng-sh:#1f2429; --eng-hi:rgba(255,255,255,0.9); }\n  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#4493f8; --ok:#3fb950; --panel:#11161d;\n          --sc0:#252b33; --sc1:#353d47; --m0:#13171c; --m1:#6b7682; --m2:#3e4752; --m3:#272e36;\n          --vn0:#3b4451; --vn1:#2a313b; --b0:#3a4148; --b1:#5d6670; --b2:#1d2126; --p0:#3b4046; --p1:#23272c;\n          --shine:rgba(255,255,255,0.22); --shade:rgba(0,0,0,0.55); --inv:#d7dde3;\n          --hl:#ff5a5f; --rd:#58a6ff;\n          --eng:#9ea9b5; --eng-sh:#0a0d10; --eng-hi:rgba(255,255,255,0.28); } }\n  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, \"Malgun Gothic\", sans-serif; }\n  .gw-svg { width:100%; height:auto; max-width:900px; max-height:max(340px, calc(100vh - 200px)); touch-action:pan-y; user-select:none; -webkit-user-select:none; display:block; outline:none; }\n  .h-row { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-start; }\n  .h-row .gw-svg { flex:660 1 440px; min-width:0; }\n  .h-row .gw-loupe { flex:280 1 220px; max-width:360px; margin:0 auto; cursor:ns-resize; }\n  /* 터치: 부척판(손잡이)에서 시작한 터치만 눈금을 움직이고, 나머지는 화면 스크롤(touchGuard 참고) */\n  .gw-locked .gw-svg { cursor:default !important; }\n  button[aria-pressed=\"true\"] { background:#fff4d6; border-color:#d4a72c; }\n  .h-loupe-ln { stroke:var(--accent); stroke-width:1; stroke-opacity:0.6; stroke-dasharray:3 3; }\n  .gw-svg:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }\n  .gw-bar { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; align-items:center; }\n  .gw-help { color:var(--muted); font-size:0.9em; margin:4px 0 8px; }\n  .gw-tag { color:var(--muted); font-size:0.9em; }\n  /* 좁은 배치(휴대폰 세로): 높이 제한을 완화 */\n  .gw-narrow .gw-svg { max-height:max(360px, calc(100vh - 150px)); }\n  @media (max-width:520px) {\n    body { padding:8px; font-size:15px; }\n    h2.gw-title { font-size:1.15em; }\n    .gw-bar { gap:6px; margin:8px 0; }\n    .gw-bar button { padding:5px 9px; }\n    .gw-help { margin:2px 0 4px; font-size:0.82em; line-height:1.4; }\n  }\n  button { font:inherit; padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); cursor:pointer; }\n  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }\n  .gw-answer { display:none; padding:12px; border:1px solid var(--ok); border-radius:8px; }\n  .gw-answer.open { display:block; }\n  .gw-value { font-size:1.6em; font-weight:700; color:var(--ok); }\n  .gw-note { color:var(--muted); font-size:0.9em; }\n  /* SVG 요소 */\n  .h-panel { fill:var(--panel); stroke:var(--line); }\n  .h-mtl { stroke:var(--shade); stroke-width:0.8; }\n  .h-vplate { stroke:var(--accent); stroke-width:1; }\n  .h-shine { stroke:var(--shine); stroke-width:1; fill:none; }\n  .h-shade { stroke:var(--shade); stroke-width:1; fill:none; }\n  .h-shadefill { fill:var(--shade); fill-opacity:0.25; stroke:none; }\n  .h-knurl { stroke:var(--shade); stroke-width:0.7; }\n  .h-rod { stroke:var(--m3); stroke-width:2.2; }\n  .h-slot { stroke:var(--shade); stroke-width:1.2; }\n  .h-brush { stroke:var(--shine); stroke-width:0.5; opacity:0.55; }\n  .h-grain { fill:var(--shade); fill-opacity:0.18; }\n  .h-scr-edge { stroke:var(--accent); stroke-width:1.4; }\n  .h-lbl { fill:var(--muted); font-family:system-ui, \"Malgun Gothic\", sans-serif; }\n  .h-lbl-inv { fill:var(--inv); font-family:system-ui, \"Malgun Gothic\", sans-serif; }\n  .h-tick { stroke:var(--fg); stroke-width:1.2; }\n  .h-vtick { stroke:var(--fg); stroke-width:1.2; }\n  .h-hl { stroke:var(--hl); stroke-width:3.6; }                       /* 일치하는 본척·부척 눈금선 */\n  .h-hlx { stroke:var(--hl); stroke-width:3.6; stroke-linecap:round; }  /* 일치선을 양쪽으로 이은 선 */\n  .h-halo { stroke:var(--hl); stroke-opacity:0.28; stroke-width:11; stroke-linecap:round; }\n  .h-hlmark { fill:var(--hl); }\n  .h-hltxt { fill:var(--hl); font-weight:700; font-family:system-ui, \"Malgun Gothic\", sans-serif; }\n  .h-rd { stroke:var(--rd); stroke-width:2.6; }                        /* 읽은 본척 눈금(부척 0점 바로 아래) */\n  .h-rdmark { fill:var(--rd); }\n  .h-rdtxt { fill:var(--rd); font-weight:700; font-family:system-ui, \"Malgun Gothic\", sans-serif; }\n  .h-thin { stroke-width:0.8; }\n  .h-txt { fill:var(--fg); font-family:system-ui, \"Malgun Gothic\", sans-serif; }\n  .h-cap { fill:var(--muted); font-size:13px; font-family:system-ui, \"Malgun Gothic\", sans-serif; }\n  .h-ind { fill:var(--accent); fill-opacity:0.08; stroke:var(--accent); stroke-dasharray:4 3; }\n  .h-iface { stroke:var(--accent); stroke-width:1; stroke-opacity:0.5; }\n  /* 학교 로고·문구 각인: 검정으로 그린 뒤 각인 필터가 색·그림자·하이라이트를 입힌다 */\n  .h-engt { fill:#000; font-weight:700; font-family:system-ui, \"Malgun Gothic\", sans-serif; }\n  .h-eng-c { flood-color:var(--eng); }\n  .h-eng-s { flood-color:var(--eng-sh); }\n  .h-eng-h { flood-color:var(--eng-hi); }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"gw-root\">\u003c/div>\n\u003cscript>\n(function () {\n  const ID = 'height';\n  const TITLE = '하이트게이지';\n  // 학교 로고(312×312 jpg, 위쪽 0~175px가 엠블럼). 빌드 스크립트가 data URI를 주입한다.\n  const LOGO_URI = 'data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBxIQEhUQEBITFRUVFRUVFRgXEhgVFxUWFRYXFxUXFRUYHSggGBolHRUXITEhJSsrLi4uFyEzODMvNygtLisBCgoKDg0OGxAQGy4mICYvLy0vLS8vOC0tLS8tLy0vLS0tLy0vLS0tLS0tLS0tLy0tLS0tLS0tLS0tLS0tLS0tLf/AABEIATgBOAMBEQACEQEDEQH/xAAcAAEAAgMBAQEAAAAAAAAAAAAABQYBBAcCAwj/xABYEAABBAECBAIEBQsPCwIHAAABAAIDEQQSIQUGEzEiQQcUUWEyUnGBkRUWI0JUkqGzwdLTFyQ0U2JkdIOTlKOk0ePwJTM1Q0RlsbLCw+F1hVVjcnOClaL/xAAbAQEAAwEBAQEAAAAAAAAAAAAAAwQFAgEGB//EADwRAAIBAgMDCgQFAwQDAQAAAAABAgMRBBIhMUFRBRNhcYGRobHB8BQi0eEVMjNSYjRC8SNygpIGJFND/9oADAMBAAIRAxEAPwDuKAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgCAIAgMWlwZQC0Bi0BlAEAQBAEAQBAEAQBAEAQBAEAQBAEAQBAEAQBAEAQBAEAQBAEAQBAEAtAauFxKCe+jNFJprVoka+rur0k12P0LqUJQ/MrHEakZ/laZtLk7IDjOfIzOwoWuqOX1nqDSDq0RBzN6sUfZV2p6cIulOT2q1u1larNqrCK2O9+xE8FAWSF5xyJ4sOaXGNSMaHA+E01rml5p+x8Ad+TdS0FB1Ep7GQ4hzVNuG0xyrxGfKxxkTxtj6jnOjaNViL7TXq7k0TY2IIO10lenGnLLB3seYepKpDNNbSbBUROLQGUAQBAEAQBAEAQBAEAQBAEAQBAEAQBAEAQBAEAQBAEAQBAEAtALQHgoDlHJWI/D4p6qGkua2aOV2g0Y6bLFMSHnS53gFUABpG7iVrYmSq4fP1NdexrYY2Gi6WIydafVtW86y1ZCNkheYOXWZjonulnidFr0OheGOGsNDt const resStr = '0.02';\n    const val = (answerU / 100).toFixed(2);\n    // 표기 전용: 본척 숫자는 cm(10mm마다 0,1,2,…,30), 계산·정답은 mm. 정수 mm에서 바로 만든다.\n    const C = Math.floor(M / 10), rem = M % 10;\n    const mainStr = '본척 ' + C + 'cm(=' + (C * 10) + 'mm)' + (rem ? ' + ' + rem + 'mm' : '');\n    const text = mainStr + ' + 부척 ' + n + '번째 선 × ' + resStr + 'mm = ' + val + 'mm';\n    const detail = n === 0\n      ? '부척 0점 바로 아래 본척 눈금은 ' + lineName(M) + ', 부척 0번째 선(0점이 본척 선과 일치)'\n      : '부척 0점 바로 아래 본척 눈금은 ' + lineName(M) + ', 부척 ' + n + '번째 선이 본척 ' + lineName(M + n) + '과 일치';\n    return { M: M, n: n, answerU: answerU, value: val, text: text, detail: detail };\n  }\n\n  // 본척 선 이름: 숫자(cm)가 적힌 선이면 'Xcm 선(=Ymm)', 아니면 'Xcm 숫자에서 k칸 위 선(=Ymm)' (1칸 = 1mm)\n  function lineName(mm) {\n    const c = Math.floor(mm / 10), k = mm % 10;\n    return k === 0 ? c + 'cm 선(=' + mm + 'mm)' : c + 'cm 숫자에서 ' + k + '칸 위 선(=' + mm + 'mm)';\n  }\n\n  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }\n  function randomState() {\n    if (Math.random() \u003c 0.2) {\n      const pick = randInt(0, 3);\n      if (pick === 0) return randInt(0, 300) * 100;                       // n = 0\n      if (pick === 1) return randInt(0, 299) * 100 + (N - 1) * resU;      // n = N-1 (x.98)\n      if (pick === 2) return 0;\n      return 30000;\n    }\n    return randInt(0, 30000 / resU) * resU;\n  }\n\n  // ---- 전체 그림 내부 좌표(실물형 하이트게이지, 가로 0~240 / 세로 0~590) ----\n  // 참조 사진처럼 기둥은 베이스 왼쪽 뒤에 서 있고, 스크라이버는 왼쪽으로, 클램프 노브는 오른쪽으로 나온다.\n  const OV_X0 = 6, OV_X1 = 236, OV_YB = 566, OV_YT = 32, OV_MAXMM = 372;\n  const CX0 = 104, CX1 = 128;          // 기둥(본척) 좌우\n  const BX0 = 94, BX1 = 232, BH = 46;  // 베이스 좌우·높이\n  const SL = CX0 - 6, SR = CX1 + 22;   // 슬라이더 몸체 좌우\n  const kO = (OV_YB - OV_YT) / OV_MAXMM;               // px/mm (전체 그림 내부 좌표)\n\n  // 확대 창이 보여 주는 구간: 부척 0점 아래 2.5mm ~ 위 51.5mm (LEN + 5 mm)\n  const MAG_BELOW = 250, MAG_SPAN = LEN + 5;\n\n  // ---- 화면 배치 2가지: 전체 + 확대 창 ----\n  // 넓은 화면: mag.x) / 2 ? 'ov' : 'mag';\n  }\n\n  // 화면 좌표(cx, cy)가 '손잡이'(움직이는 부척판) 위인지 판정한다. 터치는 손잡이에서 시작할 때만 눈금을 움직인다.\n  function gripAt(cx, cy) {\n    const p = svgPoint({ clientX: cx, clientY: cy });\n    if (regionAt(p) === 'mag') {\n      // 확대 창: 파란 부척판 세로 띠(좌우 10 여유)\n      const M_ = L.mag;\n      return p.y >= M_.top && p.y \u003c= M_.bot && p.x >= M_.ix - 10 && p.x \u003c= M_.ix + M_.vW + 10;\n    }\n    // 전체 그림: 슬라이더 몸체(스크라이버·노브 포함) 둘레 14 여유\n    const ix = (p.x - L.ov.tx) / L.ov.s, iy = (p.y - L.ov.ty) / L.ov.s, pad = 14;\n    const ovY = function (u) { return OV_YB - u / 100 * kO; };\n    const top = ovY(state + (LEN + 4) * 100) - 12, bot = Math.min(ovY(state) + 3, OV_YB);\n    return ix >= SL - 16 - pad && ix \u003c= SR + 10 + pad && iy >= top - pad && iy \u003c= bot + pad;\n  }\n\n  // 터치가 손잡이에서 시작하면 브라우저의 화면 스크롤을 막는다(그래야 끄는 동안 화면이 같이 안 움직임).\n  // 손잡이 밖이거나 잠금 중이면 아무것도 막지 않아 화면이 그대로 스크롤된다.\n  function touchGuard(target, isGrip) {\n    target.addEventListener('touchstart', function (e) {\n      if (e.touches.length !== 1) return;\n      const t = e.touches[0];\n      if (!locked && isGrip(t.clientX, t.clientY)) e.preventDefault();\n    }, { passive: false });\n  }\n\n  // 이 포인터 입력으로 조작을 시작해도 되는지: 잠금 중이면 불가, 마우스는 어디서나, 터치·펜은 손잡이에서만\n  function mayStart(e, isGrip) {\n    if (locked) return false;\n    if (e.pointerType === 'mouse') return true;\n    return isGrip(e.clientX, e.clientY);\n  }\n\n  function setLocked(v) {\n    locked = v;\n    const b = root.querySelector('#' + ID + '-lock');\n    b.setAttribute('aria-pressed', v ? 'true' : 'false');\n    b.textContent = v ? '🔒 잠금 해제' : '🔓 눈금 잠금';\n    root.classList.toggle('gw-locked', v);\n  }\n\n  function bindDrag(target) {\n    let drag = null;\n    touchGuard(target, gripAt);\n    target.addEventListener('pointerdown', function (e) {\n      if (!mayStart(e, gripAt)) return;   // 손잡이 밖 터치 → 화면 스크롤에 맡긴다\n      const p = svgPoint(e);\n      drag = { id: e.pointerId, region: regionAt(p), y0: p.y, v0: state };\n      try { target.setPointerCapture(e.pointerId); } catch (err) { /* 캡처 실패해도 드래그는 계속 */ }\n      e.preventDefault();\n    });\n    target.addEventListener('pointermove', function (e) {\n      if (!drag || e.pointerId !== drag.id) return;\n      const dy = svgPoint(e).y - drag.y0;            // SVG y는 아래로 증가\n      const k = drag.region === 'ov' ? kO * L.ov.s : kM();\n      setState(drag.v0 - dy / k * 100);               // 위로 끌면 y 증가\n    });\n    function end(e) { if (drag && e.pointerId === drag.id) drag = null; }\n    target.addEventListener('pointerup', end);\n    target.addEventListener('pointercancel', end);\n    target.addEventListener('keydown', function (e) {\n      if (locked) return;\n      let d = 0;\n      if (e.key === 'ArrowUp') d = resU; else if (e.key === 'ArrowDown') d = -resU;\n      else if (e.key === 'PageUp') d = 100; else if (e.key === 'PageDown') d = -100;\n      if (d) { setState(state + d); e.preventDefault(); }\n    });\n  }\n\n  function setLoupe(v) {\n    loupeOff = Math.max(LOUPE_MIN, Math.min(LOUPE_MAX, v));\n    draw();\n  }\n  function bindLoupe(target) {\n    let drag = null;\n    const k = function () { return (LP.bot - LP.top) / LOUPE_SPAN; };   // px per 1/100mm\n    function pt(e) {\n      const p = target.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;\n      return p.matrixTransform(target.getScreenCTM().inverse());\n    }\n    // 고배율 창의 손잡이: 가운데 파란 부척판 세로 띠(좌우 10 여유)\n    function grip(cx, cy) {\n      const p = pt({ clientX: cx, clientY: cy });\n      return p.y >= LP.top && p.y \u003c= LP.bot && p.x >= LP.ix - 10 && p.x \u003c= LP.ix + LP.vW + 10;\n    }\n    touchGuard(target, grip);\n    target.addEventListener('pointerdown', function (e) {\n      if (!mayStart(e, grip)) return;\n      drag = { id: e.pointerId, y0: pt(e).y, v0: loupeOff };\n      try { target.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }\n      e.preventDefault();\n    });\n    target.addEventListener('pointermove', function (e) {\n      if
