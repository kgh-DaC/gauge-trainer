gMetalV') + '/>' +\n      ln(cx - r * 0.7, cy + r * 0.25, cx + r * 0.7, cy - r * 0.25, 'h-slot');\n  }\n  // 오른쪽으로 튀어나온 클램프 노브(로렛 손잡이). xl = 몸체 오른쪽 면, cy = 중심 높이\n  function clampKnob(xl, cy) {\n    let s = rc(xl, cy - 2, 3, 4, 'h-mtl', gf('gMetalV'));\n    s += rc(xl + 3, cy - 6, 9, 12, 'h-mtl', gf('gKnurl') + ' rx=\"2\"');\n    for (let k = -4; k \u003c= 4; k += 2) s += ln(xl + 4, cy + k, xl + 11, cy + k, 'h-knurl');\n    return s;\n  }\n\n  // 본척+부척 눈금 (확대 창). toY: 1/100mm → SVG y\n  function scales(o) {\n    const y = state, toY = o.toY, a = revealed ? answer(state) : null;\n    let s = '';\n    // 정반(0mm 아래)\n    const y0 = toY(0);\n    if (y0 \u003c o.bot) {\n      s += rc(o.left, y0, o.right - o.left, o.bot - y0, 'h-mtl', gf('gPlate'));\n      s += ln(o.left, y0 + 0.5, o.right, y0 + 0.5, 'h-shine');\n    }\n    const yFloor = Math.min(y0, o.bot);   // 정반 윗면(그 아래로는 부품을 그리지 않음)\n    // 본척 기둥(눈금면 + 옆 모서리 + 헤어라인 질감)\n    const colTop = Math.max(o.top, toY((300 + LEN + 5) * 100));\n    s += rc(o.left + 6, colTop, o.ix - o.left - 6, yFloor - colTop, 'h-mtl', gf('gScale'));\n    s += rc(o.left + 6, colTop, o.ix - o.left - 6, yFloor - colTop, '', gf('brushV'));\n    if (o.bevel) {\n      s += rc(o.left + 6, colTop, o.bevel, yFloor - colTop, 'h-mtl', gf('gBevel'));\n      s += ln(o.left + 6 + o.bevel + 0.5, colTop, o.left + 6 + o.bevel + 0.5, yFloor, 'h-shine');\n    }\n    // 본척 눈금\n    const mLo = Math.max(0, Math.ceil(o.loU / 100)), mHi = Math.min(300 + LEN, Math.floor(o.hiU / 100));\n    for (let m = mLo; m \u003c= mHi; m++) {\n      const sy = toY(m * 100);\n      const len = m % 10 === 0 ? o.mL[2] : m % 5 === 0 ? o.mL[1] : o.mL[0];\n      const hl = a && m === a.M + a.n, rd = a && m === a.M;\n      s += ln(o.ix - len, sy, o.ix, sy, hl ? 'h-hl' : rd ? 'h-rd' : 'h-tick');\n      if (m % 10 === 0) s += tx(o.ix - o.mL[2] - 4, sy + o.font * 0.35, String(m / 10), 'end', o.font);   // 본척 숫자: cm\n    }\n    // 슬라이더 몸체(부척판을 둘러싼 크롬 틀 + 고정 나사 + 학교 명판)\n    const bt = toY(y + LEN * 100 + 380), bb = Math.min(toY(y - 380), yFloor);\n    if (bb > bt) {\n      s += rc(o.ix, bt, o.right - o.ix, bb - bt, 'h-mtl', gf('gMetal'));\n      s += rc(o.ix, bt, o.right - o.ix, bb - bt, '', gf('brushV'));\n      s += ln(o.ix, bt + 0.5, o.right, bt + 0.5, 'h-shine');\n      const rx = o.ix + o.vW + (o.right - o.ix - o.vW) / 2;\n      const sTop = toY(y + LEN * 100 + 150) + 30, sBot = toY(y - 150) - 30;\n      if (sTop > bt + 6 && sTop \u003c bb - 6) s += screw(rx, sTop, 6);\n      if (sBot > bt + 6 && sBot \u003c bb - 6) s += screw(rx, sBot, 6);\n      // 부척판 옆 그림자 홈\n      s += ln(o.ix + o.vW + 1.5, Math.max(bt, toY(y + LEN * 100 + 150)), o.ix + o.vW + 1.5, Math.min(bb, toY(y - 150)), 'h-shade');\n      // 학교 각인: 부척판 오른쪽 슬라이더 몸체(눈금을 가리지 않음), 슬라이더와 함께 움직임\n      const np = o.np;\n      if (!np) { /* 고배율 창: 각인 생략 */ } else {\n      const h0 = engravingV(0, 0, np.em, np.font).h;\n      const cy = toY(y + LEN * 50);\n      if (cy + h0 / 2 \u003c yFloor - 2) s += engravingV(rx, cy - h0 / 2, np.em, np.font).s;\n      }\n    }\n    // 부척판\n    const vt = toY(y + LEN * 100 + 150), vb = Math.min(toY(y - 150), yFloor);\n    if (vb > vt) s += rc(o.ix, vt, o.vW, vb - vt, 'h-vplate', gf('gVern'));\n    // 부척 눈금\n    for (let i = 0; i \u003c= N; i++) {\n      const u = y + i * pitchU;\n      if (u \u003c o.loU - 50 || u > o.hiU + 50) continue;\n      const sy = toY(u);\n      const big = i % labelEvery === 0;\n      const hl = a && i === a.n;\n      s += ln(o.ix, sy, o.ix + (big ? o.vL[1] : o.vL[0]), sy, hl ? 'h-hl' : 'h-vtick');\n      if (big) s += tx(o.ix + o.vL[1] + 4, sy + o.font * 0.35, String(i / labelEvery), 'start', o.font);\n    }\n    // 정답확인 상태: 일치선(본척 M+n = 부척 n번째)을 빨간 굵은 선으로 본척·부척에 걸쳐 잇고, 읽은 본척 눈금(M)은 파란 표식\n    if (a) {\n      const xl = o.ix - o.mL[2] - 2, xr = o.ix + o.vL[1] + 2, mx = o.left + 6 + (L.narrow ? 2 : (o.bevel || 0) + 3), ts = o.font * 0.82;\n      const tri = function (yy, cls) {\n        return pth('M' + f2(mx) + ' ' + f2(yy - 5) + ' L' + f2(mx + 9) + ' ' + f2(yy) + ' L' + f2(mx) + ' ' + f2(yy + 5) + ' Z', cls);\n      };\n      if (a.n !== 0) {\n        const ry = toY(a.M * 100);\n        s += tri(ry, 'h-rdmark') + tx(mx + 12, ry + ts * 0.36, L.narrow ? '본척' : '읽은 본척', 'start', ts, 'h-rdtxt');\n      }\n      const cy2 = toY((a.M + a.n) * 100);\n      s += ln(xl, cy2, xr, cy2, 'h-halo') + ln(xl, cy2, xr, cy2, 'h-hlx');\n      s += tri(cy2, 'h-hlmark') + tx(mx, cy2 - 7, '일치', 'start', ts, 'h-hltxt');\n    }\n    // 경계선\n    s += ln(o.ix, o.top, o.ix, o.bot, 'h-iface');\n    return s;\n  }\n\n  // 전체 그림: 실물형 버니어 하이트게이지(정반·베이스·기둥·슬라이더·스크라이버·클램프 노브)\n  // F: 글자 배율(좁은 화면에서는 전체 그림을 축소해 그리므로 글자를 키운다), full: 보조 이름표까지 모두 표시\n  function overview(y, F, full) {\n    const ovY = function (u) { return OV_YB - u / 100 * kO; };\n    let s = full ? tx(OV_X0, 16, '전체 (본척 숫자 0~30cm)', 'start', 13, 'h-cap') : '';\n    // 정반\n    s += rc(OV_X0, OV_YB, OV_X1 - OV_X0, 18, 'h-mtl', gf('gPlate'));\n    s += ln(OV_X0, OV_YB + 0.5, OV_X1, OV_YB + 0.5, 'h-shine');\n    s += tx(OV_X0 + 5, OV_YB + 9 + 4 * F, '정반', 'start', 10 * F, 'h-lbl-inv');\n\n    // 베이스(넓은 은회색 주물 받침): 아랫단 + 둥근 윗몸 + 앞면 손잡이 홈 + 기둥 고정 보스\n    const BT = OV_YB - BH, PL = OV_YB - 13;\n    s += rc(BX0, PL, BX1 - BX0, OV_YB - PL, 'h-mtl', gf('gPlinth') + ' rx=\"2\"');\n    s += rc(BX0, PL, BX1 - BX0, OV_YB - PL, '', gf('grain'));\n    s += ln(BX0 + 2, PL + 0.8, BX1 - 2, PL + 0.8, 'h-shine');\n    const bd = 'M' + (BX0 + 5) + ' ' + PL + ' V' + (BT + 10) + ' Q' + (BX0 + 5) + ' ' + BT + ' ' + (BX0 + 15) + ' ' + BT +\n               ' H' + (BX1 - 18) + ' Q' + (BX1 - 5) + ' ' + BT + ' ' + (BX1 - 5) + ' ' + (BT + 13) + ' V' + PL + ' Z';\n    s += pth(bd, 'h-mtl', gf('gBase'));\n    s += pth(bd, '', gf('grain'));\n    s += pth('M' + (BX0 + 7) + ' ' + (BT + 9) + ' Q' + (BX0 + 7) + ' ' + (BT + 1.5) + ' ' + (BX0 + 15) + ' ' + (BT + 1.5) +\n             ' H' + (BX1 - 18) + ' Q' + (BX1 - 7) + ' ' + (BT + 1.5) + ' ' + (BX1 - 7) + ' ' + (BT + 12), 'h-shine');\n    // 베이스 앞면 학교 각인(로고 + 문구). 본척 눈금(x ≤ CX1)을 피해 오른쪽에 새김\n    const no = L.npOv;\n    s += engravingH(no.x, no.top, no.em, no.font, no.text);\n    if (full) s += tx(BX1 - 8, OV_YB - 3.5, '베이스', 'end', 8, 'h-lbl');\n    s += rc(CX0 - 5, BT - 5, CX1 - CX0 + 10, 7, 'h-mtl', gf('gMetalV') + ' rx=\"1.5\"');\n\n    // 기둥(본척, 연삭 크롬 빔) + 꼭대기 캡 + 상단 노브\n    const cTop = ovY(OV_MAXMM * 100), cBot = BT - 3;\n    s += rc(CX0, cTop, CX1 - CX0, cBot - cTop, 'h-mtl', gf('gScale'));\n    s += rc(CX0, cTop, CX1 - CX0, cBot - cTop, '', gf('brushV'));\n    s += rc(CX0, cTop, 3, cBot - cTop, '', gf('gBevel'));\n    s += ln(CX1 - 0.6, cTop, CX1 - 0.6, cBot, 'h-shade');\n    s += rc(CX0 - 3, cTop - 7, CX1 - CX0 + 6, 9, 'h-mtl', gf('gMetalV') + ' rx=\"2\"');\n    const kx = CX0 + 9, ky = ovY(36450);\n    s += '\u003ccircle cx=\"' + kx + '\" cy=\"' + f2(ky) + '\" r=\"6.5\" class=\"h-mtl\"' + gf('gKnurl') + '/>';\n    s += '\u003ccircle cx=\"' + kx + '\" cy=\"' + f2(ky) + '\" r=\"2.6\" class=\"h-mtl\"' + gf('gMetalV') + '/>';\n    for (let m = 10; m \u003c= 350; m += 10) {\n      const sy = ovY(m * 100), big = m % 50 === 0;\n      s += ln(CX1 - (big ? 9 : 5), sy, CX1, sy, 'h-tick h-thin');\n      if (big && m \u003c= 300) s += tx(CX0 - 5, sy + 4 * F, String(m / 10), 'end', 11 * F);   // cm\n    }\n    s += tx(BX0 - 3, OV_YB - 2, '0', 'end', 11 * F);\n\n    // ---- 움직이는 부분: 슬라이더(부척 창), 미세이송 나사, 클램프 노브 2개, 스크라이버 조 ----\n    const sb = ovY(y);\n    const bTop = ovY(y + (LEN + 4) * 100), bBot = Math.min(sb + 3, OV_YB);\n    // 미세이송 나사(슬라이더 위 로렛 손잡이)\n    const fx = SR - 9;\n    s += ln(fx, bTop, fx, bTop - 6, 'h-rod');\n    s += rc(fx - 5, bTop - 12, 10, 7, 'h-mtl', gf('gKnurl') + ' rx=\"1.5\"');\n    for (let k = -3; k \u003c= 3; k += 2) s += ln(fx + k, bTop - 11.4, fx + k, bTop - 5.6, 'h-knurl');\n    // 슬라이더 몸체 + 부척 창(창 안에는 뒤쪽 기둥의 본척 눈금면이 보임)\n    const wTop = ovY(y + (LEN + 2) * 100), wBot = Math.min(sb + 1.5, bBot - 1);\n    s += rc(SL, bTop, SR - SL, bBot - bTop, 'h-mtl', gf('gMetal') + ' rx=\"2\"');\n    s += rc(SL, bTop, SR - SL, bBot - bTop, '', gf('brushV'));\n    s += rc(CX0 + 2, wTop, CX1 - CX0 - 2, wBot - wTop, 'h-mtl', gf('gScale'));\n    for (let m = Math.ceil((y + 1) / 1000) * 10 - 10; m * 100 \u003c= y + (LEN + 2) * 100; m += 10) {\n      const wy2 = ovY(m * 100);\n      if (wy2 > wTop + 0.5 && wy2 \u003c wBot - 0.5) s += ln(CX1 - (m % 50 === 0 ? 9 : 5), wy2, CX1, wy2, 'h-tick h-thin');\n    }\n    s += ln(SL + 1, bTop + 0.6, SR - 1, bTop + 0.6, 'h-shine');\n    // 부척판 + 눈금(labelEvery 칸마다)\n    s += rc(CX1, wTop, 14, wBot - wTop, 'h-vplate', gf('gVern') + ' style=\"stroke-width:0.6\"');\n    for (let i = 0; i \u003c= N; i += labelEvery) {\n      const vy = ovY(y + i * pitchU);\n      s += ln(CX1, vy, CX1 + (i === 0 || i === N ? 8 : 5), vy, 'h-vtick h-thin');\n    }\n    s += screw(SR - 4, bTop + 6, 2.2);\n    s += screw(SR - 4, wBot - 4, 2.2);\n    // 클램프 노브(위: 미세이송 고정, 아래: 슬라이더 고정)\n    s += clampKnob(SR, bTop + 14);\n    s += clampKnob(SR, bTop + (bBot - bTop) * 0.55);\n    // 스크라이버 조(홀더) + 스크라이버(왼쪽으로): 아래 날(파란 선) = 부척 0점 높이\n    s += rc(SL - 16, sb - 22, 18, 20, 'h-mtl', gf('gMetalV') + ' rx=\"1.5\"');\n    s += screw(SL - 7, sb - 14, 2.8);\n    s += pth('M' + (SL - 16) + ' ' + f2(sb - 6) + ' H' + (OV_X0 + 30) + ' L' + (OV_X0 + 10) + ' ' + f2(sb) +\n             ' H' + (SL - 16) + ' Z', 'h-mtl', gf('gMetalV'));\n    s += ln(OV_X0 + 10, sb, SL - 16, sb, 'h-scr-edge');\n    s += tx(full ? OV_X0 + 10 : OV_X0 + 2, full ? sb - 10 : sb - 26, '스크라이버', 'start', full ? 10 : 8.5 * F, 'h-lbl');\n    // 확대 창이 보여주는 구간\n    const loU = y - MAG_BELOW, hiU = loU + MAG_SPAN * 100;\n    s += rc(CX0 - 12, ovY(hiU), SR - CX0 + 16, ovY(loU) - ovY(hiU), 'h-ind');\n    return s;\n  }\n\n  function draw() {\n    if (!dyn) return;\n    const y = state, km = kM(), M_ = L.mag;\n    let s = '';\n\n    // ---------- 전체 그림 (좁은 화면에서는 축소한 그림) ----------\n    if (L.narrow) {\n      s += tx(4, 16, '전체', 'start', 13, 'h-cap');\n      s += '\u003cg transform=\"translate(' + L.ov.tx + ' ' + L.ov.ty + ') scale(' + L.ov.s + ')\">' + overview(y, L.ov.F, false) + '\u003c/g>';\n    } else {\n      s += overview(y, 1, true);\n    }\n\n    // ---------- 확대 창 ----------\n    const mLoU = y - MAG_BELOW, mHiU = mLoU + MAG_SPAN * 100;\n    const toYM = function (u) { return M_.bot - (u - mLoU) / 100 * km; };\n    s += tx(M_.x, M_.capY, M_.cap, 'start', 13, 'h-cap');\n    s += rc(M_.x, M_.top, M_.w, M_.bot - M_.top, 'h-panel');\n    s += '\u003cg clip-path=\"url(#' + ID + '-clipM)\">';\n    s += scales({ toY: toYM, loU: mLoU, hiU: mHiU, top: M_.top, bot: M_.bot, left: M_.x, right: M_.x + M_.w, ix: M_.ix,\n                  mL: M_.mL, vL: M_.vL, vW: M_.vW, font: M_.font, bevel: M_.bevel, np: M_.np });\n    s += '\u003c/g>';\n    s += rc(M_.x, M_.top, M_.w, M_.bot - M_.top, 'h-panel', ' style=\"fill:none\"');\n\n    // 확대 창 안에 고배율 창이 보는 구간 표시\n    const lc = y + loupeOff, lLo = lc - LOUPE_SPAN / 2, lHi = lc + LOUPE_SPAN / 2;\n    s += rc(M_.x, toYM(lHi), M_.ix + M_.vW + 20 - M_.x, toYM(lLo) - toYM(lHi), 'h-ind', ' style=\"pointer-events:none\"');\n\n    // ---------- 고배율 창 ----------\n    const kl = (LP.bot - LP.top) / LOUPE_SPAN;\n    const toYL = function (u) { return LP.bot - (u - lLo) * kl; };\n    let t = tx(LP.x, 16, COARSE ? '고배율 (부척판을 끌어 위치 이동)' : '고배율 (위아래로 끌어 위치 이동)', 'start', 12, 'h-cap');\n    t += rc(LP.x, LP.top, LP.w, LP.bot - LP.top, 'h-panel');\n    t += '\u003cg clip-path=\"url(#' + ID + '-clipL)\">';\n    t += scales({ toY: toYL, loU: lLo, hiU: lHi, top: LP.top, bot: LP.bot, left: LP.x, right: LP.x + LP.w, ix: LP.ix,\n                  mL: LP.mL, vL: LP.vL, vW: LP.vW, font: LP.font, bevel: LP.bevel, np: null });\n    t += '\u003c/g>';\n    t += rc(LP.x, LP.top, LP.w, LP.bot - LP.top, 'h-panel', ' style=\"fill:none\"');\n    ldyn.innerHTML = t;\n    dyn.innerHTML = s;\n  }\n\n  function reveal() {\n    if (revealed) { closeAnswer(); draw(); return; }\n    const a = answer(state);\n    ans.innerHTML = '\u003cdiv class=\"gw-value\">' + a.value + ' mm\u003c/div>' +\n      '\u003cdiv>' + a.text + '\u003c/div>' +\n      '\u003cdiv class=\"gw-note\">' + a.detail + ' (확대 창: \u003cb style=\"color:var(--hl)\">빨간 굵은 선\u003c/b> = 본척과 부척 눈금이 일치하는 선, \u003cb style=\"color:var(--rd)\">파란 선\u003c/b> = 읽은 본척 눈금)\u003c/div>' +\n      '\u003cdiv class=\"gw-note\">※ 하이트게이지는 숫자가 위로 커지므로 부척 0점 바로 \u003cb>아래\u003c/b> 본척 눈금을 읽습니다. 위쪽 눈금을 읽으면 1mm 크게 나옵니다.\u003c/div>' +\n      '\u003cdiv class=\"gw-note\">※ 본척 숫자는 cm 단위(1 = 10mm)이고, 작은 눈금 1칸은 1mm입니다. 정답은 mm로 씁니다.\u003c/div>';\n    revealed = true;\n    ans.classList.add('open');\n    // 패널이 화면 밖에 열리면 보이도록 스크롤\n    try {\n      const r = ans.getBoundingClientRect();\n      const vh = window.innerHeight || document.documentElement.clientHeight;\n      if (r.top \u003c 0 || r.bottom > vh) ans.scrollIntoView({ block: 'nearest', behavior: 'smooth' });\n    } catch (e) { /* 스크롤 실패는 무시 */ }\n    draw();\n  }\n\n  function newProblem() {\n    closeAnswer();\n    state = randomState();\n    loupeOff = 0;\n    draw();\n  }\n\n  window.GaugeWidget = { id: ID, title: TITLE, mount: mount, newProblem: newProblem, reveal: reveal,\n                         _answer: answer, _randomState: randomState,\n                         _setState: setState, _setLoupe: setLoupe, _getLoupe: function () { return loupeOff; }, _getState: function () { return state; },\n                         _setLocked: setLocked, _isLocked: function () { return locked; },\n                         _layout: function () { return L; },\n                         _forceLayout: function (n) { forcedNarrow = n; applyLayout(true); } };\n  document.addEventListener('DOMContentLoaded', function () {\n    const el = document.getElementById('gw-root');\n    if (el) mount(el);\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"};
  var TABS = [{"id":"vernier","label":"버니어캘리퍼스"},{"id":"outside-mic","label":"외측마이크로미터"},{"id":"inside-mic","label":"내측마이크로미터"},{"id":"dial","label":"다이얼게이지"},{"id":"height","label":"하이트게이지"}];
  var nav = document.getElementById('tabs'), panes = document.getElementById('panes');
  var frames = {}, buttons = {};

  function show(id) {
    TABS.forEach(function (t) {
      var on = t.id === id;
      buttons[t.id].setAttribute('aria-selected', on ? 'true' : 'false');
      if (frames[t.id]) frames[t.id].classList.toggle('on', on);
    });
    if (!frames[id]) {  // 처음 열 때만 불러온다
      var f = document.createElement('iframe');
      f.title = id;
      f.srcdoc = WIDGETS[id];
      f.className = 'on';
      panes.appendChild(f);
      frames[id] = f;
    }
    try { location.hash = id; } catch (e) {}
  }

  TABS.forEach(function (t) {
    var b = document.createElement('button');
    b.setAttribute('role', 'tab');
    b.textContent = t.label;
    b.onclick = function () { show(t.id); };
    nav.appendChild(b);
    buttons[t.id] = b;
  });
  var start = (location.hash || '').slice(1);
  show(WIDGETS[start] ? start : TABS[0].id);
