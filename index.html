tDefault(); }\n    });\n  }\n\n  function setState(s) {\n    s = Math.max(STATE_MIN, Math.min(STATE_MAX, Math.round(s)));\n    if (s !== state) closeAnswer();\n    state = s;\n    draw();\n  }\n  function closeAnswer() { if (ans) ans.classList.remove('open'); }\n\n  function reveal() {\n    const a = answer(state);\n    ans.innerHTML = '\u003cdiv class=\"gw-value\">' + a.valueText + ' mm\u003c/div>\u003cdiv>' + a.text + '\u003c/div>' +\n      (a.note ? '\u003cdiv class=\"dial-warn\">' + a.note + '\u003c/div>' : '');\n    ans.classList.toggle('open');\n    if (ans.classList.contains('open') && ans.getBoundingClientRect) {\n      const r = ans.getBoundingClientRect();\n      if (r.top \u003c 0 || r.bottom > (window.innerHeight || document.documentElement.clientHeight)) {\n        ans.scrollIntoView({ block: 'nearest', behavior: 'smooth' });\n      }\n    }\n  }\n  function newProblem() {\n    closeAnswer();\n    state = randomState();\n    draw();\n  }\n\n  function setMotion(cont) {\n    smallContinuous = cont;\n    contBtn.setAttribute('aria-pressed', String(cont));\n    stepBtn.setAttribute('aria-pressed', String(!cont));\n    closeAnswer();                     // 설명문(주의 문구)이 모드에 따라 달라지므로 닫음\n    draw();\n  }\n\n  function mount(el_) {\n    root = el_;\n    root.innerHTML =\n      '\u003cdiv class=\"dial-wrap\">' +\n      '\u003ch2>' + TITLE + ' (0.01 mm)\u003c/h2>' +\n      '\u003cp class=\"dial-help\">측정 범위 0~9.99 mm · 다이얼을 잡고 돌려 큰 바늘을 움직인 뒤, 작은 바늘(mm)과 큰 바늘(0.01 mm)을 읽어 보세요.\u003c/p>' +\n      '\u003cdetails class=\"dial-note\" id=\"' + P + 'tip\">\u003csummary>읽는 요령 · 99→100 경계 주의\u003c/summary>\u003cp>작은 바늘은 큰 바늘과 함께 조금씩 움직여 숫자 사이에 걸려 있을 수 있습니다. 이때는 \u003cb>지나온(작은) 숫자\u003c/b>를 읽습니다. ' +\n      '큰 바늘이 90~99 근처면 작은 바늘이 다음 숫자에 거의 닿아 있어도 아직 넘지 않은 것이므로 1mm 더 읽지 않도록 주의하세요(예: 0.99 mm를 1.99 mm로 읽는 실수).\u003c/p>\u003c/details>' +\n      '\u003csvg class=\"gw-svg\" id=\"' + P + 'svg\" viewBox=\"0 0 ' + VB_W + ' ' + VB_H + '\" tabindex=\"0\" role=\"img\" aria-label=\"다이얼게이지 눈금\">\u003c/svg>' +\n      '\u003cdiv class=\"gw-bar\">\u003cbutton class=\"primary\" id=\"' + P + 'reveal\">정답확인\u003c/button>' +\n      '\u003cbutton id=\"' + P + 'new\">새 문제\u003c/button>' +\n      '\u003cbutton id=\"' + P + 'zoom\" aria-pressed=\"false\">확대\u003c/button>\u003c/div>' +\n      '\u003cdiv class=\"gw-bar\">\u003cspan class=\"gw-opt\" role=\"group\" aria-label=\"작은 바늘 움직임\">작은 바늘:' +\n      '\u003cbutton id=\"' + P + 'mcont\" aria-pressed=\"true\" title=\"큰 바늘이 도는 만큼 작은 바늘도 연속으로 움직입니다(실제 계기와 같음)\">연속 이동(기본)\u003c/button>' +\n      '\u003cbutton id=\"' + P + 'mstep\" aria-pressed=\"false\" title=\"큰 바늘이 0을 지날 때만 작은 바늘이 1눈금씩 넘어갑니다\">계단식\u003c/button>\u003c/span>\u003c/div>' +\n      '\u003cdiv class=\"gw-answer\" id=\"' + P + 'ans\">\u003c/div>' +\n      '\u003c/div>';\n    svg = root.querySelector('#' + P + 'svg');\n    ans = root.querySelector('#' + P + 'ans');\n    zoomBtn = root.querySelector('#' + P + 'zoom');\n    contBtn = root.querySelector('#' + P + 'mcont');\n    stepBtn = root.querySelector('#' + P + 'mstep');\n    // 읽는 요령: 넓은 화면(태블릿·데스크톱)은 펼친 상태, 휴대폰 폭에서는 접어서 첫 화면에 다이얼+버튼이 들어오게 함\n    try {\n      if (window.matchMedia && window.matchMedia('(min-width: 600px) and (min-height: 1000px)').matches) {\n        root.querySelector('#' + P + 'tip').open = true;\n      }\n    } catch (_) {}\n    root.querySelector('#' + P + 'reveal').onclick = reveal;\n    root.querySelector('#' + P + 'new').onclick = newProblem;\n    zoomBtn.onclick = function () {\n      zoomed = !zoomed;\n      zoomBtn.setAttribute('aria-pressed', String(zoomed));\n      setViewBox();\n    };\n    contBtn.onclick = function () { setMotion(true); };\n    stepBtn.onclick = function () { setMotion(false); };\n    buildSvg();\n    bindDrag(svg);\n    setMotion(smallContinuous);\n    newProblem();\n  }\n\n  window.GaugeWidget = { id: ID, title: TITLE, mount: mount, newProblem: newProblem, reveal: reveal, answer: answer };\n  document.addEventListener('DOMContentLoaded', function () {\n    const r = document.getElementById('gw-root');\n    if (r) mount(r);\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","height":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>하이트게이지 눈금읽기\u003c/title>\n\u003cstyle>\n  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#0969da; --ok:#1a7f37; --panel:#fafbfc;\n          /* 금속 그라데이션 색: sc=본척 눈금면(무광 크롬), m=슬라이더·기둥 몸체(크롬강), vn=부척판, b=베이스(주철), p=정반(석정반) */\n          --sc0:#d6dce2; --sc1:#f2f4f6; --m0:#7b848e; --m1:#f6f8fa; --m2:#c4cbd2; --m3:#98a1aa;\n          --vn0:#f1f4f7; --vn1:#d6dde5; --b0:#5c646d; --b1:#9ca4ac; --b2:#3b4148; --p0:#a3a9af; --p1:#767c82;\n          --shine:rgba(255,255,255,0.75); --shade:rgba(0,0,0,0.35); --inv:#f3f5f7; }\n  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#4493f8; --ok:#3fb950; --panel:#11161d;\n          --sc0:#252b33; --sc1:#353d47; --m0:#13171c; --m1:#6b7682; --m2:#3e4752; --m3:#272e36;\n          --vn0:#3b4451; --vn1:#2a313b; --b0:#2b3138; --b1:#4f5863; --b2:#16191d; --p0:#3b4046; --p1:#23272c;\n          --shine:rgba(255,255,255,0.22); --shade:rgba(0,0,0,0.55); --inv:#d7dde3; } }\n  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, \"Malgun Gothic\", sans-serif; }\n  .gw-svg { width:100%; height:auto; max-width:900px; max-height:max(340px, calc(100vh - 230px)); touch-action:none; user-select:none; -webkit-user-select:none; display:block; outline:none; }\n  .gw-svg:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }\n  .gw-bar { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; align-items:center; }\n  .gw-help { color:var(--muted); font-size:0.9em; margin:4px 0 8px; }\n  .gw-tag { color:var(--muted); font-size:0.9em; }\n  /* 좁은 배치(휴대폰 세로): 그림이 세로로 길어지므로 높이 제한을 완화 */\n  .gw-narrow .gw-svg { max-height:max(420px, calc(100vh - 150px)); }\n  /* 좁은 화면(휴대폰): 첫 화면에 정답확인 버튼이 들어오도록 위쪽 여백·안내문을 줄인다 */\n  @media (max-width:520px) {\n    body { padding:8px; font-size:15px; }\n    h2.gw-title { font-size:1.15em; }\n    .gw-bar { gap:6px; margin:8px 0; }\n    .gw-bar button { padding:5px 9px; }\n    .gw-help { margin:2px 0 4px; font-size:0.82em; line-height:1.4; }\n  }\n  button { font:inherit; padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); cursor:pointer; }\n  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }\n  button.seg[aria-pressed=\"true\"] { border-color:var(--accent); color:var(--accent); font-weight:700; }\n  .gw-answer { display:none; padding:12px; border:1px solid var(--ok); border-radius:8px; }\n  .gw-answer.open { display:block; }\n  .gw-value { font-size:1.6em; font-weight:700; color:var(--ok); }\n  .gw-note { color:var(--muted); font-size:0.9em; }\n  /* SVG 요소 */\n  .h-panel { fill:var(--panel); stroke:var(--line); }\n  /* 금속 부품: fill은 그라데이션 속성(fill=\"url(#height-…)\")으로 준다. 여기서는 테두리만. */\n  .h-mtl { stroke:var(--shade); stroke-width:0.8; }\n  .h-vplate { stroke:var(--accent); stroke-width:1; }\n  .h-shine { stroke:var(--shine); stroke-width:1; fill:none; }\n  .h-shade { stroke:var(--shade); stroke-width:1; fill:none; }\n  .h-knurl { stroke:var(--shade); stroke-width:0.7; }\n  .h-rod { stroke:var(--m3); stroke-width:2.2; }\n  .h-slot { stroke:var(--shade); stroke-width:1.2; }\n  .h-scr-edge { stroke:var(--accent); stroke-width:1.4; }\n  .h-lbl { fill:var(--muted); font-family:system-ui, \"Malgun Gothic\", sans-serif; }\n  .h-lbl-inv { fill:var(--inv); font-family:system-ui, \"Malgun Gothic\", sans-serif; }\n  .h-tick { stroke:var(--fg); stroke-width:1.2; }\n  .h-vtick { stroke:var(--fg); stroke-width:1.2; }\n  .h-hl { stroke:var(--ok); stroke-width:2.6; }\n  .h-thin { stroke-width:0.8; }\n  .h-hl.h-thin { stroke-width:1.4; }\n  .h-scr { stroke:var(--accent); stroke-width:1.5; }\n  .h-txt { fill:var(--fg); font-family:system-ui, \"Malgun Gothic\", sans-serif; }\n  .h-cap { fill:var(--muted); font-size:13px; font-family:system-ui, \"Malgun Gothic\", sans-serif; }\n  .h-ind { fill:var(--accent); fill-opacity:0.08; stroke:var(--accent); stroke-dasharray:4 3; }\n  .h-iface { stroke:var(--accent); stroke-width:1; stroke-opacity:0.5; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"gw-root\">\u003c/div>\n\u003cscript>\n(function () {\n  const ID = 'height';\n  const TITLE = '하이트게이지';\n\n  // ---- 상태: 1/100mm 정수 ----\n  // 부척은 1/50형(0.02mm) 고정: 본척 49mm를 50등분, 부척 한 칸 0.98mm\n  const STATE_MIN = 0, STATE_MAX = 30000;\n  const resU = 2, N = 50, pitchU = 98, LEN = 49, labelEvery = 5;\n  let state = 0;          // y: 부척 0점(스크라이버 아래 날) 높이\n  let loupeOffU = 200;    // 돋보기 창 중심 = y + loupeOffU (정답과 무관한 고정 기본값)\n  let revealed = false;\n\n  // ---- 명세 함수: 상태 → 정답 (정수 계산, 표시 단계에서만 소수) ----\n  function answer(y) {\n    const r = resU;\n    const M = Math.floor(y / 100);\n    const f = y % 100;\n    const n = f / r;\n    const readingU = M * 100 + n * r;\n    const answerU = readingU;            // 스크라이버 옵셋 미구현(0)\n    const resStr = '0.02';\n    const val = (answerU / 100).toFixed(2);\n    // 표기 전용: 본척 숫자는 cm(10mm마다 0,1,2,…,30), 계산·정답은 mm. 정수 mm에서 바로 만든다.\n    const C = Math.floor(M / 10), rem = M % 10;\n    const mainStr = '본척 ' + C + 'cm(=' + (C * 10) + 'mm)' + (rem ? ' + ' + rem + 'mm' : '');\n    const text = mainStr + ' + 부척 ' + n + '번째 선 × ' + resStr + 'mm = ' + val + 'mm';\n    const detail = n === 0\n      ? '부척 0점 바로 아래 본척 눈금은 ' + lineName(M) + ', 부척 0번째 선(0점이 본척 선과 일치)'\n      : '부척 0점 바로 아래 본척 눈금은 ' + lineName(M) + ', 부척 ' + n + '번째 선이 본척 ' + lineName(M + n) + '과 일치';\n    return { M: M, n: n, answerU: answerU, value: val, text: text, detail: detail };\n  }\n\n  // 본척 선 이름: 숫자(cm)가 적힌 선이면 'Xcm 선(=Ymm)', 아니면 'Xcm 숫자에서 k칸 위 선(=Ymm)' (1칸 = 1mm)\n  function lineName(mm) {\n    const c = Math.floor(mm / 10), k = mm % 10;\n    return k === 0 ? c + 'cm 선(=' + mm + 'mm)' : c + 'cm 숫자에서 ' + k + '칸 위 선(=' + mm + 'mm)';\n  }\n\n  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }\n  function randomState() {\n    if (Math.random() \u003c 0.2) {\n      const pick = randInt(0, 3);\n      if (pick === 0) return randInt(0, 300) * 100;                       // n = 0\n      if (pick === 1) return randInt(0, 299) * 100 + (N - 1) * resU;      // n = N-1 (x.98)\n      if (pick === 2) return 0;\n      return 30000;\n    }\n    return randInt(0, 30000 / resU) * resU;\n  }\n\n  // ---- 전체 그림 내부 좌표(실물형 하이트게이지, 가로 0~240 / 세로 0~590) ----\n  // 기둥 꼭대기를 372mm까지 그려, y = 300mm에서도 슬라이더·미세이송 블록이 기둥 위에 걸쳐 있게 한다.\n  const OV_X0 = 12, OV_X1 = 236, OV_YB = 566, OV_YT = 32, OV_MAXMM = 372;\n  const CX0 = 70, CX1 = 88;            // 기둥(본척) 좌우\n  const BX0 = 36, BX1 = 160, BH = 30;  // 베이스 좌우·높이\n  const SL = CX0 - 6, SR = CX1 + 30;   // 슬라이더 몸체 좌우\n  const kO = (OV_YB - OV_YT) / OV_MAXMM;               // px/mm (전체 그림 내부 좌표)\n\n  // ---- 화면 배치 2가지 ----\n  // 넓은 화면: 전체 | 확대 창 | 돋보기를 한 줄로 (viewBox 800×600)\n  // 좁은 화면(컨테이너 폭 \u003c 640px, 휴대폰 세로): 위쪽에 전체(축소, 보조) + 확대 창, 아래쪽에 돋보기를 가로 전체 폭으로 (viewBox 400×620)\n  const NARROW_BELOW = 640;\n  const LAYOUTS = {\n    wide: { narrow: false, vbW: 800, vbH: 600,\n      ov: { tx: 0, ty: 0, s: 1, F: 1 },\n      mag: { x: 246, w: 346, top: 26, bot: 586, ix: 420, vW: 92, mL: [14, 24, 36], vL: [18, 32], font: 14, bevel: 10, capY: 16,\n             cap: '확대 창 (본척 숫자 단위 cm, 1칸 = 1mm)' },\n      lp: { x: 602, w: 190, top: 26, bot: 586, ix: 690, mL: [26, 40, 56], vL: [30, 48], font: 15, capY: 16 },\n      help: '왼쪽 전체 그림이나 가운데 확대 창을 위아래로 끌어 슬라이더를 움직이세요(확대 창은 미세 조정). ' +\n            '오른쪽 돋보기 창을 위아래로 끌면 확대 창의 점선 상자(돋보기 구간)가 부척을 따라 움직입니다. 키보드: ↑↓, PageUp/PageDown.' },\n    narrow: { narrow: true, vbW: 400, vbH: 620,\n      ov: { tx: 0, ty: 6, s: 0.56, F: 1.75 },\n      mag: { x: 140, w: 256, top: 26, bot: 334, ix: 236, vW: 78, mL: [10, 17, 26], vL: [14, 24], font: 13, bevel: 6, capY: 16,\n             cap: '확대 창 (숫자 cm)' },\n      lp: { x: 4, w: 392, top: 366, bot: 614, ix: 200, mL: [26, 40, 56], vL: [30, 48], font: 15, capY: 356 },\n      help: '왼쪽 전체 그림이나 오른쪽 확대 창을 위아래로 끌어 슬라이더를 움직이세요. ' +\n            '아래 돋보기 창을 끌면 확대 창의 점선 상자(돋보기 구간)가 움직입니다.' }\n  };\n  let L = LAYOUTS.wide;\n  let forcedNarrow = null;   // 검증용: null이면 컨테이너 폭으로 자동 결정\n\n  // 돋보기: 기본 120px/mm(0.02mm = 2.4px), ×2 선택 시 240px/mm. 선 굵기 0.8px\n  const KL_BASE = 120;\n  let kL = KL_BASE;\n  const LOUPE_DEFAULT = 200;\n\n  function kM() { return (L.mag.bot - L.mag.top) / (LEN + 10); }\n\n  let root, svg, ans, help;\n  function mount(el) {\n    root = el;\n    el.innerHTML =\n      '\u003ch2 class=\"gw-title\" style=\"margin:0 0 4px\">' + TITLE + '\u003c/h2>' +\n      '\u003cdiv class=\"gw-bar\" style=\"margin:4px 0\">\u003cspan class=\"gw-tag\">부척 1/50 (0.02mm)\u003c/span>' +\n      '\u003cspan style=\"margin-left:4px\">돋보기:\u003c/span>' +\n      '\u003cbutton class=\"seg\" id=\"' + ID + '-z1\" aria-pressed=\"true\">×1\u003c/button>' +\n      '\u003cbutton class=\"seg\" id=\"' + ID + '-z2\" aria-pressed=\"false\">×2\u003c/button>\u003c/div>' +\n      '\u003cdiv class=\"gw-help\" id=\"' + ID + '-help\">\u003c/div>' +\n      '\u003csvg class=\"gw-svg\" id=\"' + ID + '-svg\" viewBox=\"0 0 800 600\" tabindex=\"0\" role=\"img\" aria-label=\"하이트게이지 눈금\">\u003c/svg>' +\n      '\u003cdiv class=\"gw-bar\">\u003cbutton class=\"primary\" id=\"' + ID + '-reveal\">정답확인\u003c/button>' +\n      '\u003cbutton id=\"' + ID + '-new\">새 문제\u003c/button>\u003c/div>' +\n      '\u003cdiv class=\"gw-answer\" id=\"' + ID + '-ans\" aria-live=\"polite\">\u003c/div>';\n    svg = el.querySelector('#' + ID + '-svg');\n    ans = el.querySelector('#' + ID + '-ans');\n    help = el.querySelector('#' + ID + '-help');\n    el.querySelector('#' + ID + '-reveal').onclick = reveal;\n    el.querySelector('#' + ID + '-new').onclick = newProblem;\n    const z1 = el.querySelector('#' + ID + '-z1'), z2 = el.querySelector('#' + ID + '-z2');\n    function setZoom(z) {\n      kL = KL_BASE * z;\n      z1.setAttribute('aria-pressed', z === 1);\n      z2.setAttribute('aria-pressed', z === 2);\n      draw();\n    }\n    z1.onclick = function () { setZoom(1); };\n    z2.onclick = function () { setZoom(2); };\n    bindDrag(svg);\n    applyLayout(true);\n    // 컨테이너 폭이 바뀌면(회전, 노션 임베드 크기 변경, 탭 전환) 배치를 다시 고른다\n    if (window.ResizeObserver) new ResizeObserver(function () { applyLayout(); }).observe(el);\n    else window.addEventListener('resize', function () { applyLayout(); });\n    newProblem();\n  }\n\n  function applyLayout(force) {\n    if (!root) return;\n    const w = root.clientWidth;\n    let narrow = forcedNarrow !== null ? forcedNarrow : (w > 0 ? w \u003c NARROW_BELOW : L.narrow);\n    const next = narrow ? LAYOUTS.narrow : LAYOUTS.wide;\n    if (next === L && !force) return;\n    L = next;\n    root.classList.toggle('gw-narrow', L.narrow);\n    svg.setAttribute('viewBox', '0 0 ' + L.vbW + ' ' + L.vbH);\n    help.textContent = L.help;\n    draw();\n  }\n\n  function svgPoint(e) {\n    const pt = svg.createSVGPoint();\n    pt.x = e.clientX; pt.y = e.clientY;\n    return pt.matrixTransform(svg.getScreenCTM().inverse());\n  }\n\n  // 누른 위치가 어느 창인지\n  function regionAt(p) {\n    if (L.narrow) {\n      if (p.y >= L.lp.top - 28) return 'loupe';\n      return p.x \u003c L.mag.x - 3 ? 'ov' : 'mag';\n    }\n    return p.x \u003c (OV_X1 + L.mag.x) / 2 ? 'ov' : p.x \u003c L.lp.x - 4 ? 'mag' : 'loupe';\n  }\n\n  function bindDrag(target) {\n    let drag = null;\n    target.addEventListener('pointerdown', function (e) {\n      const p = svgPoint(e);\n      const region = regionAt(p);\n      drag = { id: e.pointerId, region: region, y0: p.y, v0: region === 'loupe' ? loupeOffU : state };\n      try { target.setPointerCapture(e.pointerId); } catch (err) { /* 캡처 실패해도 드래그는 계속 */ }\n      e.preventDefault();\n    });\n    target.addEventListener('pointermove', function (e) {\n      if (!drag || e.pointerId !== drag.id) return;\n      const dy = svgPoint(e).y - drag.y0;            // SVG y는 아래로 증가\n      if (drag.region === 'loupe') {\n        // 확대 창의 점선 상자(돋보기 구간)를 끄는 것과 같은 비율: 위로 끌면 구간이 위로 이동\n        loupeOffU = clampLoupe(drag.v0 - dy / kM() * 100);\n        draw();\n      } else {\n        const k = drag.region === 'ov' ? kO * L.ov.s : kM();\n        setState(drag.v0 - dy / k * 100);             // 위로 끌면 y 증가\n      }\n    });\n    function end(e) { if (drag && e.pointerId === drag.id) drag = null; }\n    target.addEventListener('pointerup', end);\n    target.addEventListener('pointercancel', end);\n    target.addEventListener('keydown', function (e) {\n      let d = 0;\n      if (e.key === 'ArrowUp') d = resU; else if (e.key === 'ArrowDown') d = -resU;\n      else if (e.key === 'PageUp') d = 100; else if (e.key === 'PageDown') d = -100;\n      if (d) { setState(state + d); e.preventDefault(); }\n    });\n  }\n\n  function clampLoupe(u) { return Math.max(-200, Math.min(LEN * 100 + 200, u)); }\n\n  function setState(s) {\n    const ns = Math.max(STATE_MIN, Math.min(STATE_MAX, Math.round(s / resU) * resU));\n    const changed = ns !== state;\n    state = ns;\n    if (changed) closeAnswer();\n    draw();\n  }\n  function closeAnswer() { revealed = false; if (ans) ans.classList.remove('open'); }\n\n  // ---- 그리기 (state에서만) ----\n  function ln(x1, y1, x2, y2, cls) {\n    return '\u003cline x1=\"' + x1.toFixed(2) + '\" y1=\"' + y1.toFixed(2) + '\" x2=\"' + x2.toFixed(2) + '\" y2=\"' + y2.toFixed(2) + '\" class=\"' + cls + '\"/>';\n  }\n  function rc(x, y, w, h, cls, extra) {\n    return '\u003crect x=\"' + x.toFixed(2) + '\" y=\"' + y.toFixed(2) + '\" width=\"' + Math.max(0, w).toFixed(2) + '\" height=\"' + Math.max(0, h).toFixed(2) + '\" class=\"' + cls + '\"' + (extra || '') + '/>';\n  }\n  function tx(x, y, s, anchor, size, cls) {\n    return '\u003ctext x=\"' + x.toFixed(2) + '\" y=\"' + y.toFixed(2) + '\" text-anchor=\"' + anchor + '\" font-size=\"' + size + '\" class=\"' + (cls || 'h-txt') + '\">' + s + '\u003c/text>';\n  }\n\n  function gf(name) { return ' fill=\"url(#' + ID + '-' + name + ')\"'; }   // 그라데이션 채우기 속성\n  function pth(d, cls, extra) { return '\u003cpath d=\"' + d + '\" class=\"' + cls + '\"' + (extra || '') + '/>'; }\n  function f2(v) { return v.toFixed(2); }\n\n  // 그라데이션 정의(색은 CSS 변수 → 다크모드 자동 전환)\n  function gradDefs() {\n    function lg(name, dir, stops) {\n      const xy = dir === 'h' ? 'x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"' : dir === 'd' ? 'x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"' : 'x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"';\n      return '\u003clinearGradient id=\"' + ID + '-' + name + '\" ' + xy + '>' +\n        stops.map(function (st) { return '\u003cstop offset=\"' + st[0] + '\" style=\"stop-color:var(' + st[1] + ')\"/>'; }).join('') +\n        '\u003c/linearGradient>';\n    }\n    return lg('gScale', 'h', [[0, '--sc0'], [0.45, '--sc1'], [1, '--sc0']]) +            // 본척 눈금면(무광 크롬)\n      lg('gBevel', 'h', [[0, '--m0'], [0.6, '--m2'], [1, '--m1']]) +                       // 기둥 옆 모서리\n      lg('gMetal', 'h', [[0, '--m3'], [0.18, '--m1'], [0.5, '--m2'], [0.85, '--m3'], [1, '--m0']]) + // 크롬강 몸체\n      lg('gMetalV', 'v', [[0, '--m1'], [0.45, '--m2'], [1, '--m0']]) +                     // 수평 부품(조, 블록)\n      lg('gVern', 'd', [[0, '--vn0'], [1, '--vn1']]) +                                    // 부척판\n      lg('gBase', 'v', [[0, '--b1'], [0.12, '--b0'], [1, '--b2']]) +                       // 주철 베이스\n      lg('gPlate', 'v', [[0, '--p0'], [1, '--p1']]) +                                     // 정반\n      lg('gKnurl', 'v', [[0, '--m3'], [0.4, '--m1'], [1, '--m0']]);                        // 손잡이·휠\n  }\n\n  // 나사 머리(일자 홈)\n  function screw(cx, cy, r) {\n    return '\u003ccircle cx=\"' + f2(cx) + '\" cy=\"' + f2(cy) + '\" r=\"' + r + '\" class=\"h-mtl\"' + gf('gMetalV') + '/>' +\n      ln(cx - r * 0.7, cy + r * 0.25, cx + r * 0.7, cy - r * 0.25, 'h-slot');\n  }\n  // 오른쪽으로 튀어나온 클램프 나사(로렛 손잡이). xl = 몸체 오른쪽 면, cy = 중심 높이\n  function clampKnob(xl, cy) {\n    let s = rc(xl, cy - 2, 3, 4, 'h-mtl', gf('gMetalV'));\n    s += rc(xl + 3, cy - 5.5, 8, 11, 'h-mtl', gf('gKnurl') + ' rx=\"1.5\"');\n    for (let k = -3; k \u003c= 3; k += 2) s += ln(xl + 4, cy + k, xl + 10, cy + k, 'h-knurl');\n    return s;\n  }\n\n  // 본척+부척 눈금 (확대 창/돋보기 창 공용). toY: 1/100mm → SVG y\n  function scales(o) {\n    const y = state, toY = o.toY, a = revealed ? answer(state) : null;\n    const th = o.thin ? ' h-thin' : '';\n    let s = '';\n    // 정반(0mm 아래)\n    const y0 = toY(0);\n    if (y0 \u003c o.bot) {\n      s += rc(o.left, y0, o.right - o.left, o.bot - y0, 'h-mtl', gf('gPlate'));\n      s += ln(o.left, y0 + 0.5, o.right, y0 + 0.5, 'h-shine');\n    }\n    const yFloor = Math.min(y0, o.bot);   // 정반 윗면(그 아래로는 부품을 그리지 않음)\n    // 본척 기둥(눈금면 + 옆 모서리)\n    const colTop = Math.max(o.top, toY((300 + LEN + 5) * 100));\n    s += rc(o.left + 6, colTop, o.ix - o.left - 6, yFloor - colTop, 'h-mtl', gf('gScale'));\n    if (o.bevel) {\n      s += rc(o.left + 6, colTop, o.bevel, yFloor - colTop, 'h-mtl', gf('gBevel'));\n      s += ln(o.left + 6 + o.bevel + 0.5, colTop, o.left + 6 + o.bevel + 0.5, yFloor, 'h-shine');\n    }\n    // 본척 눈금\n    const mLo = Math.max(0, Math.ceil(o.loU / 100)), mHi = Math.min(300 + LEN, Math.floor(o.hiU / 100));\n    for (let m = mLo; m \u003c= mHi; m++) {\n      const sy = toY(m * 100);\n      const len = m % 10 === 0 ? o.mL[2] : m % 5 === 0 ? o.mL[1] : o.mL[0];\n      const hl = a && m === a.M + a.n;\n      s += ln(o.ix - len, sy, o.ix, sy, (hl ? 'h-hl' : 'h-tick') + th);\n      if (m % 10 === 0) s += tx(o.ix - o.mL[2] - 4, sy + o.font * 0.35, String(m / 10), 'end', o.font);   // 본척 숫자: cm\n      else if (o.allLabels) s += tx(o.ix - o.mL[2] - 4, sy + o.font * 0.3, (m / 10).toFixed(1), 'end', o.font - 3, 'h-cap');   // 돋보기 보조 숫자(cm)\n    }\n    // 슬라이더 몸체(부척판을 둘러싼 크롬 틀 + 고정 나사) — 확대 창에서만\n    if (o.body) {\n      const bt = toY(y + LEN * 100 + 380), bb = Math.min(toY(y - 380), yFloor);\n      if (bb > bt) {\n        s += rc(o.ix, bt, o.right - o.ix, bb - bt, 'h-mtl', gf('gMetal'));\n        s += ln(o.ix, bt + 0.5, o.right, bt + 0.5, 'h-shine');\n        const rx = o.ix + o.vW + (o.right - o.ix - o.vW) / 2;\n        const sTop = toY(y + LEN * 100 + 150) + 34, sBot = toY(y - 150) - 34;\n        if (sTop > bt + 6 && sTop \u003c bb - 6) s += screw(rx, sTop, 6);\n        if (sBot > bt + 6 && sBot \u003c bb - 6) s += screw(rx, sBot, 6);\n        // 부척판 옆 그림자 홈\n        s += ln(o.ix + o.vW + 1.5, Math.max(bt, toY(y + LEN * 100 + 150)), o.ix + o.vW + 1.5, Math.min(bb, toY(y - 150)), 'h-shade');\n      }\n    }\n    // 부척판\n    const vt = toY(y + LEN * 100 + 150), vb = Math.min(toY(y - 150), yFloor);\n    if (vb > vt) s += rc(o.ix, vt, o.vW, vb - vt, 'h-vplate', gf('gVern'));\n    // 부척 눈금\n    for (let i = 0; i \u003c= N; i++) {\n      const u = y + i * pitchU;\n      if (u \u003c o.loU - 50 || u > o.hiU + 50) continue;\n      const sy = toY(u);\n      const big = i % labelEvery === 0;\n      const hl = a && i === a.n;\n      s += ln(o.ix, sy, o.ix + (big ? o.vL[1] : o.vL[0]), sy, (hl ? 'h-hl' : 'h-vtick') + th);\n      if (big) s += tx(o.ix + o.vL[1] + 4, sy + o.font * 0.35, String(i / labelEvery), 'start', o.font);\n      else if (o.allLabels) s += tx(o.ix + o.vL[1] + 4, sy + o.font * 0.3, '(' + i + ')', 'start', o.font - 4, 'h-cap');\n    }\n    // 경계선\n    s += ln(o.ix, o.top, o.ix, o.bot, 'h-iface');\n    return s;\n  }\n\n  // 전체 그림: 실물형 버니어 하이트게이지(정반·베이스·기둥·슬라이더·스크라이버·미세이송)\n  // F: 글자 배율(좁은 화면에서는 전체 그림을 축소해 그리므로 글자를 키운다), full: 보조 이름표까지 모두 표시\n  function overview(y, F, full) {\n    const ovY = function (u) { return OV_YB - u / 100 * kO; };\n    let s = full ? tx(OV_X0, 16, '전체 (본척 숫자 0~30cm)', 'start', 13, 'h-cap') : '';\n    // 정반\n    s += rc(OV_X0, OV_YB, OV_X1 - OV_X0, 18, 'h-mtl', gf('gPlate'));\n    s += ln(OV_X0, OV_YB + 0.5, OV_X1, OV_YB + 0.5, 'h-shine');\n    s += tx(OV_X1 - 5, OV_YB + 9 + 4 * F, '정반', 'end', 10 * F, 'h-lbl-inv');\n    // 기둥(본척) + 꼭대기 캡\n    const cTop = ovY(OV_MAXMM * 100);\n    s += rc(CX0, cTop, CX1 - CX0, OV_YB - BH + 2 - cTop, 'h-mtl', gf('gScale'));   // 아랫부분은 베이스에 박혀 있음\n    s += rc(CX0, cTop, 3, OV_YB - BH + 2 - cTop, '', gf('gBevel'));\n    s += rc(CX0 - 2, cTop - 5, CX1 - CX0 + 4, 6, 'h-mtl', gf('gMetalV') + ' rx=\"1.5\"');\n    for (let m = 10; m \u003c= 360; m += 10) {\n      const sy = ovY(m * 100), big = m % 50 === 0;\n      s += ln(CX1 - (big ? 9 : 5), sy, CX1, sy, 'h-tick h-thin');\n      if (big && m \u003c= 300) s += tx(CX0 - 8, sy + 4 * F, String(m / 10), 'end', 11 * F);   // cm\n    }\n    s += tx(BX0 - 4, OV_YB - 2, '0', 'end', 11 * F);\n    s += tx(OV_X0 + 2, ovY(360 * 100) + 4 * F, '본척', 'start', 11 * F, 'h-lbl');\n    if (full) {\n      s += tx(OV_X0 + 2, ovY(360 * 100) + 17, '(기둥)', 'start', 10, 'h-lbl');\n      s += tx(OV_X0 + 2, ovY(360 * 100) + 30, '단위 cm', 'start', 10, 'h-lbl');\n    }\n    // 베이스(무거운 주철 받침): 모따기 윤곽 + 윗면 광택 + 기둥 고정 보스\n    const BT = OV_YB - BH;\n    s += rc(CX0 - 5, BT - 5, CX1 - CX0 + 10, 6, 'h-mtl', gf('gMetalV'));\n    s += pth('M' + BX0 + ' ' + OV_YB + ' V' + (BT + 6) + ' L' + (BX0 + 6) + ' ' + BT + ' H' + (BX1 - 6) +\n             ' L' + BX1 + ' ' + (BT + 6) + ' V' + OV_YB + ' Z', 'h-mtl', gf('gBase'));\n    s += ln(BX0 + 6, BT + 0.8, BX1 - 6, BT + 0.8, 'h-shine');\n    s += rc(BX0 + 10, BT + 10, BX1 - BX0 - 20, 13, 'h-shade', ' rx=\"2\"');\n    if (full) s += tx(OV_X0 + 2, BT - 5, '베이스', 'start', 10, 'h-lbl');\n\n    // ---- 움직이는 부분: 미세이송 블록 + 휠, 슬라이더(부척 창), 클램프, 스크라이버 조 ----\n    const sb = ovY(y);\n    const bTop = ovY(y + (LEN + 4) * 100), bBot = Math.min(sb + 3, OV_YB);\n    const ffBot = ovY(y + (LEN + 10) * 100), ffTop = ovY(y + (LEN + 18) * 100);\n    // 미세이송 블록(기둥을 감싸는 클램프 블록)\n    s += rc(SL, ffTop, CX1 + 22 - SL, ffBot - ffTop, 'h-mtl', gf('gMetal') + ' rx=\"2\"');\n    s += ln(SL + 2, ffTop + 0.6, CX1 + 20, ffTop + 0.6, 'h-shine');\n    s += clampKnob(CX1 + 22, (ffTop + ffBot) / 2);\n    // 미세이송 나사봉 + 휠(로렛 너트)\n    const rodX = CX1 + 16;\n    s += ln(rodX, ffBot, rodX, bTop, 'h-rod');\n    const wy = (ffBot + bTop) / 2;\n    s += rc(rodX - 11, wy - 4, 22, 8, 'h-mtl', gf('gKnurl') + ' rx=\"2\"');\n    for (let k = -8; k \u003c= 8; k += 2.6) s += ln(rodX + k, wy - 3.4, rodX + k, wy + 3.4, 'h-knurl');\n    if (full) s += tx(rodX + 14, wy + 3.5, '미세이송 휠', 'start', 10, 'h-lbl');\n    // 슬라이더 몸체 + 부척 창(창 안에는 뒤쪽 기둥의 본척 눈금면이 보임)\n    const wTop = ovY(y + (LEN + 2) * 100), wBot = Math.min(sb + 1.5, bBot - 1);\n    s += rc(SL, bTop, SR - SL, bBot - bTop, 'h-mtl', gf('gMetal') + ' rx=\"2\"');\n    s += rc(CX0 + 2, wTop, CX1 - CX0 - 2, wBot - wTop, 'h-mtl', gf('gScale'));\n    for (let m = Math.ceil((y + 1) / 1000) * 10 - 10; m * 100 \u003c= y + (LEN + 2) * 100; m += 10) {\n      const wy2 = ovY(m * 100);\n      if (wy2 > wTop + 0.5 && wy2 \u003c wBot - 0.5) s += ln(CX1 - (m % 50 === 0 ? 9 : 5), wy2, CX1, wy2, 'h-tick h-thin');\n    }\n    s += ln(SL + 1, bTop + 0.6, SR - 1, bTop + 0.6, 'h-shine');\n    // 부척판 + 눈금(labelEvery 칸마다)\n    s += rc(CX1, wTop, 14, wBot - wTop, 'h-vplate', gf('gVern') + ' style=\"stroke-width:0.6\"');\n    for (let i = 0; i \u003c= N; i += labelEvery) {\n      const vy = ovY(y + i * pitchU);\n      s += ln(CX1, vy, CX1 + (i === 0 || i === N ? 8 : 5), vy, 'h-vtick h-thin');\n    }\n    s += screw(SR - 7, bTop + 6, 2.4);\n    s += screw(SR - 7, wBot - 4, 2.4);\n    // 슬라이더 클램프 나사\n    s += clampKnob(SR, bTop + 10);\n    if (full) s += tx(SR + 15, bTop + 13, '클램프', 'start', 10, 'h-lbl');\n    // 스크라이버 조(홀더) + 스크라이버: 아래 날(파란 선) = 부척 0점 높이\n    s += rc(SR - 6, sb - 15, 48, 10, 'h-mtl', gf('gMetalV') + ' rx=\"1.5\"');\n    s += screw(SR + 32, sb - 10, 2.8);\n    s += pth('M' + (SR - 6) + ' ' + f2(sb - 5) + ' H' + (OV_X1 - 30) + ' L' + (OV_X1 - 8) + ' ' + f2(sb) +\n             ' H' + (SR - 6) + ' Z', 'h-mtl', gf('gMetalV'));\n    s += ln(SR - 6, sb, OV_X1 - 8, sb, 'h-scr-edge');\n    s += tx(OV_X1 - 8, full ? sb - 8 : sb - 18, '스크라이버', 'end', 10 * F, 'h-lbl');\n    // 확대 창이 보여주는 구간\n    const loU = y - 500, hiU = y + (LEN + 5) * 100;\n    s += rc(CX0 - 12, ovY(hiU), SR - CX0 + 16, ovY(loU) - ovY(hiU), 'h-ind');\n    return s;\n  }\n\n  function draw() {\n    if (!svg) return;\n    const y = state, km = kM(), M_ = L.mag, P = L.lp;\n    let s = '\u003cdefs>' + gradDefs() +\n      '\u003cclipPath id=\"' + ID + '-clipM\">\u003crect x=\"' + M_.x + '\" y=\"' + M_.top + '\" width=\"' + M_.w + '\" height=\"' + (M_.bot - M_.top) + '\"/>\u003c/clipPath>' +\n      '\u003cclipPath id=\"' + ID + '-clipL\">\u003crect x=\"' + P.x + '\" y=\"' + P.top + '\" width=\"' + P.w + '\" height=\"' + (P.bot - P.top) + '\"/>\u003c/clipPath>' +\n      '\u003c/defs>';\n\n    // ---------- 전체 그림 (좁은 화면에서는 축소한 보조 그림) ----------\n    if (L.narrow) {\n      s += tx(4, 16, '전체', 'start', 13, 'h-cap');\n      s += '\u003cg transform=\"translate(' + L.ov.tx + ' ' + L.ov.ty + ') scale(' + L.ov.s + ')\">' + overview(y, L.ov.F, false) + '\u003c/g>';\n    } else {\n      s += overview(y, 1, true);\n    }\n\n    // ---------- 확대 창 ----------\n    const mLoU = y - 500, mHiU = y + (LEN + 5) * 100;\n    const toYM = function (u) { return M_.bot - (u - mLoU) / 100 * km; };\n    s += tx(M_.x, M_.capY, M_.cap, 'start', 13, 'h-cap');\n    s += rc(M_.x, M_.top, M_.w, M_.bot - M_.top, 'h-panel');\n    s += '\u003cg clip-path=\"url(#' + ID + '-clipM)\">';\n    s += scales({ toY: toYM, loU: mLoU, hiU: mHiU, top: M_.top, bot: M_.bot, left: M_.x, right: M_.x + M_.w, ix: M_.ix,\n                  mL: M_.mL, vL: M_.vL, vW: M_.vW, font: M_.font, bevel: M_.bevel, body: true });\n    // 돋보기 구간 표시\n    const half = (P.bot - P.top) / 2 / kL * 100, lc = y + loupeOffU;\n    const it = toYM(lc + half), ib = toYM(lc - half);\n    s += rc(M_.x + 4, it, M_.w - 8, ib - it, 'h-ind');\n    s += '\u003c/g>';\n    s += rc(M_.x, M_.top, M_.w, M_.bot - M_.top, 'h-panel', ' style=\"fill:none\"');\n\n    // ---------- 돋보기 창 ----------\n    const midY = (P.top + P.bot) / 2;\n    const toYL = function (u) { return midY - (u - lc) / 100 * kL; };\n    s += tx(P.x, P.capY, '돋보기 ×' + (kL / KL_BASE) + ' · cm (끌어서 이동)', 'start', 13, 'h-cap');\n    s += rc(P.x, P.top, P.w, P.bot - P.top, 'h-panel');\n    s += '\u003cg clip-path=\"url(#' + ID + '-clipL)\">';\n    s += scales({ toY: toYL, loU: lc - half - 100, hiU: lc + half + 100, top: P.top, bot: P.bot, left: P.x, right: P.x + P.w, ix: P.ix,\n                  mL: P.mL, vL: P.vL, vW: P.x + P.w - P.ix, font: P.font, thin: true, allLabels: true });\n    s += '\u003c/g>';\n    s += rc(P.x, P.top, P.w, P.bot - P.top, 'h-panel', ' style=\"fill:none\"');\n\n    svg.innerHTML = s;\n  }\n\n  function reveal() {\n    if (revealed) { closeAnswer(); draw(); return; }\n    const a = answer(state);\n    ans.innerHTML = '\u003cdiv class=\"gw-value\">' + a.value + ' mm\u003c/div>' +\n      '\u003cdiv>' + a.text + '\u003c/div>' +\n      '\u003cdiv class=\"gw-note\">' + a.detail + ' (그림에 초록색으로 표시)\u003c/div>' +\n      '\u003cdiv class=\"gw-note\">※ 하이트게이지는 숫자가 위로 커지므로 부척 0점 바로 \u003cb>아래\u003c/b> 본척 눈금을 읽습니다. 위쪽 눈금을 읽으면 1mm 크게 나옵니다.\u003c/div>' +\n      '\u003cdiv class=\"gw-note\">※ 본척 숫자는 cm 단위(1 = 10mm)이고, 작은 눈금 1칸은 1mm입니다. 정답은 mm로 씁니다.\u003c/div>';\n    revealed = true;\n    ans.classList.add('open');\n    // 패널이 화면 밖에 열리면 보이도록 스크롤\n    try {\n      const r = ans.getBoundingClientRect();\n      const vh = window.innerHeight || document.documentElement.clientHeight;\n      if (r.top \u003c 0 || r.bottom > vh) ans.scrollIntoView({ block: 'nearest', behavior: 'smooth' });\n    } catch (e) { /* 스크롤 실패는 무시 */ }\n    draw();\n  }\n\n  function newProblem() {\n    loupeOffU = LOUPE_DEFAULT;\n    closeAnswer();\n    state = randomState();\n    draw();\n  }\n\n  window.GaugeWidget = { id: ID, title: TITLE, mount: mount, newProblem: newProblem, reveal: reveal,\n                         _answer: answer, _randomState: randomState,\n                         _setState: setState, _getState: function () { return state; },\n                         _layout: function () { return L; },\n                         _forceLayout: function (n) { forcedNarrow = n; applyLayout(true); } };\n  document.addEventListener('DOMContentLoaded', function () {\n    const el = document.getElementById('gw-root');\n    if (el) mount(el);\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"};
  var TABS = [{"id":"vernier","label":"버니어캘리퍼스"},{"id":"outside-mic","label":"외측마이크로미터"},{"id":"inside-mic","label":"내측마이크로미터"},{"id":"dial","label":"다이얼게이지"},{"id":"height","label":"하이트게이지"}];
  var nav = document.getElementById('tabs'), panes = document.getElementById('panes');
  var frames = {}, buttons = {};

  function show(id) {
    TABS.forEach(function (t) {
      var on = t.id === id;
      buttons[t.id].setAttribute('aria-selected', on ? 'true' : 'false');
      if (frames[t.id]) frames[t.id].classList.toggle('on', on);
    });
    if (!frames[id]) {  // 처음 열 때만 불러온다
      var f = document.createElement('iframe');
      f.title = id;
      f.srcdoc = WIDGETS[id];
      f.className = 'on';
      panes.appendChild(f);
      frames[id] = f;
    }
    try { location.hash = id; } catch (e) {}
  }

  TABS.forEach(function (t) {
    var b = document.createElement('button');
    b.setAttribute('role', 'tab');
    b.textContent = t.label;
    b.onclick = function () { show(t.id); };
    nav.appendChild(b);
    buttons[t.id] = b;
  });
  var start = (location.hash || '').slice(1);
  show(WIDGETS[start] ? start : TABS[0].id);
})();
