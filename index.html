<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>정밀측정 눈금읽기 연습</title>
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#0969da; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#4493f8; } }
  html, body { height:100%; height:100dvh; margin:0; }
  body { display:flex; flex-direction:column; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, "Malgun Gothic", sans-serif; }
  nav { display:flex; flex-wrap:wrap; gap:4px; padding:8px 12px 0; border-bottom:1px solid var(--line); flex:none; }
  nav button { font:inherit; padding:6px 10px; border:1px solid transparent; border-bottom:none; border-radius:8px 8px 0 0; background:transparent; color:var(--muted); cursor:pointer; white-space:nowrap; }
  nav button[aria-selected="true"] { color:var(--fg); border-color:var(--line); background:var(--bg); font-weight:600; box-shadow:0 2px 0 var(--bg); position:relative; top:1px; }
  main { flex:1; min-height:0; }
  iframe { width:100%; height:100%; border:0; display:none; }
  iframe.on { display:block; }
</style>
</head>

<script>
(function () {
  var WIDGETS = {"vernier":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>버니어캘리퍼스 눈금읽기\u003c/title>\n\u003cstyle>\n  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#0969da; --ok:#1a7f37;\n          --tick:#111; --hl:#d1242f; --win:#0969da; --edge:#5f6a75;\n          --m1:#fbfcfd; --m2:#dfe4e9; --m3:#c4ccd4; --m4:#8f9aa5;\n          --s1:#eef1f4; --s2:#cbd2d9; --s3:#adb7c1; --s4:#7b8792;\n          --p1:#f7f9fb; --p2:#e3e8ed; --p3:#cfd6dd;\n          --k1:#6b7580; --k2:#3e464f; --k3:#262c33; }\n  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#4493f8; --ok:#3fb950;\n          --tick:#f0f3f6; --hl:#ff7b72; --win:#4493f8; --edge:#151a20;\n          --m1:#6a7581; --m2:#4b5560; --m3:#3c4550; --m4:#262d35;\n          --s1:#76818d; --s2:#56616c; --s3:#46505a; --s4:#2c333b;\n          --p1:#5d6874; --p2:#4a545f; --p3:#3b444e;\n          --k1:#4b5560; --k2:#2a3139; --k3:#14181d; } }\n  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, \"Malgun Gothic\", sans-serif; }\n  .gw-wrap { max-width:1000px; margin:0 auto; }\n  .gw-wrap h2 { margin:0 0 4px; font-size:1.3em; }\n  .gw-hint { color:var(--muted); font-size:.9em; margin:0 0 8px; }\n  .gw-svg { width:100%; height:auto; touch-action:none; user-select:none; -webkit-user-select:none; display:block; }\n  .gw-svg:focus { outline:2px solid var(--accent); outline-offset:2px; }\n  .gw-zoombox { border:1px solid var(--line); border-radius:8px; padding:8px; margin-top:8px; }\n  .gw-zoomhead { display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:.9em; color:var(--muted); margin-bottom:6px; }\n  .gw-bar { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; align-items:center; }\n  .gw-seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }\n  .gw-seg button { border:0; border-radius:0; padding:6px 12px; }\n  .gw-seg button + button { border-left:1px solid var(--line); }\n  .gw-seg button.on { background:var(--accent); color:#fff; }\n  button { font:inherit; padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); cursor:pointer; }\n  button:disabled { opacity:.35; cursor:not-allowed; }\n  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }\n  .gw-answer { display:none; padding:12px; border:1px solid var(--ok); border-radius:8px; }\n  .gw-answer.open { display:block; }\n  .gw-value { font-size:1.6em; font-weight:700; color:var(--ok); }\n  .gw-sub { color:var(--muted); }\n  .gw-pan { display:none; align-items:center; gap:6px; }\n  .gw-pan.show { display:inline-flex; }\n  .gw-pan input { width:160px; }\n  .gw-grab { cursor:grab; }\n  .gw-grab:active { cursor:grabbing; }\n  .gw-zsvg { cursor:ew-resize; }\n  .gw-tick { stroke:var(--tick); }\n  .gw-num { fill:var(--tick); font-family:system-ui, \"Malgun Gothic\", sans-serif; text-anchor:middle; }\n  .gw-hlt { stroke:var(--hl); }\n  .gw-hln { fill:var(--hl); }\n  .gw-winr { fill:none; stroke:var(--win); stroke-width:1.5; stroke-dasharray:5 3; }\n  .gw-edge { stroke:var(--edge); stroke-width:1; stroke-linejoin:round; }\n  .gw-knurl { stroke:var(--k3); stroke-width:1; opacity:.55; }\n  .gw-lbl { fill:var(--muted); font-family:system-ui, \"Malgun Gothic\", sans-serif; }\n  .gw-stage { display:flex; flex-direction:column; }\n  /* 좁은 화면(JS가 .gw-narrow 부여): 확대 창 → 버튼 → 정답 → 슬라이더 주변 그림 순서 */\n  .gw-narrow .gw-zoombox { order:1; margin-top:0; padding:6px; }\n  .gw-narrow .gw-ctl { order:2; display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }\n  .gw-narrow .gw-ctl button { padding:10px 6px; white-space:nowrap; }\n  .gw-narrow .gw-answer { order:3; margin-bottom:10px; }\n  .gw-narrow .gw-main { order:4; }\n  .gw-narrow .gw-hint { font-size:.82em; }\n  .gw-narrow .gw-seg button { padding:6px 9px; }\n  .gw-narrow .gw-zoomhead { gap:6px; }\n  .gw-narrow .gw-pan { flex:1 1 100%; }\n  .gw-narrow .gw-pan input { flex:1; width:auto; min-width:0; }\n  .gw-narrow .gw-value { font-size:1.4em; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"gw-root\">\u003c/div>\n\u003cscript>\n(function () {\n  'use strict';\n  const ID = 'vernier';\n  const TITLE = '버니어캘리퍼스';\n  const NS = 'vernier-';\n\n  // ---- 화면/기구 상수 (정수 단위 1/100 mm) ----\n  const MAIN_MAX_MM = 150;      // 본척 눈금은 0~150mm만 그림 (15cm)\n  const BEAM_END = 15500;       // 본척 몸체 끝(눈금 없음) = 155mm\n  const TAIL = 400;             // 부척 0번 선 ~ 슬라이더 오른쪽 끝 = SPAN + 4mm\n  const PLATE = 200;            // 부척 마지막 선 ~ 부척판 끝 = 2mm\n  const MARGIN = 200;           // 슬라이더 끝 ~ 150mm 선 여유 2mm (숫자 15가 가려지지 않게)\n\n  // ---- 옵션 (명세 1절). MAX = 150mm − SPAN − TAIL − MARGIN : 슬라이더가 148mm를 넘지 않도록 ----\n  const OPTS = {\n    '20': { key: '20', label: '1/20 (0.05mm)', STEP: 5, DIV: 20, SPAN: 1900, RES: '0.05', NUM_EVERY: 2, MAX: 12500 },\n    '50': { key: '50', label: '1/50 (0.02mm)', STEP: 2, DIV: 50, SPAN: 4900, RES: '0.02', NUM_EVERY: 5, MAX: 9500 }\n  };\n  let opt = OPTS['20'];                  // 기본: 1/20형\n  const STATE_MIN = 0;\n\n  // ---- 상태: x (슬라이드 위치, 1/100 mm 정수, x % STEP == 0, 0 ≤ x ≤ opt.MAX) ----\n  let state = 0, last = -1, revealed = false;\n\n  // ---- 명세 함수 ----\n  function pitch() { return opt.SPAN / opt.DIV; }        // 95 또는 98 (정수)\n  function fmt(u) { return Math.floor(u / 100) + '.' + String(u % 100).padStart(2, '0'); }\n  function gwa(k) { return [0, 1, 3, 6, 7, 8].indexOf(k % 10) >= 0 ? '과' : '와'; }   // 받침 유무에 따른 조사\n  function answer(s, o) {\n    o = o || opt;\n    const M = Math.floor(s / 100);\n    const r = s % 100;\n    const n = Math.round(r / o.STEP);\n    const value = M * 100 + n * o.STEP;\n    let sub;\n    if (o.NUM_EVERY === 2) {\n      sub = (n % 2 === 0) ? '(부척 숫자 ' + (n / 2) + ' 위치)'\n                          : '(부척 숫자 ' + ((n - 1) / 2) + gwa((n - 1) / 2) + ' ' + ((n + 1) / 2) + ' 사이)';\n    } else {\n      sub = (n % 5 === 0) ? '(부척 숫자 ' + (n / 5) + ' 위치)'\n                          : '(부척 숫자 ' + Math.floor(n / 5) + '에서 ' + (n % 5) + '칸 오른쪽)';\n    }\n    return { M: M, n: n, value: value, valueText: fmt(value) + ' mm',\n             text: '본척 ' + M + 'mm + 부척 ' + n + '번째 선 × ' + o.RES + 'mm = ' + fmt(value) + 'mm', sub: sub };\n  }\n  function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }\n  function randomState() {\n    const MX = opt.MAX / 100;            // 125 또는 95 (mm)\n    let s;\n    do {\n      const r = Math.random();\n      if (r \u003c 0.70) s = randInt(0, opt.MAX / opt.STEP) * opt.STEP;               // 균등\n      else if (r \u003c 0.85) s = randInt(0, MX) * 100;                                // n = 0\n      else s = randInt(0, MX - 1) * 100 + (opt.DIV - 1) * opt.STEP;               // n = 최대\n    } while (s === last);\n    last = s;\n    return s;\n  }\n\n  // ---- 화면 좌표 (전체 보기): 5.6 px/mm → 1/100mm 당 0.056 ----\n  const X0 = 72, PXU = 0.056;\n  function sx(u) { return X0 + u * PXU; }\n  const BEAM_L = X0 - 60;                // 본척 몸체 왼쪽 끝(고정 조 뒤)\n  const BEAM_R = sx(BEAM_END);           // 본척 몸체 오른쪽 끝\n  const Y_BT = 80, Y_SC = 160;           // 본척 윗면, 본척 눈금 기준선(=부척 윗변)\n\n  // 확대 창: 폭 ZW viewBox(데스크톱 1000, 좁은 화면 500 → 같은 폭에서 2배 높이), 창 폭 W(1/100mm)\n  let mag = 1, pan = 0, winLeft = 0;\n  // 좁은 화면(폭 \u003c 640px) 모드: 확대 창을 맨 위·크게, 전체 그림은 슬라이더 주변(VW 폭)만 보여 줌\n  const NARROW_PX = 640;\n  let narrow = false, ZW = 1000, VW = 1000, mvx = 0;\n  function winW() { return (opt.SPAN + 1000) / mag; }\n  function zk() { return ZW / winW(); }\n  function zx(u) { return (u - winLeft) * zk(); }\n  function trackInterval() {\n    const W = winW();\n    if (mag === 1) return [state - 200, state + opt.SPAN + 200];\n    const f = state + pan * pitch();\n    return [f - 0.3 * W, f + 0.3 * W];\n  }\n  function followWindow() {\n    const t = trackInterval(), W = winW();\n    if (t[0] \u003c winLeft) winLeft = t[0];\n    if (t[1] > winLeft + W) winLeft = t[1] - W;\n  }\n  function recenter() {\n    const t = trackInterval();\n    winLeft = (t[0] + t[1]) / 2 - winW() / 2;\n  }\n\n  let root, svg, zsvg, gDyn, gZoom, ans, panBox, panInput, panLbl, btnMinus, btnPlus, hintEl;\n  function mount(el) {\n    root = el;\n    el.innerHTML =\n      '\u003cdiv class=\"gw-wrap\">' +\n      '\u003ch2>' + TITLE + ' 눈금읽기\u003c/h2>' +\n      '\u003cp class=\"gw-hint\" id=\"' + NS + 'hint\">\u003c/p>' +\n      '\u003cdiv class=\"gw-bar\">\u003cspan>부척\u003c/span>\u003cdiv class=\"gw-seg\" id=\"' + NS + 'opt\">' +\n        '\u003cbutton data-o=\"20\">' + OPTS['20'].label + '\u003c/button>\u003cbutton data-o=\"50\">' + OPTS['50'].label + '\u003c/button>\u003c/div>\u003c/div>' +\n      '\u003cdiv class=\"gw-stage\">' +\n      '\u003csvg class=\"gw-svg gw-main\" id=\"' + NS + 'svg\" viewBox=\"0 0 1000 340\" tabindex=\"0\" role=\"img\" aria-label=\"버니어캘리퍼스 전체 모습. 화살표 키로 슬라이더 미세 이동\">\u003c/svg>' +\n      '\u003cdiv class=\"gw-zoombox\">' +\n        '\u003cdiv class=\"gw-zoomhead\">\u003cspan id=\"' + NS + 'ztitle\">\u003c/span>' +\n          '\u003cdiv class=\"gw-seg\" id=\"' + NS + 'mag\">\u003cbutton data-m=\"1\">×1\u003c/button>\u003cbutton data-m=\"2\">×2\u003c/button>\u003cbutton data-m=\"4\">×4\u003c/button>\u003cbutton data-m=\"8\">×8\u003c/button>\u003cbutton data-m=\"16\">×16\u003c/button>\u003c/div>' +\n          '\u003clabel class=\"gw-pan\" id=\"' + NS + 'panbox\">보는 위치 \u003cinput type=\"range\" id=\"' + NS + 'pan\" min=\"0\" step=\"1\"> \u003cspan id=\"' + NS + 'panlbl\">\u003c/span>\u003c/label>' +\n        '\u003c/div>' +\n        '\u003csvg class=\"gw-svg gw-zsvg\" id=\"' + NS + 'zsvg\" viewBox=\"0 0 1000 200\">\u003c/svg>' +\n      '\u003c/div>' +\n      '\u003cdiv class=\"gw-bar gw-ctl\">' +\n        '\u003cbutton id=\"' + NS + 'minus\">◀ −\u003c/button>\u003cbutton id=\"' + NS + 'plus\">+ ▶\u003c/button>' +\n        '\u003cbutton class=\"primary\" id=\"' + NS + 'reveal\">정답확인\u003c/button>' +\n        '\u003cbutton id=\"' + NS + 'new\">새 문제\u003c/button>\u003c/div>' +\n      '\u003cdiv class=\"gw-answer\" id=\"' + NS + 'ans\">\u003c/div>' +\n      '\u003c/div>\u003c/div>';\n    svg = el.querySelector('#' + NS + 'svg');\n    zsvg = el.querySelector('#' + NS + 'zsvg');\n    ans = el.querySelector('#' + NS + 'ans');\n    hintEl = el.querySelector('#' + NS + 'hint');\n    panBox = el.querySelector('#' + NS + 'panbox');\n    panInput = el.querySelector('#' + NS + 'pan');\n    panLbl = el.querySelector('#' + NS + 'panlbl');\n    btnMinus = el.querySelector('#' + NS + 'minus');\n    btnPlus = el.querySelector('#' + NS + 'plus');\n    el.querySelector('#' + NS + 'reveal').onclick = reveal;\n    el.querySelector('#' + NS + 'new').onclick = newProblem;\n    btnMinus.onclick = function () { setState(state - opt.STEP); };\n    btnPlus.onclick = function () { setState(state + opt.STEP); };\n    el.querySelectorAll('#' + NS + 'opt button').forEach(function (b) {\n      b.onclick = function () { setOption(b.getAttribute('data-o')); };\n    });\n    el.querySelectorAll('#' + NS + 'mag button').forEach(function (b) {\n      b.onclick = function () { setMag(parseInt(b.getAttribute('data-m'), 10)); };\n    });\n    panInput.oninput = function () { pan = parseInt(panInput.value, 10); recenter(); updatePanLabel(); draw(); };\n    svg.addEventListener('keydown', function (e) {\n      let d = 0;\n      if (e.key === 'ArrowLeft') d = -1; else if (e.key === 'ArrowRight') d = 1; else return;\n      e.preventDefault();\n      setState(state + d * (e.shiftKey ? 100 : opt.STEP));\n    });\n    buildStatic();\n    bindDrag();\n    layout(true);\n    setOption('20', true);\n    // 폭이 바뀌면(회전, 탭 전환으로 처음 보이게 될 때 등) 배치를 다시 정한다\n    if (window.ResizeObserver) new ResizeObserver(function () { layout(false); }).observe(el);\n    else window.addEventListener('resize', function () { layout(false); });\n  }\n\n  // ---- 화면 폭에 따른 배치 ----\n  function defaultMag(k) {\n    if (narrow) return k === '50' ? 16 : 4;                 // 좁은 화면: 확대 창이 주 화면\n    return k === '50' ? Math.max(mag, 8) : Math.min(mag, 4); // 데스크톱: 1/50형 ×8 이상, 1/20형 최대 ×4\n  }\n  function layout(initial) {\n    const w = root.getBoundingClientRect().width;\n    if (!w) return;                                         // 숨겨진 탭 안: 보일 때 다시 호출됨\n    const n = w \u003c NARROW_PX;\n    if (!initial && n === narrow) return;\n    narrow = n;\n    ZW = n ? 500 : 1000;\n    VW = n ? 440 : 1000;\n    root.querySelector('.gw-wrap').classList.toggle('gw-narrow', n);\n    zsvg.setAttribute('viewBox', '0 0 ' + ZW + ' 200');\n    root.querySelector('#' + NS + 'ztitle').textContent = n\n      ? '확대 창 — 끌면 슬라이더가 움직입니다'\n      : '확대 창 (점선 영역) — 여기서 끌어도 슬라이더가 움직입니다';\n    if (initial) return;                                    // 첫 배치는 setOption이 이어서 그림\n    setMag(defaultMag(opt.key), true);\n    recenter();\n    mainFollow(true);\n    draw();\n  }\n  // 좁은 화면에서 전체 그림의 보이는 구간(mvx ~ mvx+VW)이 슬라이더를 따라가게 한다\n  function mainFollow(reset) {\n    if (!narrow) { mvx = 0; }\n    else {\n      const lo = sx(state) - 45, hi = sx(state + opt.SPAN + TAIL) + 12;\n      if (reset) mvx = (lo + hi) / 2 - VW / 2;\n      else { if (lo \u003c mvx) mvx = lo; if (hi > mvx + VW) mvx = hi - VW; }\n      mvx = Math.max(0, Math.min(1000 - VW, mvx));\n    }\n    svg.setAttribute('viewBox', r1(mvx) + ' 0 ' + VW + ' 340');\n  }\n\n  function setOption(k, silent) {\n    opt = OPTS[k];\n    last = -1;\n    root.querySelectorAll('#' + NS + 'opt button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-o') === k); });\n    btnMinus.textContent = '◀ −' + opt.RES + 'mm';\n    btnPlus.textContent = '+' + opt.RES + 'mm ▶';\n    hintEl.textContent = '슬라이더(아들자·이동 조)를 끌어 원하는 위치에 놓고 값을 읽어 보세요. 어미자(본척) 숫자는 cm 단위입니다(1 = 10mm). ' +\n      '측정 범위: 0 ~ ' + fmt(opt.MAX) + 'mm (본척 0~150mm 안에 아들자가 모두 들어오는 범위).';\n    panInput.max = String(opt.DIV);\n    pan = Math.round(opt.DIV / 2);\n    panInput.value = String(pan);\n    setMag(defaultMag(k), true);\n    newProblem();\n  }\n  function setMag(m, silent) {\n    if (opt.key === '20' && m > 4) m = 4;   // 1/20형은 ×8/×16 사용 안 함\n    mag = m;\n    root.querySelectorAll('#' + NS + 'mag button').forEach(function (b) {\n      const bm = parseInt(b.getAttribute('data-m'), 10);\n      b.classList.toggle('on', bm === m);\n      b.disabled = opt.key === '20' && bm > 4;\n    });\n    panBox.classList.toggle('show', m > 1);\n    if (revealed) { pan = answer(state).n; panInput.value = String(pan); }   // 정답이 열려 있으면 일치선을 창 안에\n    updatePanLabel();\n    if (!silent) { recenter(); draw(); }\n  }\n  function updatePanLabel() { panLbl.textContent = '부척 ' + pan + '번 선 부근'; }\n\n  // ---- 드래그 (Pointer Events) ----\n  // 포인터 이동량은 화면 px(clientX) 기준으로 잰다. 좁은 화면에서 전체 그림의 viewBox가\n  // 슬라이더를 따라 움직여도 드래그 계산이 흔들리지 않게 하기 위함.\n  let drag = null;\n  function bindDrag() {\n    svg.addEventListener('pointerdown', function (e) {\n      if (!e.target.closest || !e.target.closest('.gw-grab')) return;\n      startDrag(svg, e, VW / svg.getBoundingClientRect().width / PXU);\n    });\n    zsvg.addEventListener('pointerdown', function (e) { startDrag(zsvg, e, ZW / zsvg.getBoundingClientRect().width / zk()); });\n    [svg, zsvg].forEach(function (s) {\n      s.addEventListener('pointermove', function (e) {\n        if (!drag || drag.el !== s || drag.id !== e.pointerId) return;\n        e.preventDefault();\n        setState(drag.s0 + (e.clientX - drag.v0) * drag.scale);\n      });\n      const end = function (e) {\n        if (drag && drag.el === s && drag.id === e.pointerId) {\n          try { s.releasePointerCapture(e.pointerId); } catch (_) {}\n          drag = null;\n        }\n      };\n      s.addEventListener('pointerup', end);\n      s.addEventListener('pointercancel', end);\n      s.addEventListener('lostpointercapture', function () { if (drag && drag.el === s) drag = null; });\n    });\n  }\n  function star wWindow();\n    draw();\n  }\n  function newProblem() {\n    state = randomState();\n    closeAnswer();\n    recenter();\n    mainFollow(true);\n    draw();\n  }\n\n  window.GaugeWidget = { id: ID, title: TITLE, mount: mount, newProblem: newProblem, reveal: reveal,\n                         _answer: answer, _opts: OPTS, _getState: function () { return state; },\n                         _setState: function (s) { setState(s); return state; },\n                         _setOption: function (k) { setOption(k); } };\n  function boot() { const el = document.getElementById('gw-root'); if (el && !root) mount(el); }\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","outside-mic":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>외측마이크로미터 눈금읽기\u003c/title>\n\u003cstyle>\n  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#0969da; --ok:#1a7f37; --warn:#9a6700; --panel:#f6f8fa; --stage:#e9edf1; --stage2:#dfe5ea; }\n  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#4493f8; --ok:#3fb950; --warn:#d29922; --panel:#161b22; --stage:#1a2028; --stage2:#141920; } }\n  * { box-sizing:border-box; }\n  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, \"Malgun Gothic\", sans-serif; }\n  .gw-wrap { max-width:1000px; margin:0 auto; overflow-wrap:anywhere; }\n  .gw-wrap h2 { margin:0 0 6px; font-size:1.25em; line-height:1.3; }\n  .gw-help { margin:0 0 8px; color:var(--muted); font-size:.9em; }\n  .gw-mode { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 0 10px; padding:8px 10px; border:2px solid var(--accent); border-radius:10px; background:var(--panel); }\n  .gw-mode-lab { font-weight:700; margin-right:4px; }\n  .gw-seg { display:inline-flex; max-width:100%; border:1px solid var(--accent); border-radius:8px; overflow:hidden; }\n  .gw-seg button { border:0; border-radius:0; padding:7px 14px; white-space:nowrap; }\n  .gw-seg button + button { border-left:1px solid var(--accent); }\n  .gw-seg button[aria-pressed=\"true\"] { background:var(--accent); color:#fff; font-weight:700; }\n  .gw-mode-note { color:var(--muted); font-size:.85em; }\n  .gw-stage { border:1px solid var(--line); border-radius:10px; background:var(--stage); overflow:hidden; }\n  .gw-svg { display:block; width:100%; height:auto; touch-action:none; user-select:none; -webkit-user-select:none; cursor:ns-resize; outline:none; }\n  .gw-svg:focus-visible { box-shadow:inset 0 0 0 3px var(--accent); }\n  .gw-zoombox { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-start; margin-top:8px; padding:8px; border:1px solid var(--line); border-radius:10px; background:var(--stage2); }\n  .gw-zsvg { display:block; flex:0 1 440px; width:100%; max-width:440px; height:auto; touch-action:none; user-select:none; -webkit-user-select:none; cursor:ns-resize; border:1px solid var(--line); border-radius:8px; outline:none; }\n  .gw-zsvg:focus-visible { box-shadow:0 0 0 3px var(--accent); }\n  .gw-zcap { flex:1 1 220px; font-size:.9em; color:var(--muted); }\n  .gw-zcap b { color:var(--fg); }\n  .gw-zcap p { margin:0 0 6px; }\n  .gw-bar { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; align-items:center; }\n  button { font:inherit; padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); cursor:pointer; }\n  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }\n  .gw-answer { display:none; padding:12px; border:1px solid var(--ok); border-radius:8px; background:var(--panel); }\n  .gw-answer.open { display:block; }\n  .gw-value { font-size:1.6em; font-weight:700; color:var(--ok); }\n  .gw-hint { margin-top:6px; color:var(--warn); font-size:.95em; }\n  /* 휴대폰 세로 화면: 확대 창이 주 읽기 화면, 메인 그림은 보조(위쪽 개요) */\n  @media (max-width: 640px) {\n    body { padding:10px; font-size:15px; }\n    .gw-wrap h2 { font-size:1.08em; }\n    .gw-help { font-size:.82em; }\n    .gw-mode { padding:6px 8px; gap:6px; }\n    .gw-mode-lab { width:100%; }\n    .gw-seg { width:100%; }\n    .gw-seg button { flex:1 1 50%; padding:8px 6px; font-size:.92em; }\n    .gw-mode-note { display:none; }\n    .gw-zoombox { padding:6px; gap:6px; }\n    .gw-zsvg { flex:1 1 100%; max-width:none; }\n    .gw-zcap { font-size:.82em; }\n    .gw-bar button { flex:1 1 40%; }\n  }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"gw-root\">\u003c/div>\n\u003cscript>\n(function () {\n  const ID = 'outside-mic';\n  const TITLE = '외측마이크로미터';\n\n  // \u003ccalc> ---- 정수 연산만 사용 ----\n  // 상태 q = 심블 앞단 위치, 단위 1/1000 mm(정수), 0~25000.\n  // 일반 모드(0.01mm)에서는 q가 항상 10의 배수, 버니어 모드(0.001mm)에서는 1 단위.\n  const Q_MIN = 0, Q_MAX = 25000;\n  const MODE_INFO = {\n    normal:  { step: 10, res: '0.01mm',  label: '일반 0.01mm' },\n    vernier: { step: 1,  res: '0.001mm', label: '버니어 0.001mm' }\n  };\n  let mode = 'normal';                      // 기본: 일반 모드\n\n  function stepOf(m) { return m === 'vernier' ? 1 : 10; }\n  function snapQ(v, m) {\n    const s = stepOf(m || mode);\n    const c = Math.max(Q_MIN, Math.min(Q_MAX, Math.round(v)));\n    return Math.round(c / s) * s;           // Q_MAX(25000)는 10의 배수라 범위를 넘지 않음\n  }\n\n  function readParts(q) {\n    const sleeveMm = Math.floor(q / 1000);            // 노출된 마지막 1mm 눈금\n    const half = Math.floor(q / 500) % 2;             // 0.5mm 눈금 노출 여부\n    const thimble = Math.floor((q % 500) / 10);       // 기선을 지난 심블 눈금(0~49)\n    const vernier = q % 10;                           // 일치하는 부척 선 번호(0~9, 0은 10과 동시 일치)\n    return { q: q, sleeveMm: sleeveMm, half: half, thimble: thimble, vernier: vernier,\n             check: (sleeveMm * 1000 + half * 500 + thimble * 10 + vernier) === q };\n  }\n\n  function formatQ(q, m) {                  // 문자열 변환만 사용 (부동소수점 나눗셈 없음)\n    const ip = Math.floor(q / 1000), fp = q % 1000;\n    if (m === 'vernier') return ip + '.' + String(fp).padStart(3, '0');\n    return ip + '.' + String(Math.floor(fp / 10)).padStart(2, '0');\n  }\n\n  function answer(q, m) {\n    m = (m === 'vernier' || m === 'normal') ? m : mode;\n    if (m === 'normal' && q % 10 !== 0) q = snapQ(q, 'normal');\n    const r = readParts(q);\n    const value = formatQ(q, m);\n    const H = r.half ? '0.5' : '0';\n    let text = '슬리브 ' + r.sleeveMm + 'mm + ' + H + 'mm + 심블 ' + r.thimble + '×0.01mm';\n    if (m === 'vernier') text += ' + 버니어 ' + r.vernier + '×0.001mm';\n    text += ' = ' + value + 'mm';\n    return {\n      q: q, mode: m, um: q, parts: r, value: value, display: value + ' mm', text: text,\n      A: r.sleeveMm, half: r.half, n: r.thimble, k: r.vernier,\n      nearHalf: (r.thimble >= 45 || r.thimble \u003c= 5),\n      vernierZero: (m === 'vernier' && r.vernier === 0),\n      check: r.check\n    };\n  }\n\n  const BOUNDARY_POOLS = (function () {\n    const normal = [], vernier = [];\n    const nSet = { 0: 1, 1: 1, 2: 1, 47: 1, 48: 1, 49: 1 };                 // 심블 눈금(0.01mm) 기준\n    const vSet = { 0: 1, 1: 1, 2: 1, 9: 1, 10: 1, 490: 1, 491: 1, 495: 1, 498: 1, 499: 1 }; // q mod 500 기준\n    for (let q = Q_MIN; q \u003c= Q_MAX; q++) {\n      if (q % 10 === 0 && nSet[(q / 10) % 50]) normal.push(q);\n      if (vSet[q % 500]) vernier.push(q);\n    }\n    return { normal: normal, vernier: vernier };\n  })();\n\n  function randomQ(prev, m, rnd) {\n    rnd = rnd || Math.random;\n    m = m || mode;\n    const s = stepOf(m), pool = BOUNDARY_POOLS[m];\n    let q;\n    do {\n      if (rnd() \u003c 0.4) q = pool[Math.floor(rnd() * pool.length)];\n      else q = Q_MIN + s * Math.floor(rnd() * ((Q_MAX - Q_MIN) / s + 1));\n    } while (q === prev);\n    return q;\n  }\n  // \u003c/calc>\n\n  // ---- 메인 그림 기하 (viewBox 단위) ----\n  const NS = 'http://www.w3.org/2000/svg';\n  const VB_W = 1200;\n  const BY = 190;            // 슬리브 기선 y\n  const X0 = 404;            // 슬리브 0mm 눈금 x\n  const S = 24;              // 1mm 당 길이\n  const SL_H = 62;           // 슬리브 반높이\n  const TH_H = 76;           // 심블 반높이\n  const R = 66;              // 눈금 투영 반지름 (심블 눈금선과 부척 선이 같은 투영을 쓴다)\n  const BEV = 10, TH_W = 134;\n  const ANVIL_X = 140, GAP_S = 6;   // 앤빌 측정면 x, 측정 간격 표시 배율(1mm = 6, 축소 표시)\n  const BOSS_R = 300, SLV_X = 372;\n  const U10 = 0.72 * Math.PI / 180;  // 심블 1/10 눈금(= 버니어 1칸 차이)의 각도\n  const FULL_VB = [40, 92, 1160, 316];\n\n  // ---- 확대 창 기하 (펼친 그림, 선형) ----\n  const ZW = 400;            // 확대 창 폭\n  const ZEX = 250;           // 확대 창의 심블 앞단 x (고정, 슬리브가 미끄러져 지나감)\n  const ZS = 70;             // 확대 창 1mm 당 길이\n  const ZU = 3.6;            // 심블 1/10 눈금 = 3.6 (심블 1눈금 36, 부척 1칸 32.4)\n  const ZGEO = { normal: { H: 360, Y0: 190 }, vernier: { H: 470, Y0: 400 } };\n  const ZLAB = 28;           // 버니어 번호 칸 폭\n\n  // 같은 정수 인자(1/10 눈금 단위)를 같은 식에 넣으므로 일치선은 부동소수점까지 정확히 같은 y가 된다.\n  function yMain(u10) { return BY - R * Math.sin(u10 * U10); }\n  function yZoom(u10) { return ZGEO[mode].Y0 - ZU * u10; }\n\n  let q = 0, drawn = false;\n  let root, svg, zsvg, ans, dyn, zdyn, titleEl, btnN, btnV, zcapV;\n\n  function el(tag, attrs, parent) {\n    const e = document.createElementNS(NS, tag);\n    for (const k in attrs) e.setAttribute(k, attrs[k]);\n    if (parent) parent.appendChild(e);\n    return e;\n  }\n  function grad(defs, id, stops, x2, y2) {\n    const g = el('linearGradient', { id: ID + '-' + id, x1: 0, y1: 0, x2: x2 === undefined ? 0 : x2, y2: y2 === undefined ? 1 : y2 }, defs);\n    stops.forEach(function (s) { el('stop', { offset: s[0], 'stop-color': s[1] }, g); });\n    return 'url(#' + ID + '-' + id + ')';\n  }\n  const FONT = 'system-ui, \"Malgun Gothic\", sans-serif';\n\n  function mount(container) {\n    root = container;\n    container.innerHTML =\n      '\u003cdiv class=\"gw-wrap\">' +\n      '\u003ch2 id=\"' + ID + '-title\">\u003c/h2>' +\n      '\u00 h.max(0, Math.floor((q - (ZEX + 10) * 1000 / ZS) / 500) * 500);\n    for (let t = tFirst; t \u003c= q; t += 500) {\n      const x = ZEX - (q - t) * ZS / 1000;\n      if (x \u003c -4) continue;\n      const isMm = t % 1000 === 0;\n      const mm = t / 1000;\n      if (isMm) {\n        const major = mm % 5 === 0;\n        el('line', { class: 'sl-tick', 'data-t': t, x1: x, y1: Y0, x2: x, y2: Y0 - (major ? 44 : 34), stroke: '#111418', 'stroke-width': 2.4 }, ticks);\n        const near = ZEX - x \u003c 14;\n        const tx = el('text', { x: near ? x - 3 : x, y: Y0 - (major ? 50 : 42), 'text-anchor': near ? 'end' : 'middle', 'font-size': major ? 24 : 16, 'font-weight': 700,\n          fill: major ? '#111418' : '#4b5560', stroke: '#eef1f4', 'stroke-width': 5, 'paint-order': 'stroke', 'font-family': FONT }, nums);\n        tx.textContent = mm;\n      } else {\n        el('line', { class: 'sl-tick', 'data-t': t, x1: x, y1: Y0, x2: x, y2: Y0 + 30, stroke: '#111418', 'stroke-width': 2.4 }, ticks);\n      }\n    }\n    if (mode === 'vernier') {\n      el('rect', { x: 0, y: 0, width: ZLAB, height: H, fill: '#d5dbe1' }, g);\n      el('line', { x1: ZLAB, y1: 0, x2: ZLAB, y2: H, stroke: '#9aa4ad' }, g);\n      for (let j = 0; j \u003c= 10; j++) {\n        const t = el('text', { x: ZLAB - 4, y: yZoom(9 * j) + 5, 'text-anchor': 'end', 'font-size': 14, 'font-weight': 700, fill: '#1d3550', 'font-family': FONT }, g);\n        t.textContent = j;\n      }\n    }\n\n    // 심블\n    el('rect', { x: ZEX, y: 0, width: ZW - ZEX, height: H, fill: zsvg._gt }, g);\n    const r = q % 500, n = Math.floor(r / 10);\n    const dTop = Math.ceil(Y0 / (ZU * 10)) + 1, dBot = Math.ceil((H - Y0) / (ZU * 10)) + 1;\n    for (let d = -dBot; d \u003c= dTop; d++) {\n      const v = n + d;\n      const u10 = 10 * v - r;\n      const y = yZoom(u10);\n      if (y \u003c -2 || y > H + 2) continue;\n      const vv = ((v % 50) + 50) % 50;\n      const major = vv % 5 === 0;\n      el('line', { class: 'th-line', 'data-v': vv, 'data-u10': u10, x1: ZEX, y1: y, x2: ZEX + (major ? 50 : 32), y2: y, stroke: '#111418', 'stroke-width': 1.6 }, g);\n      if (major) {\n        const t = el('text', { x: ZEX + 58, y: y + 8, 'font-size': 22, 'font-weight': 700, fill: '#111418', 'font-family': FONT }, g);\n        t.textContent = vv;\n      }\n    }\n    el('line', { x1: ZEX, y1: 0, x2: ZEX, y2: H, stroke: '#3b444d', 'stroke-width': 2 }, g);   // 심블 앞단\n\n    // 머리띠 (눈금 위에 덮어 글자 겹침 방지)\n    el('rect', { x: 0, y: 0, width: ZW, height: 22, fill: '#c9d1d8' }, g);\n    el('line', { x1: 0, y1: 22, x2: ZW, y2: 22, stroke: '#8c959e' }, g);\n    const h1 = el('text', { x: mode === 'vernier' ? 4 : 8, y: 16, 'font-size': 12, 'font-weight': 600, fill: '#2b3137', 'font-family': FONT }, g);\n    h1.textContent = mode === 'vernier' ? '부척 · 슬리브' : '슬리브 (기선 위 1mm / 아래 0.5mm)';\n    const h2 = el('text', { x: ZW - 8, y: 16, 'text-anchor': 'end', 'font-size': 12, 'font-weight': 600, fill: '#2b3137', 'font-family': FONT }, g);\n    h2.textContent = '심블 ×0.01mm';\n  }\n\n  function updateModeUI() {\n    const info = MODE_INFO[mode];\n    titleEl.textContent = TITLE + (mode === 'vernier' ? ' — 버니어 마이크로미터' : '') + ' (0~25mm, 최소눈금 ' + info.res + ')';\n    btnN.setAttribute('aria-pressed', mode === 'normal' ? 'true' : 'false');\n    btnV.setAttribute('aria-pressed', mode === 'vernier' ? 'true' : 'false');\n    zcapV.style.display = mode === 'vernier' ? '' : 'none';\n    svg._frameTxt.textContent = '0–25 mm   ' + info.res.replace('mm', ' mm');\n  }\n\n  function setMode(m) {\n    if (m !== 'normal' && m !== 'vernier') return;\n    closeAnswer();                           // 모드 전환 시 정답 패널은 항상 닫는다\n    if (m === mode) return;\n    mode = m;\n    q = snapQ(q, mode);                      // 일반 모드로 돌아오면 0.01mm 단위로 맞춤\n    updateModeUI();\n    draw();\n  }\n\n  // ---- 입력: 세로 드래그(한 눈금씩), 가로 드래그(빠르게: 앞단이 포인터를 따라감), 휠, 키보드 ----\n  function bindInput(target, unitsPerMm) {\n    let dragging = false, pid = null, sx = 0, sy = 0, lastY = 0, acc = 0, axis = null, q0 = 0;\n    target.addEventListener('pointerdown', function (e) {\n      if (e.button !== undefined && e.button !== 0) return;\n      dragging = true; pid = e.pointerId; sx = e.clientX; sy = e.clientY; lastY = e.clientY; acc = 0; axis = null; q0 = q;\n      try { target.setPointerCapture(pid); } catch (err) {}\n      target.focus({ preventScroll: true });\n      e.preventDefault();\n    });\n    target.addEventListener('pointermove', function (e) {\n      if (!dragging || e.pointerId !== pid) return;\n      const dx = e.clientX - sx, dy = e.clientY - sy;\n      if (!axis) {\n        if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.5) axis = 'x';\n        else if (Math.abs(dy) > 0) axis = 'y';\n      }\n      if (axis === 'x') {\n        const ctm = target.getScreenCTM();\n        const scale = ctm && ctm.a ? ctm.a : 1;\n        setState(q0 + (dx / scale) / unitsPerMm * 1000);\n      } else if (axis === 'y') {\n        const px = mode === 'vernier' ? 3 : 4;\n        acc += lastY - e.clientY;\n        lastY = e.clientY;\n        const steps = acc > 0 ? Math.floor(acc / px) : Math.ceil(acc / px);\n        if (steps !== 0) { acc -= steps * px; setState(q + steps * stepOf(mode)); }\n      }\n    });\n    function end(e) {\n      if (e.pointerId !== pid) return;\n      dragging = false;\n      try { target.releasePointerCapture(pid); } catch (err) {}\n      pid = null;\n    }\n    target.addEventListener('pointerup', end);\n    target.addEventListener('pointercancel', end);\n    target.addEventListener('wheel', function (e) {\n      e.preventDefault();\n      if (e.deltaY === 0) return;\n      setState(q + (e.deltaY \u003c 0 ? 1 : -1) * (e.shiftKey ? 10 : 1) * stepOf(mode));\n    }, { passive: false });\n    target.addEventListener('keydown', function (e) {\n      const s = stepOf(mode);\n      let d = 0;\n      if (e.key === 'ArrowUp') d = e.shiftKey ? 500 : s;\n      else if (e.key === 'ArrowDown') d = e.shiftKey ? -500 : -s;\n      else if (e.key === 'ArrowRight') d = 10 * s;\n      else if (e.key === 'ArrowLeft') d = -10 * s;\n      else return;\n      e.preventDefault();\n      setState(q + d);\n    });\n  }\n\n  function closeAnswer() { if (ans) { ans.classList.remove('open'); ans.innerHTML = ''; } }\n\n  function setState(v) {\n    const next = snapQ(v, mode);\n    if (next === q && drawn) return;\n    q = next;\n    closeAnswer();\n    draw();\n    drawn = true;\n  }\n\n  function reveal() {\n    if (ans.classList.contains('open')) { closeAnswer(); return; }\n    const a = answer(q, mode);\n    let hint = '';\n    if (a.nearHalf) hint += '\u003cdiv class=\"gw-hint\">0.5mm 눈금이 심블 앞단 밖으로 보이는지 먼저 확인하세요.\u003c/div>';\n    if (a.vernierZero) hint += '\u003cdiv class=\"gw-hint\">부척 0번과 10번 선이 함께 일치하면 0.001mm 자리는 0입니다.\u003c/div>';\n    ans.innerHTML = '\u003cdiv class=\"gw-value\">' + a.display + '\u003c/div>\u003cdiv>' + a.text + '\u003c/div>' + hint;\n    ans.classList.add('open');\n    try {\n      const r = ans.getBoundingClientRect();\n      const vh = window.innerHeight || document.documentElement.clientHeight;\n      if (r.top \u003c 0 || r.bottom > vh) ans.scrollIntoView({ block: 'nearest', behavior: 'smooth' });\n    } catch (err) {}\n  }\n\n  function newProblem() {\n    q = randomQ(drawn ? q : -1, mode);\n    closeAnswer();\n    draw();\n    drawn = true;\n  }\n\n  window.GaugeWidget = {\n    id: ID, title: TITLE, mount: mount, newProblem: newProblem, reveal: reveal,\n    // answer(q[, mode]) / readParts(q): q는 1/1000mm 정수(0~25000). mode 생략 시 현재 모드.\n    answer: answer, readParts: readParts,\n    get boundaryPool() { return BOUNDARY_POOLS[mode]; },\n    boundaryPools: BOUNDARY_POOLS,\n    unit: 0.001,\n    setMode: setMode, getMode: function () { return mode; },\n    getState: function () { return q; }, setState: function (v) { setState(v); },\n    _answer: answer, _getState: function () { return q; }, _setState: function (v) { setState(v); },\n    _randomQ: randomQ, _formatQ: formatQ\n  };\n  document.addEventListener('DOMContentLoaded', function () {\n    const r = document.getElementById('gw-root');\n    if (r) mount(r);\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","inside-mic":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>내측마이크로미터 눈금읽기\u003c/title>\n\u003cstyle>\n  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#0969da; --ok:#1a7f37; --badge:#cf222e;\n          --mHi:#ffffff; --mMid:#d3d8de; --mLo:#8e97a1; --mEdge:#4b535c;\n          --grip:#9aa2ab; --gripHi:#e9ecef; --knurl:#59616b;\n          --work:#c4b296; --workEdge:#8a7558; --tick:#1f2328; }\n  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#4493f8; --ok:#3fb950; --badge:#f85149;\n          --mHi:#9aa3ad; --mMid:#59616b; --mLo:#2a3038; --mEdge:#11151a;\n          --grip:#3a424c; --gripHi:#7d8691; --knurl:#1b1f24;\n          --work:#5c4d3a; --workEdge:#8a7558; --tick:#f0f3f6; } }\n  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, \"Malgun Gothic\", sans-serif; }\n  .gw-svg { width:100%; height:auto; max-width:900px; max-height:max(320px, calc(100vh - 230px)); margin:0 auto;\n            touch-action:none; user-select:none; -webkit-user-select:none; display:block; }\n  .gw-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }\n  .gw-head h2 { margin:0; font-size:1.25em; }\n  .gw-badge { display:inline-block; padding:2px 10px; border-radius:999px; background:var(--badge); color:#fff; font-weight:700; font-size:.9em; }\n  .gw-sub { color:var(--muted); font-size:.9em; margin:4px 0 8px; }\n  .gw-bar { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; align-items:center; }\n  .gw-opt { display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:.9em; color:var(--muted); }\n  button { font:inherit; padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); cursor:pointer; }\n  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }\n  button.on { border-color:var(--accent); color:var(--accent); font-weight:600; }\n  .gw-opt button { padding:4px 10px; }\n  .gw-zoombox { border:1px solid var(--line); border-radius:8px; padding:8px; margin:8px auto 0; max-width:880px; box-sizing:border-box; }\n  .gw-zoomhead { font-size:.9em; color:var(--muted); margin-bottom:6px; }\n  .gw-zsvg { width:100%; height:auto; max-height:min(460px, 60vh); display:block; margin:0 auto; touch-action:none; user-select:none; -webkit-user-select:none; }\n  @media (max-width: 600px) {\n    body { padding:10px; }\n    .gw-head h2 { font-size:1.1em; }\n    .gw-sub { font-size:.85em; }\n    .gw-zoombox { padding:4px; }\n    .gw-zoomhead { font-size:.82em; }\n    .gw-bar button { flex:1 1 0; }\n  }\n  .gw-answer { display:none; padding:12px; border:1px solid var(--ok); border-radius:8px; }\n  .gw-answer.open { display:block; }\n  .gw-value { font-size:1.6em; font-weight:700; color:var(--ok); }\n  .gw-hint { color:var(--muted); font-size:.85em; margin-top:6px; }\n  /* SVG 색 */\n  .s-edge { stroke:var(--mEdge); stroke-width:1.2; }\n  .s-work { fill:var(--work); stroke:var(--workEdge); stroke-width:1.2; }\n  .s-tick { stroke:var(--tick); stroke-width:1.4; }\n  .s-thin { stroke:var(--tick); stroke-width:1.1; }\n  .s-txt { fill:var(--tick); font:700 12px system-ui, \"Malgun Gothic\", sans-serif; }\n  .s-txt-s { fill:var(--tick); font:700 10.5px system-ui, \"Malgun Gothic\", sans-serif; }\n  .s-muted { fill:var(--muted); font:12px system-ui, \"Malgun Gothic\", sans-serif; }\n  .s-engr { fill:var(--mEdge); font:600 10px system-ui, sans-serif; }\n  .s-dim { stroke:var(--accent); stroke-width:1.2; fill:none; }\n  .s-dimtxt { fill:var(--accent); font:600 12px system-ui, \"Malgun Gothic\", sans-serif; }\n  .s-knurl { stroke:var(--knurl); stroke-width:1; }\n  .s-grab { cursor:ns-resize; }\n  .s-grabx { cursor:ew-resize; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"gw-root\">\u003c/div>\n\u003cscript>\n(function () {\n  const ID = 'inside-mic';\n  const TITLE = '내측마이크로미터';\n\n  // ---- 명세 상수 ----\n  const O_UM = 5000;                 // 측정 범위 시작값 5mm (슬리브 숫자에 포함되어 새겨짐)\n  const STATE_MIN = 0, STATE_MAX = 2500, STEP = 1;   // p: 1 = 0.01mm, V = 5 + p/100\n  const BOUNDARY_RATE = 0.25;        // 명세 4절: 출제의 약 25%는 경계값 풀\n\n  // ---- 상태: 정수 하나 (p) + 드래그 중 부드러운 표시용 실수 ----\n  let p = 0, pView = 0, lastP = -1;\n\n  // ---- 명세 함수: p → 읽기 값 / 정답 (정수 연산) ----\n  // 반전 눈금 읽기: 심블이 오른쪽부터 눈금을 덮어 간다. 눈금 m 은 V >= m 이면 가려짐.\n  //  B = 심블 앞단 바로 왼쪽에 보이는 1mm 눈금 = floor(V) + 1\n  //  기본 mm = B - 1, 0.5mm 눈금(B - 0.5)이 가려져 있으면 +0.5, 심블 눈금 × 0.01\n  function readParts(s) {\n    const sleeveMm = Math.floor(s / 100);           // zero-based (내부용)\n    const sleeveNum = sleeveMm + O_UM / 1000;       // = B - 1\n    const visibleB = sleeveNum + 1;                 // 보이는 가장 가까운 1mm 눈금 숫자\n    const half = Math.floor(s / 50) % 2;            // 1 이면 B-0.5 눈금이 가려짐\n    const thimble = s % 50;\n    const headUm = sleeveMm * 1000 + half * 500 + thimble * 10;   // == s*10\n    return { sleeveMm: sleeveMm, sleeveNum: sleeveNum, visibleB: visibleB, half: half, thimble: thimble, headUm: headUm };\n  }\n  function answer(s) {\n    const r = readParts(s);\n    const answerUm = O_UM + r.headUm;\n    const ansStr = (answerUm / 1000).toFixed(2);\n    const halfStr = r.half ? '0.5' : '0';\n    const text = '슬리브 ' + r.sleeveNum + 'mm [보이는 눈금 ' + r.visibleB + '에서 1을 뺌] + ' + halfStr +\n      'mm' + (r.half ? ' [' + (r.visibleB - 0.5) + ' 눈금이 가려짐]' : ' [' + (r.visibleB - 0.5) + ' 눈금이 보임]') +\n      ' + 심블 ' + r.thimble + '×0.01mm = ' + ansStr + 'mm';\n    return { answerUm: answerUm, valueMm: answerUm / 1000, valueStr: ansStr, text: text, parts: r };\n  }\n\n  // ---- 무작위 출제 ----\n  const BOUNDARY_POOL = (function () {\n    const set = new Set([0, 1, 49, 50, 51, 99, 100, 101, 149, 150, 151, 2449, 2450, 2451, 2499, 2500]);\n    for (let k = 1; k \u003c= 50; k++) [k * 50 - 1, k * 50, k * 50 + 1].forEach(function (v) {\n      if (v >= STATE_MIN && v \u003c= STATE_MAX) set.add(v);\n    });\n    return Array.from(set).sort(function (a, b) { return a - b; });\n  })();\n  function randomState() {\n    let s;\n    do {\n      if (Math.random() \u003c BOUNDARY_RATE) s = BOUNDARY_POOL[Math.floor(Math.random() * BOUNDARY_POOL.length)];\n      else s = STATE_MIN + STEP * Math.floor(Math.random() * ((STATE_MAX - STATE_MIN) / STEP + 1));\n    } while (s === lastP);\n    return s;\n  }\n\n  // ---- 그림 상수 (SVG 좌표) ----\n  // 사진(미쓰토요 5-30mm) 기준 배치:\n  //  [이동 조 블록(핀) + 로드] ← 심블과 함께 왼쪽으로 이동\n  //  [고정 조 블록(핀)][슬리브: 30 25 20 15 10 5 (화면 고정)][심블][래칫] ← 심블+래칫 왼쪽으로 이동\n  // 심블 앞단 x = xOf(V) + EDGE_GAP. 눈금 m 은 V >= m 이면 가려짐(그리지 않음), V \u003c m 이면 보임.\n  const VB_X = 0, VB_Y = 50, VB_W = 1000, VB_H = 290;\n  const PX_MM = 11;                   // 1mm 당 px (슬리브·조 공통 → 로드로 연결된 움직임이 일치)\n  const AXIS_Y = 230;                 // 슬리브 기선\n  const X5 = 766;                     // 슬리브 '5' 눈금 x\n  const SCALE_MAX = 31;               // 30 왼쪽에 1mm 여유 눈금(31, 숫자 없음): V=30.00 에서도 B=31 이 보임\n  const EDGE_GAP = 1.2;               // 심블 앞단을 V 위치보다 오른쪽으로: V=m-0.01 일 때 눈금 m 이 앞단 왼쪽에 온전히 보임\n  const R0 = 400;                     // 고정 조 핀 바깥 측정면(오른쪽 면) x\n  const PIN_W = 7, PIN_TOP = 96, EAR_Y = 150, BLK_TOP = 190, BLK_BOT = 270;\n  const SL_X0 = R0 + 70;              // 슬리브 시작(고정 블록 오른쪽)\n  const SL_TOP = AXIS_Y - 28, SL_BOT = AXIS_Y + 28;\n  const TH_W = 104, RAT_W = 52, TH_R = 58, TH_TOP = AXIS_Y - TH_R, TH_BOT = AXIS_Y + TH_R;\n  const PX_PER_DIV = TH_R * 2 * Math.PI / 50;   // 기선 부근 심블 눈금 간격(px)\n  function xOf(mm) { return X5 - (mm - 5) * PX_MM; }\n\n  let root, svg, ans, gDyn, zSvg;\n  function isNarrow() { return !!root && root.clientWidth > 0 && root.clientWidth \u003c 600; }\n  function el(id) { return root.querySelector('#' + ID + '-' + id); }\n\n  function defs() {\n    function cyl(id, hi, mid, lo) {   // 원통(세로 방향 음영)\n      return '\u003clinearGradient id=\"' + ID + '-' + id + '\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">' +\n        '\u003cstop offset=\"0\" style=\"stop-color:var(' + lo + ')\"/>' +\n        '\u003cstop offset=\".25\" style=\"stop-color:var(' + hi + ')\"/>' +\n        '\u003cstop offset=\".55\" style=\"stop-color:var(' + mid + ')\"/>' +\n        '\u003cstop offset=\".88\" style=\"stop-color:var(' + lo + ')\"/>' +\n        '\u003cstop offset=\"1\" style=\"stop-color:var(' + mid + ')\"/>\u003c/linearGradient>';\n    }\n    return '\u003cdefs>' +\n      cyl('gCyl', '--mHi', '--mMid', '--mLo') +\n      cyl('gGrip', '--gripHi', '--grip', '--mLo') +\n      '\u003clinearGradient id=\"' + ID + '-gBlock\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">' +\n        '\u003cstop offset=\"0\" style=\"stop-color:var(--mHi)\"/>\u003cstop offset=\".6\" style=\"stop-color:var(--mMid)\"/>' +\n        '\u003cstop offset=\"1\" style=\"stop-color:var(--mLo)\"/>\u003c/linearGradient>' +\n      '\u003clinearGradient id=\"' + ID + '-gPin\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">' +\n        '\u003cstop offset=\"0\" style=\"stop-color:var(--mLo)\"/>\u003cstop offset=\".45\" style=\"stop-color:var(--mHi)\"/>' +\n        '\u003cstop offset=\"1\" style=\"stop-color:var(--mLo)\"/>\u003c/linearGradient>' +\n      '\u003cpattern id=\"' + ID + '-knurl\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\">' +\n        '\u003cpath class=\"s-knurl\" d=\"M0 0 L6 6 M6 0 L0 6\" fill=\"none\"/>\u003c/pattern>' +\n      '\u003cfilter id=\"' + ID + '-sh\" x=\"-5%\" y=\"-5%\" width=\"110%\" height=\"120%\">' +\n        '\u003cfeDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"2\" flood-opacity=\".22\"/>\u003c/filter>' +\n      '\u003c/defs>';\n  }\n\n  function mount(container) {\n    root = container;\n    container.innerHTML =\n      '\u003cdiv class=\"gw-head\">\u003ch2>' + TITLE + ' (캘리퍼형)\u003c/h2>\u003cspan class=\"gw-badge\">내측\u003c/span>\u003c/div>' +\n      '\u003cdiv class=\"gw-sub\">측정 범위 5.00 ~ 30.00 mm · 최소 눈금 0.01 mm · 슬리브 숫자는 심블 쪽(오른쪽) 5부터 왼쪽으로 커지고, ' +\n        '값이 커질수록 심블이 왼쪽으로 가며 눈금을 덮습니다. 심블을 위아래로(미세) 또는 좌우로(빠르게) 끌거나 왼쪽 조를 끄세요. 마우스 휠도 됩니다.\u003c/div>' +\n      '\u003csvg class=\"gw-svg\" id=\"' + ID + '-svg\" viewBox=\"' + VB_X + ' ' + VB_Y + ' ' + VB_W + ' ' + VB_H + '\" role=\"img\" aria-label=\"내측마이크로미터 전체 모습\">' +\n        defs() + '\u003cg id=\"' + ID + '-dyn\">\u003c/g>\u003c/svg>' +\n      '\u003cdiv class=\"gw-zoombox\">\u003cdiv class=\"gw-zoomhead\">확대 창 — 심블 앞단 왼쪽에 보이는 눈금과 기선에 맞는 심블 눈금을 읽으세요. 여기서 끌어도 움직입니다.\u003c/div>' +\n        '\u003csvg class=\"gw-zsvg\" id=\"' + ID + '-z\" viewBox=\"0 0 280 120\" role=\"img\" aria-label=\"심블 앞단 확대\">\u003c/svg>\u003c/div>' +\n      '\u003cdiv class=\"gw-bar\">\u003cbutton class=\"primary\" id=\"' + ID + '-reveal\">정답확인\u003c/button>' +\n      '\u003cbutton id=\"' + ID + '-new\">새 문제\u003c/button>\u003c/div>' +\n      '\u003cdiv class=\"gw-answer\" id=\"' + ID + '-ans\">\u003c/div>';\n    svg = el('svg'); ans = el('ans'); gDyn = el('dyn'); zSvg = el('z');\n    el('reveal').onclick = reveal;\n    el('new').onclick = newProblem;\n    // 화면 폭이 바뀌면(휴대폰 회전 등) 확대 창 범위를 다시 정한다\n    let lastNarrow = null;\n    function onResize() { const n = isNarrow(); if (n !== lastNarrow) { lastNarrow = n; draw(); } }\n    if (window.ResizeObserver) new ResizeObserver(onResize).observe(container);\n    else window.addEventListener('resize', onResize);\n    bindDrag(svg);\n    bindDrag(zSvg);\n    newProblem();\n  }\n\n  // ---- 입력 ----\n  function bindDrag(target) {\n    let drag = null;\n    target.addEventListener('pointerdown', function (e) {\n      const kind = e.target.closest && e.target.closest('[data-grab]');\n      if (!kind) return;\n      e.preventDefault();\n      const ctm = target.getScreenCTM();\n      drag = { id: e.pointerId, kind: kind.getAttribute('data-grab'), x: e.clientX, y: e.clientY,\n               p0: pView, scale: ctm ? ctm.a : 1 };\n      try { target.setPointerCapture(e.pointerId); } catch (_) {}\n    });\n    target.addEventListener('pointermove', function (e) {\n      if (!drag || e.pointerId !== drag.id) return;\n      const dx = (e.clientX - drag.x) / drag.scale;\n      const dy = (e.clientY - drag.y) / drag.scale;\n      let dp;\n      if (drag.kind === 'jaw') dp = -dx / PX_MM * 100;                     // 왼쪽으로 끌면 값 증가\n      else dp = -dy / PX_PER_DIV - dx / PX_MM * 100;                       // 위로/왼쪽으로 끌면 값 증가\n      setView(drag.p0 + dp);\n    });\n    function end(e) {\n      if (!drag || e.pointerId !== drag.id) return;\n      drag = null;\n      setState(pView);\n    }\n    target.addEventListener('pointerup', end);\n    target.addEventListener('pointercancel', end);\n    target.addEventListener('wheel', function (e) {\n      e.preventDefault();\n      const n = (e.deltaY > 0 ? 1 : -1) * (e.shiftKey ? 10 : 1);\n      setState(p + n);\n    }, { passive: false });\n  }\n\n  function clamp(s) { return Math.max(STATE_MIN, Math.min(STATE_MAX, s)); }\n  function closeAnswer() { if (ans) ans.classList.remove('open'); }\n  function setView(s) {           // 드래그 중: 부드럽게 표시, 정답 변수 p도 즉시 반올림 반영\n    pView = clamp(s);\n    p = Math.round(pView / STEP) * STEP;\n    closeAnswer();\n    draw();\n  }\n  function setState(s) {          // 스냅\n    p = clamp(Math.round(s / STEP) * STEP);\n    pView = p;\n    closeAnswer();\n    draw();\n  }\n\n  // ---- 그리기: pView(표시) 하나로만 그린다 ----\n  function f(n) { return Math.round(n * 100) / 100; }\n  function U(id) { return 'url(#' + ID + '-' + id + ')'; }\n  function draw() {\n    const s = pView;\n    const V = 5 + s / 100;                     // 측정값(mm, 표시용 실수)\n    const tE = xOf(V) + EDGE_GAP;              // 심블 앞단\n    const L = R0 - V * PX_MM;                  // 이동 조 핀 바깥 측정면(왼쪽 면)\n    let h = '';\n\n    // 1) 공작물(구멍 단면) — 두 핀 끝의 바깥 면이 구멍 벽에 닿는다\n    h += '\u003crect class=\"s-work\" x=\"' + f(L - 46) + '\" y=\"' + (PIN_TOP - 4) + '\" width=\"46\" height=\"40\"/>';\n    h += '\u003crect class=\"s-work\" x=\"' + R0 + '\" y=\"' + (PIN_TOP - 4) + '\" width=\"46\" height=\"40\"/>';\n    h += '\u003ctext class=\"s-muted\" x=\"' + (R0 + 50) + '\" y=\"' + (PIN_TOP + 20) + '\">공작물(구멍 단면)\u003c/text>';\n    h += '\u003cline class=\"s-dim\" x1=\"' + f(L) + '\" y1=\"70\" x2=\"' + R0 + '\" y2=\"70\"/>';\n    h += '\u003cpath class=\"s-dim\" d=\"M' + f(L) + ' 70 l6 -4 M' + f(L) + ' 70 l6 4 M' + R0 + ' 70 l-6 -4 M' + R0 + ' 70 l-6 4\"/>';\n    h += '\u003cline class=\"s-dim\" x1=\"' + f(L) + '\" y1=\"64\" x2=\"' + f(L) + '\" y2=\"' + (PIN_TOP - 6) + '\" stroke-dasharray=\"2 2\"/>';\n    h += '\u003cline class=\"s-dim\" x1=\"' + R0 + '\" y1=\"64\" x2=\"' + R0 + '\" y2=\"' + (PIN_TOP - 6) + '\" stroke-dasharray=\"2 2\"/>';\n    h += '\u003ctext class=\"s-dimtxt\" x=\"' + f((L + R0) / 2) + '\" y=\"62\" text-anchor=\"middle\">안지름\u003c/text>';\n\n    // 2) 로드(심블과 연결, 이동 조를 민다) — 이동 조 블록과 고정 조 블록 사이에 보임\n    h += '\u003crect class=\"s-edge\" fill=\"' + U('gCyl') + '\" x=\"' + f(L + 10) + '\" y=\"' + (AXIS_Y - 9) + '\" width=\"' + f(R0 - 12 - (L + 10)) + '\" height=\"18\"/>';\n\n    // 3) 이동 조 블록(드래그 가능): 둥근 보스 + 블록 + 위로 뻗은 핀 + 아래 클램프 나사\n    h += '\u003cg data-grab=\"jaw\" class=\"s-grabx\" filter=\"' + U('sh') + '\">';\n    h += '\u003crect class=\"s-edge\" fill=\"' + U('gCyl') + '\" x=\"' + f(L - 66) + '\" y=\"' + (AXIS_Y - 24) + '\" width=\"14\" height=\"48\" rx=\"3\"/>';\n    h += '\u003crect class=\"s-edge\" fill=\"var(--mMid)\" x=\"' + f(L - 33) + '\" y=\"' + BLK_BOT + '\" width=\"12\" height=\"8\"/>';\n    h += '\u003crect class=\"s-edge\" fill=\"' + U('gGrip') + '\" x=\"' + f(L - 40) + '\" y=\"' + (BLK_BOT + 8) + '\" width=\"26\" height=\"14\" rx=\"3\"/>';\n    h += '\u003cpath class=\"s-edge\" fill=\"' + U('gBlock') + '\" d=\"M' + f(L - 54) + ' ' + BLK_TOP + ' L' + f(L - 34) + ' ' + BLK_TOP +\n         ' L' + f(L - 4) + ' ' + EAR_Y + ' L' + f(L + 12) + ' ' + EAR_Y + ' L' + f(L + 12) + ' ' + BLK_BOT + ' L' + f(L - 54) + ' ' + BLK_BOT + ' Z\"/>';\n    h += '\u003crect class=\"s-edge\" fill=\"' + U('gPin') + '\" x=\"' + f(L) + '\" y=\"' + PIN_TOP + '\" width=\"' + PIN_W + '\" height=\"' + (EAR_Y - PIN_TOP + 1) + '\" rx=\"1.5\"/>';\n    h += '\u003ctext class=\"s-engr\" x=\"' + f(L - 50) + '\" y=\"' + (AXIS_Y - 2) + '\">5-30mm\u003c/text>';\n    h += '\u003crect x=\"' + f(L - 70) + '\" y=\"' + (PIN_TOP - 6) + '\" width=\"90\" height=\"' + (BLK_BOT + 26 - PIN_TOP) + '\" fill=\"transparent\"/>';\n    h += '\u003c/g>';\n    h += '\u003ctext class=\"s-muted\" x=\"' + f(L - 20) + '\" y=\"' + (BLK_BOT + 42) + '\" text-anchor=\"middle\">이동 조\u003c/text>';\n\n    // 4) 고정 조 블록 + 핀 (화면 고정)\n    h += '\u003cg filter=\"' + U('sh') + '\">';\n    h += '\u003cpath class=\"s-edge\" fill=\"' + U('gBlock') + '\" d=\"M' + (R0 - 12) + ' ' + EAR_Y + ' L' + (R0 + 4) + ' ' + EAR_Y +\n         ' L' + (R0 + 34) + ' ' + BLK_TOP + ' L' + (SL_X0 + 2) + ' ' + BLK_TOP + ' L' + (SL_X0 + 2) + ' ' + BLK_BOT + ' L' + (R0 - 12) + ' ' + BLK_BOT + ' Z\"/>';\n    h += '\u003crect class=\"s-edge\" fill=\"' + U('gPin') + '\" x=\"' + (R0 - PIN_W) + '\" y=\"' + PIN_TOP + '\" width=\"' + PIN_W + '\" height=\"' + (EAR_Y - PIN_TOP + 1) + '\" rx=\"1.5\"/>';\n    h += '\u003ctext class=\"s-engr\" x=\"' + (R0 + 4) + '\" y=\"' + (BLK_TOP + 18) + '\">0.01mm\u003c/text>';\n    h += '\u003c/g>';\n    h += '\u003ctext class=\"s-muted\" x=\"' + (R0 + 24) + '\" y=\"' + (BLK_BOT + 42) + '\" text-anchor=\"middle\">고정 조\u003c/text>';\n\n    // 5) 슬리브(화면 고정): 왼→오 30 … 5, 1mm 눈금·숫자는 기선 위, 0.5mm 눈금은 기선 아래\n    // 슬리브 오른쪽 부분은 심블 속으로 들어가 있다(심블 앞단 너머로는 그리지 않음)\n    h += '\u003crect class=\"s-edge\" fill=\"' + U('gCyl') + '\" x=\"' + SL_X0 + '\" y=\"' + SL_TOP + '\" width=\"' + f(tE + 8 - SL_X0) + '\" height=\"' + (SL_BOT - SL_TOP) + '\"/>';\n    h += '\u003cline class=\"s-thin\" x1=\"' + f(xOf(SCALE_MAX) - 6) + '\" y1=\"' + AXIS_Y + '\" x2=\"' + f(tE) + '\" y2=\"' + AXIS_Y + '\"/>';\n    for (let m = 5; m \u003c= SCALE_MAX; m++) {\n      const x = xOf(m);\n      if (m \u003c= 30 && m % 5 === 0 && x - 9 \u003c tE) h +='\u003ctext class=\"s-txt\" x=\"' + f(x) + '\" y=\"' + (AXIS_Y - 19) + '\" text-anchor=\"middle\">' + m + '\u003c/text>';\n      if ((m - 5) * 100 \u003c= s) continue;         // V >= m : 심블에 가려짐\n      const len = (m % 5 === 0) ? 15 : 9;\n      h += '\u003cline class=\"s-tick\" data-v=\"' + m + '\" x1=\"' + f(x) + '\" y1=\"' + AXIS_Y + '\" x2=\"' + f(x) + '\" y2=\"' + (AXIS_Y - len) + '\"/>';\n    }\n    for (let m = 5; m \u003c SCALE_MAX; m++) {\n      const hv = m + 0.5, x = xOf(hv);\n      if ((m - 5) * 100 + 50 \u003c= s) continue;    // V >= m+0.5 : 가려짐\n      h += '\u003cline class=\"s-tick\" data-h=\"' + hv + '\" x1=\"' + f(x) + '\" y1=\"' + AXIS_Y + '\" x2=\"' + f(x) + '\" y2=\"' + (AXIS_Y + 9) + '\"/>';\n    }\n\n    // 6) 심블(널링) + 래칫 — 측정값이 커지면 왼쪽으로 이동하며 슬리브를 덮는다\n    h += '\u003cg data-grab=\"thimble\" class=\"s-grab\" filter=\"' + U('sh') + '\">';\n    const gradW = 46;\n    h += '\u003cpath class=\"s-edge\" fill=\"' + U('gCyl') + '\" d=\"M' + f(tE) + ' ' + (TH_TOP + 8) + ' L' + f(tE + gradW) + ' ' + TH_TOP +\n         ' L' + f(tE + gradW) + ' ' + TH_BOT + ' L' + f(tE) + ' ' + (TH_BOT - 8) + ' Z\"/>';\n    h += '\u003crect class=\"s-edge\" fill=\"' + U('gGrip') + '\" x=\"' + f(tE + gradW) + '\" y=\"' + (TH_TOP - 2) + '\" width=\"' + (TH_W - gradW) + '\" height=\"' + (TH_BOT - TH_TOP + 4) + '\" rx=\"3\"/>';\n    h += '\u003crect fill=\"' + U('knurl') + '\" x=\"' + f(tE + gradW + 6) + '\" y=\"' + (TH_TOP + 4) + '\" width=\"' + (TH_W - gradW - 12) + '\" height=\"' + (TH_BOT - TH_TOP - 8) + '\"/>';\n    h += '\u003crect fill=\"' + U('gGrip') + '\" opacity=\".35\" x=\"' + f(tE + gradW) + '\" y=\"' + (TH_TOP - 2) + '\" width=\"' + (TH_W - gradW) + '\" height=\"' + (TH_BOT - TH_TOP + 4) + '\" rx=\"3\"/>';\n    const frac = s % 50;                        // 기선에 오는 심블 눈금(실수)\n    for (let k = 0; k \u003c 50; k++) {\n      let d = k - frac;\n      d = ((d % 50) + 75) % 50 - 25;\n      const th = d * 2 * Math.PI / 50;\n      if (Math.abs(th) > 1.3) continue;\n      const y = AXIS_Y + (TH_R - 6) * Math.sin(th);   // 사진처럼 위에서부터 45, 0, 5 … (아래로 갈수록 커짐)\n      const len = (k % 5 === 0) ? 18 : 11;\n      const op = Math.max(0.2, Math.cos(th)).toFixed(2);\n      h += '\u003cline class=\"s-thin\" data-k=\"' + k + '\" x1=\"' + f(tE) + '\" y1=\"' + f(y) + '\" x2=\"' + f(tE + len) + '\" y2=\"' + f(y) + '\" stroke-opacity=\"' + op + '\"/>';\n      if (k % 5 === 0) h += '\u003ctext class=\"s-txt-s\" x=\"' + f(tE + 22) + '\" y=\"' + f(y + 4) + '\" fill-opacity=\"' + op + '\">' + k + '\u003c/text>';\n    }\n    const rx0 = tE + TH_W;\n    h += '\u003crect class=\"s-edge\" fill=\"' + U('gCyl') + '\" x=\"' + f(rx0) + '\" y=\"' + (AXIS_Y - 20) + '\" width=\"10\" height=\"40\"/>';\n    h += '\u003crect class=\"s-edge\" fill=\"' + U('gGrip') + '\" x=\"' + f(rx0 + 10) + '\" y=\"' + (AXIS_Y - 30) + '\" width=\"' + (RAT_W - 10) + '\" height=\"60\" rx=\"8\"/>';\n    for (let i = 0; i \u003c 7; i++) {\n      const yy = AXIS_Y - 24 + i * 8 + (frac * 1.3) % 8;\n      if (yy > AXIS_Y + 26) continue;\n      h += '\u003cline x1=\"' + f(rx0 + 13) + '\" y1=\"' + f(yy) + '\" x2=\"' + f(rx0 + RAT_W - 3) + '\" y2=\"' + f(yy) + '\" stroke=\"var(--knurl)\" stroke-width=\"1.6\"/>';\n    }\n    h += '\u003c/g>';\n    h += '\u003ctext class=\"s-muted\" x=\"' + f(tE + TH_W / 2) + '\" y=\"' + (TH_BOT + 22) + '\" text-anchor=\"middle\">심블\u003c/text>';\n    h += '\u003ctext class=\"s-muted\" x=\"' + f(rx0 + RAT_W / 2 + 5) + '\" y=\"' + (AXIS_Y + 50) + '\" text-anchor=\"middle\">래칫\u003c/text>';\n\n    gDyn.innerHTML = h;\n    const kp = svg.querySelector('#' + ID + '-knurl');\n    if (kp) kp.setAttribute('patternTransform', 'translate(' + f(tE) + ' ' + f(-(frac * PX_PER_DIV) % 6) + ')');\n\n    // 확대 창(항상 표시): 심블 앞단 주변(슬리브 눈금 + 기선 + 심블 눈금이 한 곳에서 읽힘)\n    // 좁은 화면(휴대폰)에서는 범위를 좁혀 더 크게 보이게 한다.\n    const narrow = isNarrow();\n    svg.setAttribute('viewBox', narrow ? '0 54 935 282' : (VB_X + ' ' + VB_Y + ' ' + VB_W + ' ' + VB_H));\n    {\n      if (narrow) zSvg.setAttribute('viewBox', f(tE - 128) + ' ' + (AXIS_Y - 61) + ' 190 122');\n      else zSvg.setAttribute('viewBox', f(tE - 196) + ' ' + (AXIS_Y - 61) + ' 280 122');\n      zSvg.innerHTML = h;\n    }\n  }\n\n  function reveal() {\n    const a = answer(p);\n    ans.innerHTML = '\u003cdiv class=\"gw-value\">' + a.valueStr + ' mm\u003c/div>\u003cdiv>' + a.text + '\u003c/div>' +\n      '\u003cdiv class=\"gw-hint\">이 내측마이크로미터는 눈금이 반대 방향입니다. 심블이 오른쪽(5)부터 눈금을 덮어 가므로, 심블 앞단 바로 왼쪽에 보이는 1mm 눈금에서 1을 빼고, ' +\n      '그 오른쪽 0.5mm 눈금(기선 아래)이 가려졌으면 0.5를 더한 뒤 심블 눈금을 더하세요.\u003c/div>';\n    ans.classList.toggle('open');\n    if (ans.classList.contains('open') && ans.getBoundingClientRect && ans.scrollIntoView) {\n      const r = ans.getBoundingClientRect();\n      const vh = window.innerHeight || document.documentElement.clientHeight;\n      if (r.bottom > vh || r.top \u003c 0) ans.scrollIntoView({ block: 'nearest', behavior: 'smooth' });\n    }\n  }\n  function newProblem() {\n    const s = randomState();\n    setState(s);\n    lastP = p;\n  }\n\n  window.GaugeWidget = { id: ID, title: TITLE, mount: mount, newProblem: newProblem, reveal: reveal,\n                         answer: answer, readParts: readParts, boundaryPool: BOUNDARY_POOL,\n                         _set: function (s) { setState(s); } };\n  document.addEventListener('DOMContentLoaded', function () {\n    const r = document.getElementById('gw-root');\n    if (r) mount(r);\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","dial":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>다이얼게이지 눈금읽기\u003c/title>\n\u003cstyle>\n  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#0969da; --ok:#1a7f37;\n          --face:#fbfbf7; --tick:#1f2328; --needle:#c8202c; --small:#1f2328; }\n  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#4493f8; --ok:#3fb950;\n          --face:#f3f3ee; --tick:#1f2328; --needle:#c8202c; --small:#1f2328; } }\n  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, \"Malgun Gothic\", sans-serif; }\n  .dial-wrap { max-width:520px; margin:0 auto; }\n  .dial-wrap h2 { margin:0 0 4px; font-size:1.25em; }\n  .dial-help { color:var(--muted); font-size:.9em; margin:0 0 8px; }\n  .dial-note { color:var(--muted); font-size:.85em; margin:0 0 6px; padding:4px 10px; border-left:3px solid var(--accent); }\n  .dial-note summary { cursor:pointer; color:var(--fg); font-weight:600; }\n  .dial-note p { margin:4px 0 2px; }\n  /* 그림 크기는 폭(viewBox 비율)으로 정한다. 높이 상한은 '보조'로만 쓴다:\n     - svh(주소창 제외 높이) 우선, 미지원 브라우저는 vh 대체\n     - max(300px, …)로 하한을 둬서 낮은 iframe/가로 화면에서 그림이 과하게 줄지 않게 함\n     폭은 100%지만 viewBox(meet)로 그림은 가운데 정렬·비율 유지 */\n  .gw-svg { width:100%; height:auto; aspect-ratio:400/560; touch-action:none; user-select:none; -webkit-user-select:none; display:block; margin:0 auto;\n            max-height:max(300px, calc(100vh - 190px)); }\n  @supports (height:100svh) { .gw-svg { max-height:max(300px, calc(100svh - 190px)); } }\n  @media (min-width:481px) {   /* 넓은 화면: 제목·안내문이 길어지는 만큼 여유를 더 둠 */\n    .gw-svg { max-height:max(280px, calc(100vh - 250px)); }\n    @supports (height:100svh) { .gw-svg { max-height:max(280px, calc(100svh - 250px)); } }\n  }\n  @media (max-width:480px) {\n    body { padding:10px 10px 16px; }\n    .dial-wrap h2 { font-size:1.1em; }\n    .dial-help { font-size:.82em; margin-bottom:4px; line-height:1.4; }\n    .gw-bar { margin:8px 0; gap:6px; }\n    button { padding:8px 12px; }\n    .gw-opt button { padding:6px 9px; }\n  }\n  .gw-svg .dial-grab { cursor:grab; }\n  .gw-svg.dragging .dial-grab { cursor:grabbing; }\n  .gw-svg:focus { outline:2px solid var(--accent); outline-offset:2px; border-radius:8px; }\n  .gw-bar { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; align-items:center; }\n  .gw-opt { display:flex; gap:6px; align-items:center; font-size:.9em; color:var(--muted); flex-wrap:wrap; }\n  .gw-opt button { padding:6px 10px; }\n  button { font:inherit; padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); cursor:pointer; }\n  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }\n  button[aria-pressed=\"true\"] { border-color:var(--accent); color:var(--accent); font-weight:600; }\n  .gw-answer { display:none; padding:12px; border:1px solid var(--ok); border-radius:8px; }\n  .gw-answer.open { display:block; }\n  .gw-value { font-size:1.6em; font-weight:700; color:var(--ok); }\n  .dial-warn { margin-top:6px; font-size:.92em; color:var(--muted); }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"gw-root\">\u003c/div>\n\u003cscript>\n(function () {\n  const ID = 'dial';\n  const TITLE = '다이얼게이지';\n  const NS = 'http://www.w3.org/2000/svg';\n  const P = ID + '-';                       // SVG defs/DOM id 접두어(병합 시 충돌 방지)\n\n  // ---- 상태: 정수 s (단위 1/100 mm), 0 ~ 999 ----\n  // 10.00mm는 작은 바늘이 0 위치로 돌아가 0.00과 그림이 같아지므로 범위에서 제외(QA F1)\n  const STATE_MIN = 0, STATE_MAX = 999;\n  const BOUNDARY_POOL = [0, 99, 100, 101, 199, 200];\n  let state = 0;\n  let smallContinuous = true;    // smallNeedleMotion: 기본 'continuous'(실제 계기와 같음), 'step'은 선택 옵션\n  let zoomed = false;\n\n  // ---- 기하 ----\n  const CX = 200, CY = 250;\n  const R_OUT = 186;            // 베젤 바깥(널링)\n  const R_KNURL_IN = 175;       // 널링 띠 안쪽\n  const R_BEZEL_IN = 169;       // 베젤 안쪽 경사면\n  const R_FACE = 164;           // 눈금판\n  const R_TICK = 158;           // 눈금선 바깥 끝\n  const SCX = 200, SCY = CY + 80, SR = 38;       // 작은 다이얼(회전계): 하단, 큰 바늘보다 위 레이어(QA W1)\n  const VB_W = 400, VB_H = 560, Z_W = 160, Z_H = 224;   // 확대 시야도 같은 5:7 비율(높이 고정)\n  const SPINDLE_PER_S = 0.025;  // 스핀들 들어감(그림 단위/0.01mm), 장식\n\n  // ---- 명세 함수: 상태 → 정답 (정수 연산, 표시 단계에서만 문자열) ----\n  function answer(s) {\n    const A = Math.floor(s / 100);\n    const n = s % 100;\n    const str = A + '.' + String(n).padStart(2, '0');\n    let note = '';\n    if (smallContinuous && n >= 90) {\n      const nextLbl = (A + 1) === 10 ? '0(10)' : String(A + 1);\n      const wrong = (A + 1) + '.' + String(n).padStart(2, '0');\n      note = '주의: 작은 바늘이 ' + nextLbl + '에 거의 닿아 있지만 큰 바늘이 아직 0을 지나지 않았으므로 ' +\n             A + 'mm로 읽습니다(' + wrong + 'mm로 읽으면 1mm 틀림).';\n    } else if (smallContinuous && n \u003c= 10 && A >= 1) {\n      note = '참고: 큰 바늘이 0을 막 지나 작은 바늘이 숫자 ' + A + ' 위치를 조금 넘었습니다 → ' + A + 'mm로 읽습니다.';\n    }\n    return {\n      s: s, A: A, n: n, valueText: str, note: note,\n      text: '작은 바늘 ' + A + 'mm + 큰 바늘 ' + n + '눈금 × 0.01 = ' + str + 'mm'\n    };\n  }\n  function bigAngle(s) { return (s % 100) * 3.6; }\n  function smallAngle(s) { return smallContinuous ? (s / 100) * 36 : Math.floor(s / 100) * 36; }\n\n  let lastProblem = -1;\n  function randomState() {\n    let s;\n    do {\n      if (Math.random() \u003c 0.2) s = BOUNDARY_POOL[Math.floor(Math.random() * BOUNDARY_POOL.length)];\n      else s = STATE_MIN + Math.floor(Math.random() * (STATE_MAX - STATE_MIN + 1));\n    } while (s === lastProblem);\n    lastProblem = s;\n    return s;\n  }\n\n  // ---- SVG 도우미 ----\n  function el(tag, attrs, parent) {\n    const e = document.createElementNS(NS, tag);\n    for (const k in attrs) e.setAttribute(k, attrs[k]);\n    if (parent) parent.appendChild(e);\n    return e;\n  }\n  function polar(cx, cy, r, deg) {          // deg: 12시 기준 시계방향\n    const rad = deg * Math.PI / 180;\n    return [cx + r * Math.sin(rad), cy - r * Math.cos(rad)];\n  }\n  function grad(defs, tag, id, attrs, stops) {\n    const g = el(tag, Object.assign({ id: P + id }, attrs), defs);\n    stops.forEach(function (st) {\n      el('stop', { offset: st[0], 'stop-color': st[1], 'stop-opacity': st[2] === undefined ? 1 : st[2] }, g);\n    });\n    return g;\n  }\n  function url(id) { return 'url(#' + P + id + ')'; }\n\n  let root, svg, ans, bigNeedle, smallNeedle, spindle, inset, zoomBtn, contBtn, stepBtn;\n\n  function buildDefs() {\n    const d = el('defs', {}, svg);\n    // 원통(스템·캡·스핀들): 좌우 방향 크롬 반사\n    grad(d, 'linearGradient', 'gCyl', { x1: 0, y1: 0, x2: 1, y2: 0 },\n      [[0, '#4d545c'], [.22, '#b9c0c7'], [.42, '#f6f8fa'], [.62, '#c3c9cf'], [.85, '#6d757e'], [1, '#3f454c']]);\n    // 베젤(널링 링): 대각 금속\n    grad(d, 'linearGradient', 'gBezel', { x1: 0, y1: 0, x2: 1, y2: 1 },\n      [[0, '#f4f6f8'], [.3, '#c2c8cf'], [.55, '#7b838c'], [.8, '#b5bcc4'], [1, '#e6e9ec']]);\n    // 베젤 안쪽 경사면: 반대 방향(오목하게 보이게)\n    grad(d, 'linearGradient', 'gBevel', { x1: 0, y1: 0, x2: 1, y2: 1 },\n      [[0, '#6a727b'], [.5, '#aeb5bd'], [1, '#f1f3f5']]);\n    // 눈금판\n    grad(d, 'radialGradient', 'gFace', { cx: .5, cy: .45, r: .6 },\n      [[0, '#ffffff'], [.75, '#f8f7f2'], [1, '#e7e5dc']]);\n    // 눈금판 가장자리 그림자(베젤 아래로 들어간 느낌)\n    grad(d, 'radialGradient', 'gEdge', { cx: .5, cy: .5, r: .5 },\n      [[0, '#000', 0], [.9, '#000', 0], [1, '#000', .22]]);\n    // 유리\n    grad(d, 'linearGradient', 'gGlass', { x1: 0, y1: 0, x2: 1, y2: 1 },\n      [[0, '#ffffff', .26], [.32, '#ffffff', .07], [.5, '#ffffff', 0], [.85, '#000000', 0], [1, '#000000', .07]]);\n    grad(d, 'radialGradient', 'gGlint', { cx: .5, cy: .5, r: .5 },\n      [[0, '#ffffff', .38], [1, '#ffffff', 0]]);\n    // 바늘 허브 캡\n    grad(d, 'radialGradient', 'gHub', { cx: .35, cy: .32, r: .7 },\n      [[0, '#ffffff'], [.45, '#b4bbc2'], [1, '#4b525a']]);\n    // 접촉자(초경 볼)\n    grad(d, 'radialGradient', 'gBall', { cx: .35, cy: .3, r: .75 },\n      [[0, '#f0f0f0'], [.35, '#8a9097'], [1, '#202428']]);\n    // 뒷판 러그\n    grad(d, 'linearGradient', 'gLug', { x1: 0, y1: 0, x2: 1, y2: 0 },\n      [[0, '#5b636b'], [.35, '#c7cdd3'], [.6, '#9aa2aa'], [1, '#4a5158']]);\n    const f = el('filter', { id: P + 'fShadow', x: '-50%', y: '-50%', width: '200%', height: '200%' }, d);\n    el('feDropShadow', { dx: 1.6, dy: 2.2, stdDeviation: 1.3, 'flood-color': '#000', 'flood-opacity': .35 }, f);\n    const f2 = el('filter', { id: P + 'fCase', x: '-20%', y: '-20%', width: '140%', height: '140%' }, d);\n    el('feDropShadow', { dx: 0, dy: 4, stdDeviation: 4, 'flood-color': '#000', 'flood-opacity': .35 }, f2);\n    const cp = el('clipPath', { id: P + 'cFace' }, d);\n    el('circle', { cx: CX, cy: CY, r: R_FACE }, cp);\n  }\n\n  function buildSvg() {\n    svg.innerHTML = '';\n    buildDefs();\n\n    // --- 뒷판 러그(케이스 뒤, 위로 튀어나온 귀 + 구멍) ---\n    const lugW = 66, lugTop = 4, lugBot = CY - R_OUT + 40, holeY = 30, holeR = 9;\n    const lx = CX - lugW / 2, rr = lugW / 2;\n    const lugPath =\n      'M' + lx + ' ' + lugBot + ' V' + (lugTop + rr) +\n      ' A' + rr + ' ' + rr + ' 0 0 1 ' + (lx + lugW) + ' ' + (lugTop + rr) +\n      ' V' + lugBot + ' Z' +\n      ' M' + (CX - holeR) + ' ' + holeY + ' A' + holeR + ' ' + holeR + ' 0 1 0 ' + (CX + holeR) + ' ' + holeY +\n      ' A' + holeR + ' ' + holeR + ' 0 1 0 ' + (CX - holeR) + ' ' + holeY + ' Z';\n    el('path', { d: lugPath, 'fill-rule': 'evenodd', fill: url('gLug'), stroke: '#3d434a', 'stroke-width': 1 }, svg);\n    el('circle', { cx: CX, cy: holeY, r: holeR + 2.5, fill: 'none', stroke: '#e3e7eb', 'stroke-opacity': .5, 'stroke-width': 1 }, svg);\n\n    // --- 베젤 클램프(베젤 고정 나사, 7~8시 방향) ---\n    const clamp = el('g', { transform: 'rotate(236 ' + CX + ' ' + CY + ')' }, svg);\n    el('rect', { x: CX - 6, y: CY - R_OUT - 12, width: 12, height: 18, fill: url('gCyl'), stroke: '#3d434a', 'stroke-width': .8 }, clamp);\n    el('rect', { x: CX - 11, y: CY - R_OUT - 26, width: 22, height: 15, rx: 3, fill: url('gCyl'), stroke: '#3d434a', 'stroke-width': .8 }, clamp);\n    for (let i = -8; i \u003c= 8; i += 2.6) {\n      el('line', { x1: CX + i, y1: CY - R_OUT - 25, x2: CX + i, y2: CY - R_OUT - 12, stroke: '#3d434a', 'stroke-opacity': .45, 'stroke-width': .7 }, clamp);\n    }\n\n    // --- 스핀들 + 접촉자 (스템 뒤에 그려서 s가 커지면 스템 속으로 들어가 보임) ---\n    spindle = el('g', {}, svg);\n    el('rect', { x: CX - 6, y: CY + R_OUT + 20, width: 12, height: 72, fill: url('gCyl'), stroke: '#3d434a', 'stroke-width': .8 }, spindle);\n    const tipTop = CY + R_OUT + 92;             // 접촉자 몸통(육각 느낌의 사다리꼴) + 볼\n    el('path', { d: 'M' + (CX - 8) + ' ' + tipTop + ' H' + (CX + 8) + ' L' + (CX + 6) + ' ' + (tipTop + 12) + ' H' + (CX - 6) + ' Z',\n      fill: url('gCyl'), stroke: '#3d434a', 'stroke-width': .8 }, spindle);\n    el('circle', { cx: CX, cy: tipTop + 18, r: 7, fill: url('gBall'), stroke: '#202428', 'stroke-width': .6 }, spindle);\n\n    // --- 스템(케이스 목 + 슬리브) ---\n    const neckTop = CY + R_OUT - 12, neckBot = CY + R_OUT + 30;\n    el('rect', { x: CX - 19, y: neckTop, width: 38, height: neckBot - neckTop, fill: url('gCyl'), stroke: '#3d434a', 'stroke-width': 1 }, svg);\n    el('rect', { x: CX - 21, y: neckBot - 4, width: 42, height: 6, rx: 1.5, fill: url('gCyl'), stroke: '#3d434a', 'stroke-width': .8 }, svg);\n    el('rect', { x: CX - 13, y: neckBot + 2, width: 26, height: 40, fill: url('gCyl'), stroke: '#3d434a', 'stroke-width': 1 }, svg);\n    el('rect', { x: CX - 14, y: neckBot + 38, width: 28, height: 5, rx: 1.5, fill: url('gCyl'), stroke: '#3d434a', 'stroke-width': .8 }, svg);\n\n    // --- 상단 캡(스핀들 윗끝 덮개) ---\n    el('rect', { x: CX - 14, y: CY - R_OUT - 18, width: 28, height: 26, rx: 4, fill: url('gCyl'), stroke: '#3d434a', 'stroke-width': 1 }, svg);\n\n    // --- 케이스/베젤 ---\n    el('circle', { cx: CX, cy: CY, r: R_OUT, fill: url('gBezel'), stroke: '#3d434a', 'stroke-width': 1.2, filter: url('fCase') }, svg);\n    const kn = el('g', { stroke: '#2f353b', 'stroke-opacity': .38, 'stroke-width': 1.1 }, svg);\n    for (let i = 0; i \u003c 144; i++) {           // 널링(미끄럼 방지 홈)\n      const p1 = polar(CX, CY, R_OUT - 1, i * 2.5), p2 = polar(CX, CY, R_KNURL_IN + 1, i * 2.5);\n      el('line', { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1] }, kn);\n    }\n    el('circle', { cx: CX, cy: CY, r: R_KNURL_IN, fill: url('gBevel'), stroke: '#3d434a', 'stroke-width': .8 }, svg);\n    el('circle', { cx: CX, cy: CY, r: R_BEZEL_IN, fill: url('gBezel'), stroke: 'none' }, svg);\n\n    // --- 눈금판 ---\n    el('circle', { cx: CX, cy: CY, r: R_FACE, fill: url('gFace'), stroke: '#4a5158', 'stroke-width': 1 }, svg);\n\n    // 큰 다이얼 눈금 0~99\n    const ticks = el('g', { stroke: 'var(--tick)', 'stroke-linecap': 'butt' }, svg);\n    for (let i = 0; i \u003c 100; i++) {\n      const deg = i * 3.6;\n      const len = i % 10 === 0 ? 18 : (i % 5 === 0 ? 13 : 8);\n      const w = i % 10 === 0 ? 2 : (i % 5 === 0 ? 1.4 : 0.9);\n      const p1 = polar(CX, CY, R_TICK, deg), p2 = polar(CX, CY, R_TICK - len, deg);\n      el('line', { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], 'stroke-width': w }, ticks);\n      if (i % 10 === 0) {\n        const t = polar(CX, CY, R_TICK - 31, deg);\n        const tx = el('text', { x: t[0], y: t[1], 'text-anchor': 'middle', 'dominant-baseline': 'central',\n          'font-size': 15, 'font-weight': 600, fill: 'var(--tick)', 'font-family': 'system-ui, sans-serif' }, svg);\n        tx.textContent = String(i);\n      }\n    }\n    el('circle', { cx: CX, cy: CY, r: R_TICK, fill: 'none', stroke: 'var(--tick)', 'stroke-width': .6 }, svg);\n    const unit = el('text', { x: CX, y: CY - 62, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 600, fill: '#3d434a',\n      'font-family': 'system-ui, sans-serif' }, svg);\n    unit.textContent = '0.01 mm';\n    const rev = el('text', { x: CX, y: CY - 47, 'text-anchor': 'middle', 'font-size': 9, fill: '#656d76',\n      'font-family': 'system-ui, sans-serif' }, svg);\n    rev.textContent = '1회전 = 1 mm';\n    el('circle', { cx: CX, cy: CY, r: R_FACE, fill: url('gEdge'), 'pointer-events': 'none' }, svg);\n\n    // --- 큰 바늘(가는 지침 + 꼬리 균형추) ---\n    bigNeedle = el('g', { id: P + 'big', filter: url('fShadow') }, svg);\n    el('polygon', { points: [\n        CX - 0.6, CY - R_TICK + 3, CX + 0.6, CY - R_TICK + 3,\n        CX + 2.6, CY - 8, CX + 2.2, CY + 22, CX - 2.2, CY + 22, CX - 2.6, CY - 8].join(' '),\n      fill: 'var(--needle)' }, bigNeedle);\n    el('circle', { cx: CX, cy: CY + 25, r: 6, fill: 'var(--needle)' }, bigNeedle);\n    el('circle', { cx: CX, cy: CY, r: 10, fill: url('gHub'), stroke: '#3d434a', 'stroke-width': .8, filter: url('fShadow') }, svg);\n    el('circle', { cx: CX, cy: CY, r: 2.6, fill: '#2f353b' }, svg);\n\n    // --- 작은 다이얼(회전계) 0~9 — 큰 바늘 위 레이어, 포인터는 통과 ---\n    const small = el('g', { id: P + 'small', 'pointer-events': 'none' }, svg);\n    el('circle', { cx: SCX, cy: SCY, r: SR + 3, fill: url('gBevel'), stroke: '#4a5158', 'stroke-width': .8 }, small);\n    el('circle', { cx: SCX, cy: SCY, r: SR, fill: '#ffffff', stroke: '#4a5158', 'stroke-width': .6 }, small);\n    const st = el('g', { stroke: 'var(--tick)' }, small);\n    for (let k = 0; k \u003c 20; k++) {             // 1mm 눈금 + 0.5mm 보조 눈금\n      const deg = k * 18, major = k % 2 === 0;\n      const p1 = polar(SCX, SCY, SR - 1, deg), p2 = polar(SCX, SCY, SR - (major ? 8 : 4), deg);\n      el('line', { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], 'stroke-width': major ? 1.5 : 0.8 }, st);\n      if (major) {\n        const t = polar(SCX, SCY, SR - 16, deg);\n        const tx = el('text', { x: t[0], y: t[1], 'text-anchor': 'middle', 'dominant-baseline': 'central',\n          'font-size': 10, 'font-weight': 600, fill: 'var(--tick)', 'font-family': 'system-ui, sans-serif' }, small);\n        tx.textContent = String(k / 2);\n      }\n    }\n    const mmLbl = el('text', { x: SCX, y: SCY + 15, 'text-anchor': 'middle', 'font-size': 7, fill: '#57606a',\n      'font-family': 'system-ui, sans-serif' }, small);\n    mmLbl.textContent = 'mm';\n    smallNeedle = el('g', { id: P + 'smallneedle' }, small);\n    el('polygon', { points: [SCX - 2, SCY + 7, SCX + 2, SCY + 7, SCX + 0.55, SCY - SR + 4, SCX - 0.55, SCY - SR + 4].join(' '),\n      fill: 'var(--small)' }, smallNeedle);\n    el('circle', { cx: SCX, cy: SCY, r: 3.6, fill: url('gHub'), stroke: '#2f353b', 'stroke-width': .6 }, small);\n\n    // --- 유리(반사광) — 그림만, 포인터 통과 ---\n    const glass = el('g', { 'clip-path': url('cFace'), 'pointer-events': 'none' }, svg);\n    el('circle', { cx: CX, cy: CY, r: R_FACE, fill: url('gGlass') }, glass);\n    el('ellipse', { cx: CX - 62, cy: CY - 92, rx: 92, ry: 26, fill: url('gGlint'), transform: 'rotate(-32 ' + (CX - 62) + ' ' + (CY - 92) + ')' }, glass);\n    el('circle', { cx: CX, cy: CY, r: R_FACE - 1.5, fill: 'none', stroke: '#ffffff', 'stroke-opacity': .35, 'stroke-width': 1.2 }, glass);\n\n    // 드래그 영역 (베젤 전체)\n    el('circle', { class: 'dial-grab', cx: CX, cy: CY, r: R_OUT, fill: 'transparent' }, svg);\n\n    // 확대 시 작은 다이얼 축소 인셋 (같은 그림을 \u003cuse>로 재사용)\n    inset = el('g', { 'pointer-events': 'none', display: 'none' }, svg);\n    el('circle', { cx: SCX, cy: SCY, r: SR + 5, fill: '#ffffff', stroke: 'var(--accent)', 'stroke-width': 2 }, inset);\n    el('use', { href: '#' + P + 'small' }, inset);\n  }\n\n  function setViewBox() {\n    if (!zoomed) {\n      svg.setAttribute('viewBox', '0 0 ' + VB_W + ' ' + VB_H);\n      inset.setAttribute('display', 'none');\n      return;\n    }\n    // 큰 바늘 끝 주변 확대 (전체 화면과 같은 비율 → SVG 높이 불변)\n    const tip = polar(CX, CY, R_TICK - 12, bigAngle(state));\n    const x0 = tip[0] - Z_W / 2, y0 = tip[1] - Z_H / 2;\n    svg.setAttribute('viewBox', x0 + ' ' + y0 + ' ' + Z_W + ' ' + Z_H);\n    // 인셋: 시야 왼쪽 위 모서리에 작은 다이얼 축소본\n    const k = 0.6, r = (SR + 5) * k;\n    inset.setAttribute('transform', 'translate(' + (x0 + r + 4) + ' ' + (y0 + r + 4) + ') scale(' + k + ') translate(' + (-SCX) + ' ' + (-SCY) + ')');\n    inset.setAttribute('display', 'inline');\n  }\n\n  function draw() {\n    bigNeedle.setAttribute('transform', 'rotate(' + bigAngle(state) + ' ' + CX + ' ' + CY + ')');\n    smallNeedle.setAttribute('transform', 'rotate(' + smallAngle(state) + ' ' + SCX + ' ' + SCY + ')');\n    spindle.setAttribute('transform', 'translate(0 ' + (-state * SPINDLE_PER_S) + ')');\n    if (zoomed && !drag) setViewBox();   // 드래그 중에는 시야 고정(좌표 되먹임 방지), 놓으면 바늘 끝으로 이동\n  }\n\n  // ---- 드래그: 누적 각 방식 (99↔0 래핑 처리) ----\n  let drag = null;\n  function pointerAngle(evt) {\n    const pt = svg.createSVGPoint();\n    pt.x = evt.clientX; pt.y = evt.clientY;\n    const p = pt.matrixTransform(svg.getScreenCTM().inverse());\n    let deg = Math.atan2(p.x - CX, -(p.y - CY)) * 180 / Math.PI;   // 12시 기준 시계방향\n    if (deg \u003c 0) deg += 360;\n    return deg;\n  }\n  function bindDrag(target) {\n    target.addEventListener('pointerdown', function (e) {\n      if (!e.target.classList || !e.target.classList.contains('dial-grab')) return;\n      e.preventDefault();\n      try { target.setPointerCapture(e.pointerId); } catch (_) { /* 비활성 포인터(합성 이벤트) */ }\n      drag = { id: e.pointerId, theta: pointerAngle(e), sReal: state };\n      svg.classList.add('dragging');\n      closeAnswer();\n    });\n    target.addEventListener('pointermove', function (e) {\n      if (!drag || e.pointerId !== drag.id) return;\n      const th = pointerAngle(e);\n      let d = th - drag.theta;\n      if (d > 180) d -= 360;\n      else if (d \u003c= -180) d += 360;\n      drag.theta = th;\n      drag.sReal += d / 3.6;\n      if (drag.sReal \u003c STATE_MIN) drag.sReal = STATE_MIN;\n      if (drag.sReal > STATE_MAX) drag.sReal = STATE_MAX;\n      setState(Math.round(drag.sReal));\n    });\n    function end(e) {\n      if (!drag || e.pointerId !== drag.id) return;\n      drag = null;\n      svg.classList.remove('dragging');\n      if (zoomed) setViewBox();\n    }\n    target.addEventListener('pointerup', end);\n    target.addEventListener('pointercancel', end);\n    // 키보드: ←/→ 1눈금, Shift 10눈금\n    target.addEventListener('keydown', function (e) {\n      const step = e.shiftKey ? 10 : 1;\n      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { setState(state + step); e.preventDefault(); }\n      else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { setState(state - step); e.preven
