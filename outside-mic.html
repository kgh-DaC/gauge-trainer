<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>외측마이크로미터 눈금읽기</title>
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --accent:#0969da; --ok:#1a7f37; --warn:#9a6700; --panel:#f6f8fa; --stage:#e9edf1; --stage2:#dfe5ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#4493f8; --ok:#3fb950; --warn:#d29922; --panel:#161b22; --stage:#1a2028; --stage2:#141920; } }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, "Malgun Gothic", sans-serif; }
  .gw-wrap { max-width:1000px; margin:0 auto; overflow-wrap:anywhere; }
  .gw-wrap h2 { margin:0 0 6px; font-size:1.25em; line-height:1.3; }
  .gw-help { margin:0 0 8px; color:var(--muted); font-size:.9em; }
  .gw-mode { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 0 10px; padding:8px 10px; border:2px solid var(--accent); border-radius:10px; background:var(--panel); }
  .gw-mode-lab { font-weight:700; margin-right:4px; }
  .gw-seg { display:inline-flex; max-width:100%; border:1px solid var(--accent); border-radius:8px; overflow:hidden; }
  .gw-seg button { border:0; border-radius:0; padding:7px 14px; white-space:nowrap; }
  .gw-seg button + button { border-left:1px solid var(--accent); }
  .gw-seg button[aria-pressed="true"] { background:var(--accent); color:#fff; font-weight:700; }
  .gw-mode-note { color:var(--muted); font-size:.85em; }
  .gw-stage { border:1px solid var(--line); border-radius:10px; background:var(--stage); overflow:hidden; }
  .gw-svg { display:block; width:100%; height:auto; touch-action:none; user-select:none; -webkit-user-select:none; cursor:ns-resize; outline:none; }
  .gw-svg:focus-visible { box-shadow:inset 0 0 0 3px var(--accent); }
  .gw-zoombox { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-start; margin-top:8px; padding:8px; border:1px solid var(--line); border-radius:10px; background:var(--stage2); }
  .gw-zsvg { display:block; flex:0 1 440px; width:100%; max-width:440px; height:auto; touch-action:none; user-select:none; -webkit-user-select:none; cursor:ns-resize; border:1px solid var(--line); border-radius:8px; outline:none; }
  .gw-zsvg:focus-visible { box-shadow:0 0 0 3px var(--accent); }
  .gw-zcap { flex:1 1 220px; font-size:.9em; color:var(--muted); }
  .gw-zcap b { color:var(--fg); }
  .gw-zcap p { margin:0 0 6px; }
  .gw-bar { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; align-items:center; }
  button { font:inherit; padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:transparent; color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .gw-answer { display:none; padding:12px; border:1px solid var(--ok); border-radius:8px; background:var(--panel); }
  .gw-answer.open { display:block; }
  .gw-value { font-size:1.6em; font-weight:700; color:var(--ok); }
  .gw-hint { margin-top:6px; color:var(--warn); font-size:.95em; }
  /* 휴대폰 세로 화면: 확대 창이 주 읽기 화면, 메인 그림은 보조(위쪽 개요) */
  @media (max-width: 640px) {
    body { padding:10px; font-size:15px; }
    .gw-wrap h2 { font-size:1.08em; }
    .gw-help { font-size:.82em; }
    .gw-mode { padding:6px 8px; gap:6px; }
    .gw-mode-lab { width:100%; }
    .gw-seg { width:100%; }
    .gw-seg button { flex:1 1 50%; padding:8px 6px; font-size:.92em; }
    .gw-mode-note { display:none; }
    .gw-zoombox { padding:6px; gap:6px; }
    .gw-zsvg { flex:1 1 100%; max-width:none; }
    .gw-zcap { font-size:.82em; }
    .gw-bar button { flex:1 1 40%; }
  }
</style>
</head>
<body>
<div id="gw-root"></div>
<script>
(function () {
  const ID = 'outside-mic';
  const TITLE = '외측마이크로미터';

  // <calc> ---- 정수 연산만 사용 ----
  // 상태 q = 심블 앞단 위치, 단위 1/1000 mm(정수), 0~25000.
  // 일반 모드(0.01mm)에서는 q가 항상 10의 배수, 버니어 모드(0.001mm)에서는 1 단위.
  const Q_MIN = 0, Q_MAX = 25000;
  const MODE_INFO = {
    normal:  { step: 10, res: '0.01mm',  label: '일반 0.01mm' },
    vernier: { step: 1,  res: '0.001mm', label: '버니어 0.001mm' }
  };
  let mode = 'normal';                      // 기본: 일반 모드

  function stepOf(m) { return m === 'vernier' ? 1 : 10; }
  function snapQ(v, m) {
    const s = stepOf(m || mode);
    const c = Math.max(Q_MIN, Math.min(Q_MAX, Math.round(v)));
    return Math.round(c / s) * s;           // Q_MAX(25000)는 10의 배수라 범위를 넘지 않음
  }

  function readParts(q) {
    const sleeveMm = Math.floor(q / 1000);            // 노출된 마지막 1mm 눈금
    const half = Math.floor(q / 500) % 2;             // 0.5mm 눈금 노출 여부
    const thimble = Math.floor((q % 500) / 10);       // 기선을 지난 심블 눈금(0~49)
    const vernier = q % 10;                           // 일치하는 부척 선 번호(0~9, 0은 10과 동시 일치)
    return { q: q, sleeveMm: sleeveMm, half: half, thimble: thimble, vernier: vernier,
             check: (sleeveMm * 1000 + half * 500 + thimble * 10 + vernier) === q };
  }

  function formatQ(q, m) {                  // 문자열 변환만 사용 (부동소수점 나눗셈 없음)
    const ip = Math.floor(q / 1000), fp = q % 1000;
    if (m === 'vernier') return ip + '.' + String(fp).padStart(3, '0');
    return ip + '.' + String(Math.floor(fp / 10)).padStart(2, '0');
  }

  function answer(q, m) {
    m = (m === 'vernier' || m === 'normal') ? m : mode;
    if (m === 'normal' && q % 10 !== 0) q = snapQ(q, 'normal');
    const r = readParts(q);
    const value = formatQ(q, m);
    const H = r.half ? '0.5' : '0';
    let text = '슬리브 ' + r.sleeveMm + 'mm + ' + H + 'mm + 심블 ' + r.thimble + '×0.01mm';
    if (m === 'vernier') text += ' + 버니어 ' + r.vernier + '×0.001mm';
    text += ' = ' + value + 'mm';
    return {
      q: q, mode: m, um: q, parts: r, value: value, display: value + ' mm', text: text,
      A: r.sleeveMm, half: r.half, n: r.thimble, k: r.vernier,
      nearHalf: (r.thimble >= 45 || r.thimble <= 5),
      vernierZero: (m === 'vernier' && r.vernier === 0),
      check: r.check
    };
  }

  const BOUNDARY_POOLS = (function () {
    const normal = [], vernier = [];
    const nSet = { 0: 1, 1: 1, 2: 1, 47: 1, 48: 1, 49: 1 };                 // 심블 눈금(0.01mm) 기준
    const vSet = { 0: 1, 1: 1, 2: 1, 9: 1, 10: 1, 490: 1, 491: 1, 495: 1, 498: 1, 499: 1 }; // q mod 500 기준
    for (let q = Q_MIN; q <= Q_MAX; q++) {
      if (q % 10 === 0 && nSet[(q / 10) % 50]) normal.push(q);
      if (vSet[q % 500]) vernier.push(q);
    }
    return { normal: normal, vernier: vernier };
  })();

  function randomQ(prev, m, rnd) {
    rnd = rnd || Math.random;
    m = m || mode;
    const s = stepOf(m), pool = BOUNDARY_POOLS[m];
    let q;
    do {
      if (rnd() < 0.4) q = pool[Math.floor(rnd() * pool.length)];
      else q = Q_MIN + s * Math.floor(rnd() * ((Q_MAX - Q_MIN) / s + 1));
    } while (q === prev);
    return q;
  }
  // </calc>

  // ---- 메인 그림 기하 (viewBox 단위) ----
  const NS = 'http://www.w3.org/2000/svg';
  const VB_W = 1200;
  const BY = 190;            // 슬리브 기선 y
  const X0 = 404;            // 슬리브 0mm 눈금 x
  const S = 24;              // 1mm 당 길이
  const SL_H = 62;           // 슬리브 반높이
  const TH_H = 76;           // 심블 반높이
  const R = 66;              // 눈금 투영 반지름 (심블 눈금선과 부척 선이 같은 투영을 쓴다)
  const BEV = 10, TH_W = 170, TH_PLAIN = 82;   // 심블 전체 길이, 눈금(매끈한) 부분 길이(그 뒤는 널링)
  const ANVIL_X = 140, GAP_S = 6;   // 앤빌 측정면 x, 측정 간격 표시 배율(1mm = 6, 축소 표시)
  const BOSS_R = 300, SLV_X = 372;
  const U10 = 0.72 * Math.PI / 180;  // 심블 1/10 눈금(= 버니어 1칸 차이)의 각도
  const FULL_VB = [36, 92, 1204, 376];
  // 슬리브 어미자 눈금: 모두 기선 아래쪽(5mm 배수 > 1mm > 0.5mm 순으로 길다)
  const SL_TK = { five: 20, mm: 15, half: 8, num: 35 };
  // 학교 로고(data URI, 빌드 스크립트로 주입). 312x312 jpg 중 위쪽 엠블럼만 잘라 쓴다.

    stops.forEach(function (s) { el('stop', { offset: s[0], 'stop-color': s[1] }, g); });
    return 'url(#' + ID + '-' + id + ')';
  }
  const FONT = 'system-ui, "Malgun Gothic", sans-serif';

  // ---- 고정 그림: U자 프레임, 단열 패드, 앤빌, 클램프, 슬리브 ----

    const defs = el('defs', {}, svg);

      thm: grad(defs, 'thm', [['0', '#8b959f'], ['0.2', '#d3d9df'], ['0.45', '#f7f9fa'], ['0.62', '#e6eaee'], ['0.88', '#aab3bb'], ['1', '#78838d']]),

      panel: grad(defs, 'panel', [['0', '#3f739f'], ['1', '#5a8fbb']], 0, 1),

      carb: grad(defs, 'carb', [['0', '#4b525a'], ['0.5', '#8d959d'], ['1', '#3f454c']])

    // 널링 위에 덮는 원통 음영(가운데 밝고 위·아래 어둡게)

    const blur = el('filter', { id: ID + '-blur', x: '-20%', y: '-50%', width: '140%', height: '200%' }, defs);

    el('rect', { x: 0, y: 0, width: VB_W + 100, height: 600, style: 'fill:var(--stage)' }, svg);

    svg._spindle = el('g', {}, svg);

      ' L130 ' + Y(30) + ' C130 ' + Y(100) + ' 165 ' + Y(118) + ' 215 ' + Y(118) + ' C262 ' + Y(118) + ' 298 ' + Y(100) + ' 300 ' + Y(45) +
      ' L300 ' + Y(-50) + ' Q300 ' + Y(-60) + ' 310 ' + Y(-60) + ' L362 ' + Y(-60) + ' Q372 ' + Y(-60) + ' 372 ' + Y(-50) +
      ' L372 ' + Y(60) + ' C372 ' + Y(205) + ' 312 ' + Y(262) + ' 215 ' + Y(262) + ' C118 ' + Y(262) + ' 58 ' + Y(205) + ' 58 ' + Y(60) + ' Z';
    el('path', { d: FRAME_D, fill: svg._g.frame, stroke: '#1d3a52', 'stroke-width': 1.6 }, svg);
    el('path', { d: FRAME_D, fill: '#808080', filter: 'url(#' + ID + '-ham)', opacity: 0.5, style: 'mix-blend-mode:multiply' }, svg);
    // 앞면 가운데의 오목한 면(가장자리 테두리가 도드라져 보이게)
    const PANEL_D =
      'M74 ' + Y(30) + ' C74 ' + Y(192) + ' 132 ' + Y(246) + ' 215 ' + Y(246) + ' C298 ' + Y(246) + ' 356 ' + Y(192) + ' 356 ' + Y(30) +
      ' L316 ' + Y(40) + ' C314 ' + Y(112) + ' 272 ' + Y(134) + ' 215 ' + Y(134) + ' C158 ' + Y(134) + ' 114 ' + Y(112) + ' 114 ' + Y(30) + ' Z';
    el('path', { d: PANEL_D, fill: svg._g.panel, 'fill-opacity': 0.55, stroke: '#1f4364', 'stroke-width': 1.4, 'stroke-opacity': 0.8 }, svg);
    el('path', { d: 'M80 ' + Y(40) + ' C82 ' + Y(190) + ' 136 ' + Y(240) + ' 215 ' + Y(240), stroke: '#ffffff', 'stroke-opacity': 0.14, 'stroke-width': 2.5, fill: 'none' }, svg);
    el('path', { d: 'M64 ' + Y(-40) + ' L124 ' + Y(-40) + ' M306 ' + Y(-54) + ' L366 ' + Y(-54), stroke: '#ffffff', 'stroke-opacity': 0.4, 'stroke-width': 2, fill: 'none' }, svg);

    // 학교 명판: 엠블럼 + 학교·학과 이름 + 측정 범위/최소눈금 (눈금과 겹치지 않는 프레임 아래쪽 넓은 면)
    const PX = 215, PW = 168, PT = Y(142), PH = 92;
    el('rect', { x: PX - PW / 2, y: PT, width: PW, height: PH, rx: 16, fill: svg._g.plate, stroke: '#0a0c0e', 'stroke-width': 1.2 }, svg);
    el('rect', { x: PX - PW / 2 + 2, y: PT + 2, width: PW - 4, height: PH - 4, rx: 14, fill: 'none', stroke: '#ffffff', 'stroke-opacity': 0.18 }, svg);
    el('circle', { cx: PX, cy: PT + 20, r: 15.5, fill: '#ffffff', stroke: '#c9d3dc', 'stroke-width': 1 }, svg);
    const logo = el('svg', { x: PX - 13, y: PT + 7, width: 26, height: 26, viewBox: LOGO_CROP, preserveAspectRatio: 'xMidYMid meet' }, svg);
    const img = el('image', { x: 0, y: 0, width: 312, height: 312, href: LOGO_URI, preserveAspectRatio: 'none' }, logo);
    try { img.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', LOGO_URI); } catch (err) {}
    const s1 = el('text', { x: PX, y: PT + 52, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 700, fill: '#ffffff', 'font-family': FONT }, svg);
    s1.textContent = '한국폴리텍대학 광주캠퍼스';
    const s2 = el('text', { x: PX, y: PT + 67, 'text-anchor': 'middle', 'font-size': 11.5, 'font-weight': 600, fill: '#e6edf3', 'font-family': FONT, 'letter-spacing': 1 }, svg);
    s2.textContent = '기계시스템과';
    svg._frameTxt = el('text', { x: PX, y: PT + 83, 'text-anchor': 'middle', 'font-size': 10, fill: '#aeb8c2', 'font-family': FONT, 'letter-spacing': 0.4 }, svg);

    // 앤빌(초경 측정면)
    el('rect', { x: 124, y: BY - 13, width: ANVIL_X - 124, height: 26, fill: svg._g.cyl, stroke: '#5e6872' }, svg);
    el('rect', { x: ANVIL_X - 4, y: BY - 13, width: 4, height: 26, fill: svg._g.carb }, svg);

    el('rect', { x: SLV_X - 4, y: BY - SL_H - 4, width: 12, height: 2 * SL_H + 8, rx: 2, fill: svg._g.cyl, stroke: '#5e6872' }, slv);

    dyn = el('g', {}, svg);

    svg._zoneRect = el('rect', { x: 0, y: BY - 72, width: 10, height: 144, rx: 4, fill: 'none', stroke: '#0969da', 'stroke-width': 2, 'stroke-dasharray': '6 4' }, svg);

  function drawVernierMain() {
    const g = svg._vern; g.innerHTML = '';
    if (mode !== 'vernier') return;
    for (let j = 1; j <= 10; j++) {
      const y = yMain(9 * j);
      el('line', { class: 'vn-line', 'data-j': j, x1: SLV_X + 8, y1: y, x2: X0 + 25 * S + 30, y2: y, stroke: '#1d3550', 'stroke-width': 1.1 }, g);
    }
    for (let j = 0; j <= 10; j += 5) {        // 투영으로 위쪽 간격이 좁아 0·5·10만 표기(전체 번호는 확대 창)
      const t = el('text', { x: SLV_X + 10, y: yMain(9 * j) + 2.7, 'font-size': 7.5, 'font-weight': 700, fill: '#1d3550', 'font-family': FONT }, g);
      t.textContent = j;
    }
  }

  // 슬리브 눈금 노출 규칙(정수 비교): 눈금 위치 t(1/1000mm)가 t <= q 일 때만 보인다.
  function drawSleeveTicks() {
    const tg = svg._ticks, ng = svg._slvNums;
    tg.innerHTML = ''; ng.innerHTML = '';
    const edge = X0 + (q / 1000) * S;
    for (let k = 0; k <= 25; k++) {
      if (k * 1000 <= q) {
        const x = X0 + k * S;
        const major = k % 5 === 0;
        el('line', { class: 'sl-tick', 'data-t': k * 1000, x1: x, y1: BY, x2: x, y2: BY + (major ? SL_TK.five : SL_TK.mm), stroke: '#111418', 'stroke-width': 1.5 }, tg);
        if (major) {
          const near = edge - x < 10;
          const t = el('text', { x: near ? x - 2 : x, y: BY + SL_TK.num, 'text-anchor': near ? 'end' : 'middle', 'font-size': 13, 'font-weight': 700, fill: '#111418',
            stroke: '#eef1f4', 'stroke-width': 3, 'paint-order': 'stroke', 'font-family': FONT }, ng);
          t.textContent = k;
        }
      }
      if (k < 25 && k * 1000 + 500 <= q) {
        const xh = X0 + (k + 0.5) * S;
        el('line', { class: 'sl-tick', 'data-t': k * 1000 + 500, x1: xh, y1: BY, x2: xh, y2: BY + SL_TK.half, stroke: '#111418', 'stroke-width': 1.5 }, tg);
      }
    }
  }

  // ---- 상태 q만으로 움직이는 부분을 다시 그린다 ----
  function draw() {
    const edge = X0 + (q / 1000) * S;
    const xe = edge;
    svg._clipRect.setAttribute('width', edge);
    drawVernierMain();
    drawSleeveTicks();

    const sp = svg._spindle; sp.innerHTML = '';
    const face = ANVIL_X + (q / 1000) * GAP_S;
    el('rect', { x: face, y: BY - 13, width: BOSS_R + 6 - face, height: 26, fill: svg._g.cyl, stroke: '#5e6872' }, sp);
    el('rect', { x: face, y: BY - 13, width: 4, height: 26, fill: svg._g.carb }, sp);

    dyn.innerHTML = '';
    const G = svg._g;
    el('path', { d: 'M' + xe + ' ' + (BY - 64) + ' L' + (xe + BEV) + ' ' + (BY - TH_H) + ' L' + (xe + BEV) + ' ' + (BY + TH_H) + ' L' + xe + ' ' + (BY + 64) + ' Z',
      fill: G.thm, stroke: '#59636d', 'stroke-width': 1 }, dyn);
    el('rect', { x: xe + BEV, y: BY - TH_H, width: TH_PLAIN - BEV, height: 2 * TH_H, fill: G.thm, stroke: '#59636d', 'stroke-width': 1 }, dyn);
    // 널링 손잡이: 살짝 굵은 원통 + 다이아몬드 널링 + 원통 음영, 양 끝은 매끈한 띠
    const KX = xe + TH_PLAIN, KW = TH_W - TH_PLAIN;
    el('rect', { x: KX, y: BY - TH_H - 4, width: KW, height: 2 * TH_H + 8, rx: 4, fill: G.grip, stroke: '#3f4851' }, dyn);
    el('rect', { x: KX + 7, y: BY - TH_H - 3, width: KW - 14, height: 2 * TH_H + 6, fill: 'url(#' + ID + '-knurl)' }, dyn);
    el('rect', { x: KX, y: BY - TH_H - 4, width: KW, height: 2 * TH_H + 8, rx: 4, fill: G.kshade }, dyn);
    el('line', { x1: KX + 7, y1: BY - TH_H - 3, x2: KX + 7, y2: BY + TH_H + 3, stroke: '#3f4851', 'stroke-opacity': 0.6 }, dyn);
    el('line', { x1: KX + KW - 7, y1: BY - TH_H - 3, x2: KX + KW - 7, y2: BY + TH_H + 3, stroke: '#3f4851', 'stroke-opacity': 0.6 }, dyn);
    // 래칫: 목 + 세로 줄무늬 노브 + 둥근 끝
    el('rect', { x: xe + TH_W, y: BY - 24, width: 12, height: 48, fill: G.cyl, stroke: '#5e6872' }, dyn);
    el('rect', { x: xe + TH_W + 12, y: BY - 36, width: 36, height: 72, rx: 4, fill: G.ratch, stroke: '#4f5963' }, dyn);
    el('rect', { x: xe + TH_W + 14, y: BY - 35, width: 32, height: 70, fill: 'url(#' + ID + '-rib)' }, dyn);
    el('rect', { x: xe + TH_W + 12, y: BY - 36, width: 36, height: 72, rx: 4, fill: G.kshade, 'fill-opacity': 0.6 }, dyn);
    el('path', { d: 'M' + (xe + TH_W + 48) + ' ' + (BY - 30) + ' Q' + (xe + TH_W + 58) + ' ' + (BY - 30) + ' ' + (xe + TH_W + 58) + ' ' + BY +
      ' Q' + (xe + TH_W + 58) + ' ' + (BY + 30) + ' ' + (xe + TH_W + 48) + ' ' + (BY + 30) + ' Z', fill: G.cyl, stroke: '#5e6872' }, dyn);
    el('line', { x1: xe, y1: BY - 64, x2: xe, y2: BY + 64, stroke: '#4b5560', 'stroke-width': 1.2 }, dyn);

    // 심블 눈금: 값 v의 눈금은 (10v - r)×0.72° 위치 (r = q mod 500). 큰 값이 기선 위쪽.
    const r = q % 500, n = Math.floor(r / 10);
    for (let d = -13; d <= 14; d++) {
      const v = n + d;
      const u10 = 10 * v - r;
      if (Math.abs(u10 * 0.72) >= 84) continue;
      const vv = ((v % 50) + 50) % 50;
      const y = yMain(u10);
      const c = Math.cos(u10 * U10);
      const major = vv % 5 === 0;
      const op = (0.35 + 0.65 * c).toFixed(3);
      el('line', { class: 'th-line', 'data-v': vv, 'data-u10': u10, x1: xe, y1: y, x2: xe + (major ? 22 : 13), y2: y, stroke: '#111418', 'stroke-width': 1.2, 'stroke-opacity': op }, dyn);
      if (major) {
        const t = el('text', { transform: 'translate(' + (xe + 26) + ',' + y + ') scale(1,' + c.toFixed(3) + ')', y: 4.5, 'font-size': 13, 'font-weight': 700, fill: '#111418', 'fill-opacity': op, 'font-family': FONT }, dyn);
        t.textContent = vv;
      }
    }

    // 확대 창이 보여 주는 영역(점선)
    const zl = (ZEX / ZS) * S, zr = ((ZW - ZEX) / ZS) * S;
    svg._zoneRect.setAttribute('x', (edge - zl).toFixed(2));
    svg._zoneRect.setAttribute('width', (zl + zr).toFixed(2));
    drawZoom();
  }

  // ---- 확대 창: 기선 부근을 펼쳐 그림 (슬리브 1mm = 70, 심블 1눈금 = 36, 부척 1칸 = 32.4) ----
  function buildZoomStatic() {
    zsvg.innerHTML = '';
    const defs = el('defs', {}, zsvg);
    zsvg._gs = grad(defs, 'zslv', [['0', '#e2e7eb'], ['1', '#f4f6f8']], 1, 0);
    zsvg._gt = grad(defs, 'zthm', [['0', '#b9c1c9'], ['0.1', '#eef1f4'], ['0.7', '#e2e7eb'], ['1', '#c7ced5']], 1, 0);
    zdyn = el('g', {}, zsvg);
  }

  function drawZoom() {
    if (!zdyn) return;
    const geo = ZGEO[mode], H = geo.H, Y0 = geo.Y0;
    zsvg.setAttribute('viewBox', '0 0 ' + ZW + ' ' + H);
    const g = zdyn; g.innerHTML = '';
    // 바탕: 슬리브(왼쪽) / 심블(오른쪽)
    el('rect', { x: 0, y: 0, width: ZEX, height: H, fill: zsvg._gs }, g);
    el('line', { x1: 0, y1: Y0, x2: ZEX, y2: Y0, stroke: '#111418', 'stroke-width': 2 }, g);   // 기선

    // 버니어 부척 선(기선 = 0번)
    if (mode === 'vernier') {
      for (let j = 1; j <= 10; j++) {
        const y = yZoom(9 * j);
        el('line', { class: 'vn-line', 'data-j': j, x1: ZLAB, y1: y, x2: ZEX, y2: y, stroke: '#1d3550', 'stroke-width': 1.4 }, g);
      }
    }

    // 슬리브 눈금: 노출된 것(t <= q)만, 앞단에서 거리 (q - t) 만큼 왼쪽
    const ticks = el('g', {}, g), nums = el('g', {}, g);
    const tFirst = Math.max(0, Math.floor((q - (ZEX + 10) * 1000 / ZS) / 500) * 500);
    for (let t = tFirst; t <= q; t += 500) {
      const x = ZEX - (q - t) * ZS / 1000;
      if (x < -4) continue;
      const isMm = t % 1000 === 0;
      const mm = t / 1000;
      if (isMm) {
        const major = mm % 5 === 0;
        el('line', { class: 'sl-tick', 'data-t': t, x1: x, y1: Y0, x2: x, y2: Y0 + (major ? ZTK.five : ZTK.mm), stroke: '#111418', 'stroke-width': 2.4 }, ticks);
        const near = ZEX - x < 14;
        const tx = el('text', { x: near ? x - 3 : x, y: Y0 + (major ? ZTK.num + 4 : ZTK.num - 4), 'text-anchor': near ? 'end' : 'middle', 'font-size': major ? 24 : 16, 'font-weight': 700,
          fill: major ? '#111418' : '#4b5560', stroke: '#eef1f4', 'stroke-width': 5, 'paint-order': 'stroke', 'font-family': FONT }, nums);
        tx.textContent = mm;
      } else {
        el('line', { class: 'sl-tick', 'data-t': t, x1: x, y1: Y0, x2: x, y2: Y0 + ZTK.half, stroke: '#111418', 'stroke-width': 2.4 }, ticks);
      }
    }
    if (mode === 'vernier') {
      el('rect', { x: 0, y: 0, width: ZLAB, height: H, fill: '#d5dbe1' }, g);
      el('line', { x1: ZLAB, y1: 0, x2: ZLAB, y2: H, stroke: '#9aa4ad' }, g);
      for (let j = 0; j <= 10; j++) {
        const t = el('text', { x: ZLAB - 4, y: yZoom(9 * j) + 5, 'text-anchor': 'end', 'font-size': 14, 'font-weight': 700, fill: '#1d3550', 'font-family': FONT }, g);
        t.textContent = j;
      }
    }

    // 심블
    el('rect', { x: ZEX, y: 0, width: ZW - ZEX, height: H, fill: zsvg._gt }, g);
    const r = q % 500, n = Math.floor(r / 10);
    const dTop = Math.ceil(Y0 / (ZU * 10)) + 1, dBot = Math.ceil((H - Y0) / (ZU * 10)) + 1;
    for (let d = -dBot; d <= dTop; d++) {
      const v = n + d;
      const u10 = 10 * v - r;
      const y = yZoom(u10);
      if (y < -2 || y > H + 2) continue;
      const vv = ((v % 50) + 50) % 50;
      const major = vv % 5 === 0;
      el('line', { class: 'th-line', 'data-v': vv, 'data-u10': u10, x1: ZEX, y1: y, x2: ZEX + (major ? 50 : 32), y2: y, stroke: '#111418', 'stroke-width': 1.6 }, g);
      if (major) {
        const t = el('text', { x: ZEX + 58, y: y + 8, 'font-size': 22, 'font-weight': 700, fill: '#111418', 'font-family': FONT }, g);
        t.textContent = vv;
      }
    }
    el('line', { x1: ZEX, y1: 0, x2: ZEX, y2: H, stroke: '#3b444d', 'stroke-width': 2 }, g);   // 심블 앞단

    // 머리띠 (눈금 위에 덮어 글자 겹침 방지)
    el('rect', { x: 0, y: 0, width: ZW, height: 22, fill: '#c9d1d8' }, g);
    el('line', { x1: 0, y1: 22, x2: ZW, y2: 22, stroke: '#8c959e' }, g);
    const h1 = el('text', { x: mode === 'vernier' ? 4 : 8, y: 16, 'font-size': 12, 'font-weight': 600, fill: '#2b3137', 'font-family': FONT }, g);
    h1.textContent = mode === 'vernier' ? '부척 · 슬리브' : '슬리브 (기선 아래: 긴 선 1mm, 짧은 선 0.5mm)';
    const h2 = el('text', { x: ZW - 8, y: 16, 'text-anchor': 'end', 'font-size': 12, 'font-weight': 600, fill: '#2b3137', 'font-family': FONT }, g);
    h2.textContent = '심블 ×0.01mm';
  }

  function updateModeUI() {
    const info = MODE_INFO[mode];
    titleEl.textContent = TITLE + (mode === 'vernier' ? ' — 버니어 마이크로미터' : '') + ' (0~25mm, 최소눈금 ' + info.res + ')';
    btnN.setAttribute('aria-pressed', mode === 'normal' ? 'true' : 'false');
    btnV.setAttribute('aria-pressed', mode === 'vernier' ? 'true' : 'false');
    zcapV.style.display = mode === 'vernier' ? '' : 'none';
    svg._frameTxt.textContent = '0–25 mm   ' + info.res.replace('mm', ' mm');
  }

  function setMode(m) {
    if (m !== 'normal' && m !== 'vernier') return;
    closeAnswer();                           // 모드 전환 시 정답 패널은 항상 닫는다
    if (m === mode) return;
    mode = m;
    q = snapQ(q, mode);                      // 일반 모드로 돌아오면 0.01mm 단위로 맞춤
    updateModeUI();
    draw();
  }

  // ---- 입력: 세로 드래그(한 눈금씩), 가로 드래그(빠르게: 앞단이 포인터를 따라감), 휠, 키보드 ----
  function bindInput(target, unitsPerMm) {
    let dragging = false, pid = null, sx = 0, sy = 0, lastY = 0, acc = 0, axis = null, q0 = 0;
    target.addEventListener('pointerdown', function (e) {
      if (e.button !== undefined && e.button !== 0) return;
      dragging = true; pid = e.pointerId; sx = e.clientX; sy = e.clientY; lastY = e.clientY; acc = 0; axis = null; q0 = q;
      try { target.setPointerCapture(pid); } catch (err) {}
      target.focus({ preventScroll: true });
      e.preventDefault();
    });
    target.addEventListener('pointermove', function (e) {
      if (!dragging || e.pointerId !== pid) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (!axis) {
        if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.5) axis = 'x';
        else if (Math.abs(dy) > 0) axis = 'y';
      }
      if (axis === 'x') {
        const ctm = target.getScreenCTM();
        const scale = ctm && ctm.a ? ctm.a : 1;
        setState(q0 + (dx / scale) / unitsPerMm * 1000);
      } else if (axis === 'y') {
        const px = mode === 'vernier' ? 3 : 4;
        acc += lastY - e.clientY;
        lastY = e.clientY;
        const steps = acc > 0 ? Math.floor(acc / px) : Math.ceil(acc / px);
        if (steps !== 0) { acc -= steps * px; setState(q + steps * stepOf(mode)); }
      }
    });
    function end(e) {
      if (e.pointerId !== pid) return;
      dragging = false;
      try { target.releasePointerCapture(pid); } catch (err) {}
      pid = null;
    }
    target.addEventListener('pointerup', end);
    target.addEventListener('pointercancel', end);
    target.addEventListener('wheel', function (e) {
      e.preventDefault();
      if (e.deltaY === 0) return;
      setState(q + (e.deltaY < 0 ? 1 : -1) * (e.shiftKey ? 10 : 1) * stepOf(mode));
    }, { passive: false });
    target.addEventListener('keydown', function (e) {
      const s = stepOf(mode);
      let d = 0;
      if (e.key === 'ArrowUp') d = e.shiftKey ? 500 : s;
      else if (e.key === 'ArrowDown') d = e.shiftKey ? -500 : -s;
      else if (e.key === 'ArrowRight') d = 10 * s;
      else if (e.key === 'ArrowLeft') d = -10 * s;
      else return;
      e.preventDefault();
      setState(q + d);
    });
  }

  function closeAnswer() { if (ans) { ans.classList.remove('open'); ans.innerHTML = ''; } }

  function setState(v) {
    const next = snapQ(v, mode);
    if (next === q && drawn) return;
    q = next;
    closeAnswer();
    draw();
    drawn = true;
  }

  function reveal() {
    if (ans.classList.contains('open')) { closeAnswer(); return; }
    const a = answer(q, mode);
    let hint = '';
    if (a.nearHalf) hint += '<div class="gw-hint">0.5mm 눈금이 심블 앞단 밖으로 보이는지 먼저 확인하세요.</div>';
    if (a.vernierZero) hint += '<div class="gw-hint">부척 0번과 10번 선이 함께 일치하면 0.001mm 자리는 0입니다.</div>';
    ans.innerHTML = '<div class="gw-value">' + a.display + '</div><div>' + a.text + '</div>' + hint;
    ans.classList.add('open');
    try {
      const r = ans.getBoundingClientRect();
      const vh = window.innerHeight || document.documentElement.clientHeight;
      if (r.top < 0 || r.bottom > vh) ans.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    } catch (err) {}
  }

  function newProblem() {
    q = randomQ(drawn ? q : -1, mode);
    closeAnswer();
    draw();
    drawn = true;
  }

  window.GaugeWidget = {
    id: ID, title: TITLE, mount: mount, newProblem: newProblem, reveal: reveal,
    // answer(q[, mode]) / readParts(q): q는 1/1000mm 정수(0~25000). mode 생략 시 현재 모드.
    answer: answer, readParts: readParts,
    get boundaryPool() { return BOUNDARY_POOLS[mode]; },
    boundaryPools: BOUNDARY_POOLS,
    unit: 0.001,
    setMode: setMode, getMode: function () { return mode; },
    getState: function () { return q; }, setState: function (v) { setState(v); },
    _answer: answer, _getState: function () { return q; }, _setState: function (v) { setState(v); },
    _randomQ: randomQ, _formatQ: formatQ
  };
  document.addEventListener('DOMContentLoaded', function () {
    const r = document.getElementById('gw-root');
    if (r) mount(r);
  });
})();
</script>
</body>
</html>
